      '#markup': '<p><strong>3. In which of the following activities would your organisation be willing to maintain, further develop or expand core PARC achievements after the end of EU funding</strong></p><p>Please select one option for each applicable activity. Leave items blank if they are not applicable (e.g. if your organisation was not involved in that activity).</p><p>“Maintain” refers to continuing key outputs, capacities, or activities developed under PARC (e.g. use of tools and methods, operation of systems, data provision, or participation in networks), without significant additional resources or expansion. This may also include limited uptake of activities not previously implemented in your country, where feasible within existing or modest resources.</p><p>“Further develop or expand” refers to strengthening, broadening, or scaling up PARC-related activities, including the development of new capacities, wider implementation, increased coordination, or additional investments and resources.</p>'
