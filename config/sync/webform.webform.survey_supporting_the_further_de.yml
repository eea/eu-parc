id: survey_supporting_the_further_de
title: 'SURVEY SUPPORTING THE FURTHER DEVELOPMENT AND IMPLEMENTATION OF THE PARC PHASING-OUT STRATEGY AND ASSESSING PARTNERS’ READINESS FOR SUSTAINABILITY'
description: ''
categories: {  }
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Consent and context'
    description:
      '#type': checkbox
      '#title': 'I confirm that I have read and I accept the information stated above'
      '#description': '<h5><strong>SURVEY SUPPORTING THE FURTHER DEVELOPMENT AND IMPLEMENTATION OF THE PARC PHASING-OUT STRATEGY AND ASSESSING PARTNERS’ READINESS FOR SUSTAINABILITY</strong></h5><p>&nbsp;</p><p><span>This survey is carried out under Task 2.3 "Sustainability" as part of the development of the PARC exit strategy. It is addressed to all PARC institutional partners to support the further development and implementation of the PARC Phasing-out strategy and assess partners’ readiness for sustainability.</span></p><p><span>The survey has two sections:&nbsp;</span></p><ul><li data-list-item-id="e0ea69ac1cc4893386f29b506cf6a5717"><span>The first section focuses on the <strong>phasing-out strategy</strong> to assess the feasibility, level of ambition, and potential implementation pathways of PARC phasing-out scenarios at organisational level.&nbsp;</span></li></ul><p><span>As a reminder, in order to respond to the EC requirement for a phasing out strategy, three phasing out scenarios, reflecting different levels of ambition and integration (and budget), are proposed to be investigated: from (i) a comprehensive continuation and expansion model (scenario A) in which further work on what was already initiated in each field of activity of PARC depends on identified needs, varied funding streams and budgets available, to (ii) a middle scenario (scenario B) involving (adapted) continuation based primarily on public funding from the participating countries, and organisations to (iii) a model focused on solely preserving core achievements and ensuring the legacy of PARC (scenario C). This strategy does not engage the responsibility of GB members and does not constitute a formal commitment by national governments or their ministries. The strategy is a living document and will be reviewed and refined further, based on possible future developments regarding European and national commitments. The version dated 06/05/2026 endorsed by the GB is a first basis, given the uncertainties surrounding the future of European funding programmes as well as funding and priorities at national level. See this version </span><a href="https://www.eu-parc.eu/sites/default/files/2026-08/PARC phasing-out strategy_V1.0_forGBendorsement_June 2026_clean.pdf"><span>here</span></a><span>.</span></p><ul><li data-list-item-id="e50343eada2022930ee7f2669eb7eee81"><span>The second section investigates certain <strong>“One Substance, One Assessment (OSOA)”-related aspects</strong> to assess the readiness to support the implementation of the OSOA legislation.</span></li></ul><p style="margin-bottom:5px;"><span>''One substance – one assessment'' (OSOA) refers to a legislative framework of the European Union (EU) designed to enable more coordinated, efficient and transparent chemical safety assessments. The framework aims to facilitate shared access to reliable, high-quality data among relevant authorities, strengthen scientific cooperation on chemicals, improve the EU’s ability to anticipate and manage chemical risks. OSOA applies to a wide range of products regulated at EU level, including biocides, pesticides, food and toys. The legislative framework entered into force on 1 January 2026. The package consists of three legislative acts:&nbsp;</span></p><ul><li data-list-item-id="e2f4ae1e0f7fd931a3b500e0ac184575e"><a href="https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202502455"><span>A Regulation establishing a common data platform on chemicals and a monitoring and outlook framework for chemicals</span></a></li><li data-list-item-id="ea38d45db6a381d405bb413baf682413b"><a href="https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202502457"><span>A Regulation re-attributing technical tasks and improving cooperation among EU agencies</span></a></li><li data-list-item-id="e3720b09cabbf4749de07f98df14cdfda"><a href="https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202502456"><span>A Directive on the re-attribution of technical tasks to the European Chemicals Agency (ECHA)</span></a></li></ul><p><span>Although OSOA establishes a legal framework, its successful implementation will rely on effective sample collection, harmonised methodologies that are quality assured and controlled and operational experience, including through collaborative initiatives such as PARC.</span></p><p><span>The mapping of these results will feed into discussions with the Governing Board.&nbsp;</span></p><p><span>We kindly ask each PARC institutional partner to coordinate internally the completion of this survey. One consolidated response representing the partner''s perspective is expected from each organisation. <strong>The deadline for completing the survey is 30 November 2026.</strong></span></p><p><span>The collected information will be treated confidentially in accordance with the requirements of the General Data Protection Regulation (GDPR). Data obtained from this survey will be stored by the National Center for Public Health and Pharmacy (NCPHP) during the implementation of the PARC project and for up to five years after its completion.The data will be processed by the Task 2.3 partners for the purposes described above.</span></p><p><span>Thank you for taking the time to complete this survey.</span></p><p>If you have any questions, please contact us.</p><p>Task 2.3 Co-leaders</p><ul><li data-list-item-id="e0595e2a1cd3449c2b592d9928ddd70f8">Tamás Szigeti (<a href="mailto:szigeti.tamas@nngyk.gov.hu">szigeti.tamas@nngyk.gov.hu</a>)</li><li data-list-item-id="e31c282071057c9047fabc76c72b0e150">Adrienne Pittman (<a href="mailto:adrienne.pittman@anses.fr">adrienne.pittman@anses.fr</a>) &nbsp;</li><li data-list-item-id="ef2ce6d215eedc39907641a830fbefb3f">Robert Barouki (<a href="mailto:robert.barouki@parisdescartes.fr">robert.barouki@parisdescartes.fr</a>)</li></ul>'
