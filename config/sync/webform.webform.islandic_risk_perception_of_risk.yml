id: islandic_risk_perception_of_risk
title: 'Islandic Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in </span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(34, 34, 34);display:inline !important;float:none;font-family:&quot;Segoe UI&quot;;font-size:13.3333px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Islandic language</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Samþykki og samhengi'
    description:
      '#type': checkbox
      '#title': 'Ég staðfesti að ég hef lesið og samþykki upplýsingarnar sem koma fram hér að ofan'
      '#description': '<h4><span style="font-family:Satoshi;" lang="IS">Áhættuskynjun áhættumiðlara</span></h4><p>Þín skoðun skiptir máli! Láttu álit þitt skipta máli fyrir öruggari meðferð efna í Evrópu með því að taka þátt í stuttri könnun um „áhættuskynjun áhættumiðlara“. <span lang="EN-US">Rannsóknin er gerð á vegum PARC (https://www.eu-parc.eu/) sem stendur fyrir „Partnership for the Assessment of Risks from Chemicals“.</span></p><p>Um PARC: Evrópska samstarfsverkefnið um mat á áhættu af völdum efna (PARC) er samstarfsverkefni 30 landa og 3 Evrópustofnana (EEA, ECHA, EFSA), sem ætlað er að takast á við áskoranir sem tengjast nýsköpun í áhættumati efna. Markmið PARC er að veita stefnumótun í Evrópu og á landsvísu með traustum vísindagögnum um útsetningu almennings fyrir efnamengun og möguleg áhrif hennar á heilsu. Í landinu [nafn lands þíns] er könnunin í umsjón [nafn framkvæmdastofnunar].</p><p>Tilgangur þessarar könnunar: Við erum öll útsett fyrir fjölda efna, sum þeirra geta verið skaðleg heilsunni. Það er mikilvægt að upplýsa um hugsanlega áhættu af þessum efnum. Í þessari könnun stefnum við að því að öðlast dýpri innsýn í algenga starfshætti sem áhættumiðlarar nota, skoðanir þeirra á áhættuskynjun, sem og áhyggjur þeirra og þær áskoranir sem þeir standa frammi fyrir þegar þeir miðla upplýsingum um hættur og áhættu.</p><p>Fyrir hverja er könnunin: Þessi spurningalisti fjallar aðallega um miðlun upplýsinga um áhættu við venjulegar aðstæður, öfugt við neyðarsamskipti sem vísa til samskipta í aðstæðum sem krefjast brýnna ákvarðana. Það tekur um það bil 20 mínútur að svara könnuninni.</p><p>Hvað verður um upplýsingarnar sem safnað er: Upplýsingarnar sem safnað er verða nafnlausar og meðhöndlaðar sem trúnaðarmál í samræmi við kröfur almennu persónuverndarreglugerðarinnar (GDPR). Svörin verða sameinuð svörum annarra þátttakenda þegar rannsóknaraðilar PARC greina gögnin. Ef vísindalegar niðurstöður þessarar könnunar verða birtar eða kynntar á ráðstefnu verða gögnin sýnd í heild sinni.</p><p>Réttur til að hafna þátttöku eða hætta: Þátttaka þín er alfarið sjálfviljug. Með því að fylla út og senda inn þessa könnun gefur þú til kynna samþykki þitt fyrir þátttöku í henni. Þú getur hætt þátttöku hvenær sem er eða ákveðið að taka ekki þátt yfirhöfuð, án þess að gefa upp ástæður og án nokkurra afleiðinga.</p><p>Þakka þér fyrir tíma þinn og samvinnu!</p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
