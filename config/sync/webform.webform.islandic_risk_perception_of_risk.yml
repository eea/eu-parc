  section_6_language:
    '#type': webform_wizard_page
    '#title': "6.\tKafli: Tungumál"
    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': "6.1.\tGefum okkur að rangar upplýsingar/orðrómur sé á samfélagsmiðlum um áhættu tengda reykingum og kadmíum. Hvaða af eftirfarandi yfirlýsingum viltu helst nota?"
      '#options':
        'A: Við reykingar á sígarettum er frásog kadmíums í lungum 10–50%. Reykingafólk hefur um 1,5 µg/L styrk kadmíums í blóði og um 20–30 µg/g blautvigt í nýrnaberki. Þeir sem reykja ekki eru með 4–5 sinnum lægri styrk kadmíums í blóði og helmingi lægri styrk kadmíums í nýrnaberki. Sýnt hefur verið fram á að kadmíum veldur lungnakrabbameini.': 'A: Við reykingar á sígarettum er frásog kadmíums í lungum 10–50%. Reykingafólk hefur um 1,5 µg/L styrk kadmíums í blóði og um 20–30 µg/g blautvigt í nýrnaberki. Þeir sem reykja ekki eru með 4–5 sinnum lægri styrk kadmíums í blóði og helmingi lægri styrk kadmíums í nýrnaberki. Sýnt hefur verið fram á að kadmíum veldur lungnakrabbameini.'
        'B: Við sígarettureykingar er upptaka kadmíums í lungum 10–50% en upptaka í meltingarvegi er aðeins nokkur prósent. Reykingafólk hefur um 4–5 sinnum hærri styrk kadmíums í blóði (um 1,5 µg/l) og tvöfalt hærri styrk kadmíums í nýrnaberki (um 20–30 µg/g blautvigt) en þeir sem ekki reykja. Sýnt hefur verið fram á að kadmíum valdi lungnakrabbameini en takmarkaðar vísbendingar eru um að það tengist krabbameini í nýrum, lifur og blöðruhálskirtli.': 'B: Við sígarettureykingar er upptaka kadmíums í lungum 10–50% en upptaka í meltingarvegi er aðeins nokkur prósent. Reykingafólk hefur um 4–5 sinnum hærri styrk kadmíums í blóði (um 1,5 µg/l) og tvöfalt hærri styrk kadmíums í nýrnaberki (um 20–30 µg/g blautvigt) en þeir sem ekki reykja. Sýnt hefur verið fram á að kadmíum valdi lungnakrabbameini en takmarkaðar vísbendingar eru um að það tengist krabbameini í nýrum, lifur og blöðruhálskirtli.'
        'C: Við sígarettureykingar er upptaka kadmíums afar mikil í lungunum en upptakan í meltingarveginum er minni. Reykingafólk hefur marktækt hærri styrk kadmíums í blóði og í nýrnaberki. Kadmíum er krabbameinsvaldandi.': 'C: Við sígarettureykingar er upptaka kadmíums afar mikil í lungunum en upptakan í meltingarveginum er minni. Reykingafólk hefur marktækt hærri styrk kadmíums í blóði og í nýrnaberki. Kadmíum er krabbameinsvaldandi.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tEftirfarandi vísindalega fullyrðing segir að: „Akrylamíð er efni sem myndast náttúrulega í sterkjuríkum matvælum þegar þau eru elduð við háan hita (yfir 120°C). Þegar akrylamíð er til staðar í matvælum getur það hugsanlega aukið hættuna á að neytendur á öllum aldri fái krabbamein. Sem betur fer eru til leiðir til að draga úr magni akrýlamíðs í matvælum“. Hvaða yfirlýsingu myndir þú velja ef þú ættir að ráðleggja neytendum um að lágmarka magn akrýlamíðs við matreiðslu heima?"
      '#options':
        'Markmiðið er að ná fram gylltum lit (eða ljósari) þegar þú steikir, bakar, ristar eða grillar sterkjuríkan mat og forðastu ofeldaðan mat til að stuðla að betri heilsu.': 'Markmiðið er að ná fram gylltum lit (eða ljósari) þegar þú steikir, bakar, ristar eða grillar sterkjuríkan mat og forðastu ofeldaðan mat til að stuðla að betri heilsu.'
        'Því lengur sem eldað er og því hærra sem hitastigið er, því meira akrýlamíð getur myndast. Minni eldunartími og lægra hitastig hjálpar til við að draga úr myndun akrýlamíðs.': 'Því lengur sem eldað er og því hærra sem hitastigið er, því meira akrýlamíð getur myndast. Minni eldunartími og lægra hitastig hjálpar til við að draga úr myndun akrýlamíðs.'
      '#required': true
