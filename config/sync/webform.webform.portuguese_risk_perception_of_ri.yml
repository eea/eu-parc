      '#type': webform_likert
      '#title': "3.3.\tIndique em que medida concorda ou discorda das declarações sobre comunicação dos riscos."
      '#required': true
      '#questions':
        'Na comunicação dos riscos, é importante distinguir entre perigo e risco.': 'Na comunicação dos riscos, é importante distinguir entre perigo e risco.'
        'A comunicação dos riscos não deve ser influenciada pela perceção do risco por parte do público.': 'A comunicação dos riscos não deve ser influenciada pela perceção do risco por parte do público.'
        'Os princípios (por exemplo, objetividade, imparcialidade) em que se baseia a comunicação dos riscos são consistentes em todos os': 'Os princípios (por exemplo, objetividade, imparcialidade) em que se baseia a comunicação dos riscos são consistentes em todos os setores (por exemplo, riscos químicos, doenças transmissíveis).'
