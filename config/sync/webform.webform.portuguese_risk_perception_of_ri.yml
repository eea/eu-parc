    please_rate_statements_on_risk_perception_to_which_degree_you_ag:
      '#type': webform_likert
      '#title': "4.1.\tIndique em que medida concorda ou discorda das declarações sobre perceção dos riscos."
      '#required': true
      '#questions':
        'As perceções dos riscos das pessoas incluem/dependem das suas convicções e atitudes.': 'As perceções dos riscos das pessoas incluem/dependem das suas convicções e atitudes.'
        'As perceções dos riscos não são influenciadas pelos juízos e sentimentos das pessoas (experiência pessoal).': 'As perceções dos riscos não são influenciadas pelos juízos e sentimentos das pessoas (experiência pessoal).'
        'As perceções dos riscos refletem as atitudes culturais e sociais mais amplas que as pessoas adotam em relação aos riscos e aos s': 'As perceções dos riscos refletem as atitudes culturais e sociais mais amplas que as pessoas adotam em relação aos riscos e aos seus benefícios.'
        'A comunicação dos riscos deve basear-se em dados provenientes de avaliações de riscos, mas deve também ter em conta a forma como': 'A comunicação dos riscos deve basear-se em dados provenientes de avaliações de riscos, mas deve também ter em conta a forma como o público em geral percebe e avalia a gravidade dos riscos.'
        'As pessoas que já passaram por uma situação relacionada com um perigo tendem a sentir que há mais probabilidades de voltarem a e': 'As pessoas que já passaram por uma situação relacionada com um perigo tendem a sentir que há mais probabilidades de voltarem a enfrentá-lo, em comparação com as pessoas que nunca passaram por esse perigo.'
        'Quando as pessoas tomam conhecimento de um risco pela primeira vez, tendem a achar que esse novo risco tem mais probabilidades d': 'Quando as pessoas tomam conhecimento de um risco pela primeira vez, tendem a achar que esse novo risco tem mais probabilidades de ocorrer do que outros riscos já conhecidos'
        'Quanto mais conhecimentos específicos as pessoas adquirem sobre um perigo, menos confiam na sua intuição quanto ao risco associa': 'Quanto mais conhecimentos específicos as pessoas adquirem sobre um perigo, menos confiam na sua intuição quanto ao risco associado a esse perigo.'
        'A confiança no comunicador de riscos é mais importante do que a informação.': 'A confiança no comunicador de riscos é mais importante do que a informação.'
      '#answers':
        'Discordo totalmente': 'Discordo totalmente'
        'Discordo parcialmente': 'Discordo parcialmente'
        'Não concordo nem discordo': 'Não concordo nem discordo'
        'Concordo parcialmente': 'Concordo parcialmente'
        'Concordo plenamente': 'Concordo plenamente'
