    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': "6.1.\tImaginemos que correm informações erradas ou rumores nas redes sociais sobre os riscos associados ao tabagismo e ao cádmio. Por qual das seguintes afirmações optaria?"
      '#options':
        'R: Ao fumar cigarros, a absorção de cádmio nos pulmões é de 10 a 50 %. Os fumadores apresentam concentrações de cádmio no sangue de cerca de 1,5 μg/l e concentrações de cádmio no córtex renal de cerca de 20-30 μg/g de peso húmido. Os não fumadores apresentam concentrações de cádmio no sangue 4 a 5 vezes mais baixas e concentrações de cádmio no córtex renal duas vezes mais baixas. Está comprovado que o cádmio causa cancro do pulmão.': 'R: Ao fumar cigarros, a absorção de cádmio nos pulmões é de 10 a 50 %. Os fumadores apresentam concentrações de cádmio no sangue de cerca de 1,5 μg/l e concentrações de cádmio no córtex renal de cerca de 20-30 μg/g de peso húmido. Os não fumadores apresentam concentrações de cádmio no sangue 4 a 5 vezes mais baixas e concentrações de cádmio no córtex renal duas vezes mais baixas. Está comprovado que o cádmio causa cancro do pulmão.'
        'B: Ao fumar cigarros, a absorção de cádmio nos pulmões é de 10-50 %, enquanto a absorção no trato gastrointestinal é de apenas alguns pontos percentuais. Os fumadores apresentam concentrações de cádmio no sangue cerca de 4 a 5 vezes superiores (cerca de 1,5 μg/l) e concentrações de cádmio no córtex renal duas vezes superiores (cerca de 20-30 μg/g de peso húmido) às dos não fumadores. Foi demonstrado que o cádmio causa cancro do pulmão, mas existem poucas evidências de que esteja associado ao cancro do rim': 'B: Ao fumar cigarros, a absorção de cádmio nos pulmões é de 10-50 %, enquanto a absorção no trato gastrointestinal é de apenas alguns pontos percentuais. Os fumadores apresentam concentrações de cádmio no sangue cerca de 4 a 5 vezes superiores (cerca de 1,5 μg/l) e concentrações de cádmio no córtex renal duas vezes superiores (cerca de 20-30 μg/g de peso húmido) às dos não fumadores. Foi demonstrado que o cádmio causa cancro do pulmão, mas existem poucas evidências de que esteja associado ao cancro do rim'
        'C: Ao fumar cigarros, a absorção de cádmio é extremamente elevada nos pulmões, enquanto a absorção no trato gastrointestinal é menor. Os fumadores apresentam concentrações de cádmio no sangue e no córtex renal significativamente mais elevadas. O cádmio é cancerígeno.': 'C: Ao fumar cigarros, a absorção de cádmio é extremamente elevada nos pulmões, enquanto a absorção no trato gastrointestinal é menor. Os fumadores apresentam concentrações de cádmio no sangue e no córtex renal significativamente mais elevadas. O cádmio é cancerígeno.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tA seguinte declaração científica afirma que: «A acrilamida é uma substância química que se forma naturalmente em alimentos ricos em amido quando estes são cozinhados a altas temperaturas (acima dos 120 °C).» Quando a acrilamida está presente nos alimentos, pode potencialmente aumentar o risco de os consumidores de todas as idades desenvolverem cancro. Felizmente, existem formas de reduzir os níveis de acrilamida nos alimentos. Que afirmação escolheria se tivesse de aconselhar os consumidores sobre como minimizar os níveis de acrilamida na cozinha doméstica?"
      '#options':
        'Procure obter uma cor amarelo-dourada (ou mais clara) ao fritar, assar, torrar ou assar no forno alimentos ricos em amido e evite cozinhar os alimentos a temperaturas demasiado elevadas para uma saúde melhor.': 'Procure obter uma cor amarelo-dourada (ou mais clara) ao fritar, assar, torrar ou assar no forno alimentos ricos em amido e evite cozinhar os alimentos a temperaturas demasiado elevadas para uma saúde melhor.'
        'Os tempos de cozedura prolongados e as temperaturas muito elevadas geram mais acrilamida — substância com potencial cancerígeno para os seres humanos — do que os tempos de cozedura curtos e a temperaturas mais baixas.': 'Os tempos de cozedura prolongados e as temperaturas muito elevadas geram mais acrilamida — substância com potencial cancerígeno para os seres humanos — do que os tempos de cozedura curtos e a temperaturas mais baixas.'
      '#required': true
