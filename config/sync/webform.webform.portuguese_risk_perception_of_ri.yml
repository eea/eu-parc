id: portuguese_risk_perception_of_ri
title: 'Portuguese Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in </span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(34, 34, 34);display:inline !important;float:none;font-family:&quot;Segoe UI&quot;;font-size:13.3333px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Portuguese Language</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Consentimento e contexto'
    description:
      '#type': checkbox
      '#title': 'Confirmo que li e aceito as informações apresentadas acima.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="PT">Perceção dos riscos por parte dos comunicadores de riscos</span></h4><p class="p1">A sua opinião é importante! Faça com que a sua opinião conte para uma gestão mais segura dos produtos químicos na Europa, participando num breve inquérito sobre a perceção dos riscos por parte dos comunicadores de riscos. O estudo é realizado no âmbito da PARC (https://www.eu-parc.eu/), cuja sigla significa «Partnership for the Assessment of Risks from Chemicals» [Parceria para a Avaliação dos Riscos dos Produtos Químicos].</p><p class="p2">Sobre a PARC: A Parceria para a Avaliação dos Riscos dos Produtos Químicos (PARC) é uma iniciativa conjunta de 30 países e 3 agências europeias (AEA, ECHA, EFSA<span class="s1">[SR1]</span>&nbsp;), concebida para dar resposta aos desafios associados à inovação na avaliação dos riscos químicos. O objetivo da PARC é informar a elaboração de políticas na Europa e a nível nacional com dados científicos sólidos sobre a exposição dos cidadãos a poluentes químicos e os seus possíveis efeitos na saúde. Em [nome do seu país], o inquérito é coordenado por [nome da organização de execução].</p><p class="p2">Objetivo do presente inquérito: Estamos todos expostos a uma infinidade de produtos químicos, alguns dos quais podem ser prejudiciais à saúde. É fundamental comunicar os riscos potenciais associados a estas substâncias químicas. Neste inquérito, pretendemos obter mais informações sobre as práticas comuns utilizadas pelos comunicadores de riscos, as suas convicções sobre a perceção dos riscos, bem como as suas preocupações e os desafios que enfrentam quando comunicam perigos e riscos.</p><p class="p2">A quem é dirigido o inquérito: Este questionário aborda principalmente a comunicação de riscos em situações do quotidiano, em contraposição à comunicação de crise, que se refere à comunicação em situações que exigem decisões urgentes. Demora cerca de 20&nbsp;minutos a concluir.</p><p class="p2">O que acontecerá com as informações recolhidas: As informações recolhidas serão anónimas e serão tratadas de forma confidencial, em conformidade com os requisitos do Regulamento Geral sobre a Proteção de Dados (RGPD). As respostas serão combinadas com outras respostas quando analisadas pelos parceiros de investigação da PARC. Se as conclusões científicas deste inquérito forem publicadas ou apresentadas numa conferência, os resultados serão agregados.</p><p class="p2">Direito de recusa ou de retirada: A sua participação é totalmente voluntária. Ao preencher e enviar este inquérito, está a dar o seu consentimento para participar no inquérito. Pode desistir da participação a qualquer momento ou optar por não participar, sem ter de justificar a sua decisão e sem quaisquer consequências.<br><br><strong>Agradecemos a sua colaboração e disponibilidade</strong></p><h4>&nbsp;</h4>'
      '#description_display': before
      '#required': true
