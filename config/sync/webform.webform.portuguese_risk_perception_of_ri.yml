        'Informação sobre a sobrestimação do risco pelo público (por exemplo, quando o responsável pela comunicação de riscos dispõe de i': 'Informação sobre a sobrestimação do risco pelo público (por exemplo, quando o responsável pela comunicação de riscos dispõe de informações que indicam que o público considera certas substâncias químicas mais perigosas do que realmente são)'
