id: latvian_risk_perception_of_risk
title: 'Latvian Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in </span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(34, 34, 34);display:inline !important;float:none;font-family:&quot;Segoe UI&quot;;font-size:13.3333px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Latvian language</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Piekrišana un konteksts'
    description:
      '#type': checkbox
      '#title': 'Apstiprinu, ka esmu iepazinies/-usies ar iepriekš sniegto informāciju un tai piekrītu.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="LV">Riska komunikatoru riska uztvere</span></h4><p><span lang="LV">Jūsu viedoklim ir nozīme! Ietekmējiet drošāku ķīmisko vielu pārvaldību Eiropā, piedaloties īsā aptaujā par tēmu “Riska komunikatoru riska uztvere”. Pētījums tiek veikts PARC (https://www.eu-parc.eu/) ietvaros, kas ir saīsinājums no “Partnerība ķīmisko vieluradītā riska novērtēšanai”.</span></p><p><span lang="LV">Par PARC: Eiropas Partnerība ķīmisko vielu radītā riska novērtēšanai (PARC) ir 30 valstu un trīs Eiropas aģentūru (EEA, ECHA, EFSA) kopīga iniciatīva, kuras mērķis ir risināt problēmas, kas saistītas ar inovatīvu ķīmisko vielu radītā riska novērtēšanu. PARC mērķis ir informēt politikas veidotājus Eiropas un valstu līmenī, sniedzot pamatotus zinātniskus datus par iedzīvotāju pakļautību ķīmisko piesārņotāju iedarbībai un to iespējamo ietekmi uz veselību. [Jūsu valsts nosaukums] apsekojumu koordinē [īstenotājas organizācijas nosaukums].</span></p><p><span lang="LV">Šīs aptaujas mērķis: Mēs visi esam pakļauti daudzām ķīmiskajām vielām, no kurām dažas var kaitēt veselībai. Ir ļoti svarīgi informēt sabiedrību par šo ķīmisko vielu&nbsp; potenciāli&nbsp;radīto risku. Šīs aptaujas mērķis ir iegūt plašāku ieskatu riska komunikatoru izmantotajās vispārpieņemtajās metodēs, viņu uzskatos par riska uztveri, kā arī viņu bažās un problēmās, ar kurām viņi saskaras, informējot sabiedrību par apdraudējumiem un riskiem.</span></p><p><span lang="LV">Kam ir adresēts šis apsekojums: Šī anketa galvenokārt veltīta ikdienišķai riska komunikācijai, nevis komunikācijai krīzes apstākļos,&nbsp;kad nepieciešams pieņemt steidzamus lēmumus. Anketas aizpildīšana aizņems aptuveni 20 minūtes.</span></p><p><span lang="LV">Kas notiks ar savākto informāciju: Savāktā informācija būs anonīma, un tā tiks apstrādāta, ievērojot konfidencialitāti, saskaņā ar Vispārīgās datu aizsardzības regulas (GDPR) prasībām. Atbildes tiks apvienotas ar citām atbildēm, kad tās analizēs PARC pētniecības partneri. Ja šī pētījuma zinātniskie secinājumi tiks publicēti vai prezentēti konferencē, rezultāti tiks apkopoti.</span></p><p><span lang="LV">Atteikuma vai atsaukšanas tiesības: Jūsu dalība ir pilnībā brīvprātīga. Aizpildot un iesniedzot šo aptauju, Jūs norādāt, ka piekrītat piedalīties šajā aptaujā. Jums ir tiesības jebkurā brīdī atteikties no dalības vai vispār nepiedalīties, neminot iemeslus un nesaskaroties ar nekādām sekām.</span></p><p><span lang="LV"><strong>Pateicamies par ieguldīto laiku un sadarbību.</strong></span></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
