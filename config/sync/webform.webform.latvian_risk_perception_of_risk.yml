    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': "6.1.\tPieņemsim, ka sociālajos tīklos izplatās nepatiesa informācija vai baumas par smēķēšanas un kadmija radīto risku. Kurus no šiem apgalvojumiem Jūs vēlētos izmantot?"
      '#options':
        'A: Smēķējot cigaretes, kadmija absorbcija plaušās ir 10–50 %. Smēķētājiem kadmija koncentrācija asinīs ir aptuveni 1,5 μg/l, bet kadmija koncentrācija nierēs ir aptuveni 20–30 μg/g slapjā svara. Nesmēķētājiem kadmija koncentrācija asinīs ir 4-5 reizes zemāka, un kadmija koncentrācija nieru garozā ir divas reizes zemāka. Ir pierādīts, ka kadmijs izraisa plaušu vēzi.': 'A: Smēķējot cigaretes, kadmija absorbcija plaušās ir 10–50 %. Smēķētājiem kadmija koncentrācija asinīs ir aptuveni 1,5 μg/l, bet kadmija koncentrācija nierēs ir aptuveni 20–30 μg/g slapjā svara. Nesmēķētājiem kadmija koncentrācija asinīs ir 4-5 reizes zemāka, un kadmija koncentrācija nieru garozā ir divas reizes zemāka. Ir pierādīts, ka kadmijs izraisa plaušu vēzi.'
        'B: Smēķējot cigaretes, kadmija absorbcija plaušās ir 10–50 %, savukārt absorbcija kuņģa un zarnu traktā ir tikai daži procenti. Smēķētājiem ir aptuveni 4–5 reizes augstāka kadmija koncentrācija asinīs (aptuveni 1,5 μg/l) un divreiz augstāka kadmija koncentrācija nieru garozā (aptuveni 20–30 μg/g slapjā svara) nekā nesmēķētājiem. Ir pierādīts, ka kadmijs izraisa plaušu vēzi, taču ir tikai ierobežoti pierādījumi par to, ka tas ir saistīts ar nieru, aknu un prostatas vēzi.': 'B: Smēķējot cigaretes, kadmija absorbcija plaušās ir 10–50 %, savukārt absorbcija kuņģa un zarnu traktā ir tikai daži procenti. Smēķētājiem ir aptuveni 4–5 reizes augstāka kadmija koncentrācija asinīs (aptuveni 1,5 μg/l) un divreiz augstāka kadmija koncentrācija nieru garozā (aptuveni 20–30 μg/g slapjā svara) nekā nesmēķētājiem. Ir pierādīts, ka kadmijs izraisa plaušu vēzi, taču ir tikai ierobežoti pierādījumi par to, ka tas ir saistīts ar nieru, aknu un prostatas vēzi.'
        'C: Smēķējot cigaretes, kadmija absorbcija plaušās ir ārkārtīgi augsta, savukārt absorbcija kuņģa un zarnu traktā ir zemāka. Smēķētājiem asinīs un nieru garozā ir ievērojami augstāka kadmija koncentrācija. Kadmijs ir kancerogēns.': 'C: Smēķējot cigaretes, kadmija absorbcija plaušās ir ārkārtīgi augsta, savukārt absorbcija kuņģa un zarnu traktā ir zemāka. Smēķētājiem asinīs un nieru garozā ir ievērojami augstāka kadmija koncentrācija. Kadmijs ir kancerogēns.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "1.29.\tŠajā zinātniskajā paziņojumā teikts, ka: “Akrilamīds ir ķīmiska viela, kas dabīgi veidojas cietes saturošos pārtikas produktos, tos termiski apstrādājot augstā temperatūrā (virs 120°C). Ja pārtikā ir akrilamīds, tas var potenciāli palielināt vēža attīstības risku patērētājiem jebkurā vecumā. “Par laimi, ir veidi, kā samazināt akrilamīda saturu pārtikā”. Kuru apgalvojumu Jūs izvēlētos, ja Jums būtu jāsniedz patērētājiem ieteikumi par to, kā samazināt akrilamīda saturu mājās gatavotos ēdienos?"
      '#options':
        'Centieties iegūt zeltaini dzeltenu krāsu (vai gaišāku), cepot, grauzdējot vai apgrauzdējot cieti saturošu pārtiku, un labākai veselībai izvairieties no pārceptaspārtikas.': 'Centieties iegūt zeltaini dzeltenu krāsu (vai gaišāku), cepot, grauzdējot vai apgrauzdējot cieti saturošu pārtiku, un labākai veselībai izvairieties no pārceptaspārtikas.'
        'Ilgs vārīšanas laiks un augstāka temperatūra rada vairāk akrilamīda, kas cilvēkiem var izraisīt vēzi, nekā īss vārīšanas laiks un zemāka temperatūra.': 'Ilgs vārīšanas laiks un augstāka temperatūra rada vairāk akrilamīda, kas cilvēkiem var izraisīt vēzi, nekā īss vārīšanas laiks un zemāka temperatūra.'
      '#required': true
