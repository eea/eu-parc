    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tIn een wetenschappelijke verklaring staat het volgende te lezen: “Acrylamide is een chemische stof die van nature ontstaat in zetmeelrijke voedingsmiddelen wanneer deze bij hoge temperaturen (boven 120 °C) worden bereid. Wanneer acrylamide in voedsel aanwezig is, kan dit het risico op kanker bij consumenten van alle leeftijden mogelijk vergroten. Gelukkig zijn er manieren om het acrylamidegehalte in voedsel te verlagen.” Welke uitspraak zou u kiezen als u consumenten advies moest geven over het minimaliseren van het acrylamidegehalte in zelfgemaakte maaltijden?"
      '#options':
        'Streef naar een goudgele kleur (of lichter) bij het frituren, bakken, braden of roosteren van zetmeelrijke voedingsmiddelen en vermijd oververhitte voedingsmiddelen voor een betere gezondheid.': 'Streef naar een goudgele kleur (of lichter) bij het frituren, bakken, braden of roosteren van zetmeelrijke voedingsmiddelen en vermijd oververhitte voedingsmiddelen voor een betere gezondheid.'
        'Bij lange bereidingstijden en hogere temperaturen ontstaat er meer acrylamide – een stof die bij mensen kanker kan veroorzaken – dan bij korte bereidingstijden en lagere temperaturen.': 'Bij lange bereidingstijden en hogere temperaturen ontstaat er meer acrylamide – een stof die bij mensen kanker kan veroorzaken – dan bij korte bereidingstijden en lagere temperaturen.'
      '#required': true
