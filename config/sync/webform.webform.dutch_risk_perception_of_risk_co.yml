  section_3_developing_risk_communication:
    '#type': webform_wizard_page
    '#title': "3.\tSegment: ontwikkeling van risicocommunicatie"
    when_communicating_with_the_target_audience_on_risk_how_importan:
      '#type': webform_likert
      '#title': "3.1.\tHoe belangrijk is het om in communicatie met de doelgroep over risico’s onderstaande elementen op te nemen?"
      '#required': true
      '#questions':
        'Visuele weergave van risico’s met grafieken, diagrammen, afbeeldingen en kaarten': 'Visuele weergave van risico’s met grafieken, diagrammen, afbeeldingen en kaarten'
        'Vergelijkingen tussen verschillende gevaren naargelang de waarschijnlijkheid ervan': 'Vergelijkingen tussen verschillende gevaren naargelang de waarschijnlijkheid ervan'
        'Beschrijving van alle onzekerheden in verband met het risico': 'Beschrijving van alle onzekerheden in verband met het risico'
        'Numerieke grenswaarden (bijv. de toelaatbare dagelijkse inname van een bepaalde chemische stof, uitgedrukt in getallen)': 'Numerieke grenswaarden (bijv. de toelaatbare dagelijkse inname van een bepaalde chemische stof, uitgedrukt in getallen)'
        'Beschrijving van verschillende risico’s voor verschillende groepen mensen (bijv. verschil in risico tussen verschillende beroeps': 'Beschrijving van verschillende risico’s voor verschillende groepen mensen (bijv. verschil in risico tussen verschillende beroepsgroepen)'
        'Informatie over het verschil tussen langdurige en kortstondige blootstelling aan gevaren': 'Informatie over het verschil tussen langdurige en kortstondige blootstelling aan gevaren'
        'Informatie over eventuele onderschatting van risico’s door het publiek (bijv. wanneer de risicocommunicator weet dat het publiek': 'Informatie over eventuele onderschatting van risico’s door het publiek (bijv. wanneer de risicocommunicator weet dat het publiek het gevaar van bepaalde chemische stoffen te laag inschat)'
        'Informatie over eventuele overschatting van risico’s door het publiek (bijv. wanneer de risicocommunicator weet dat het publiek ': 'Informatie over eventuele overschatting van risico’s door het publiek (bijv. wanneer de risicocommunicator weet dat het publiek het gevaar van bepaalde chemische stoffen te hoog inschat)'
        'Beschrijving van strategieën om blootstelling aan gevaren te voorkomen': 'Beschrijving van strategieën om blootstelling aan gevaren te voorkomen'
      '#answers':
        'Helemaal niet belangrijk': 'Helemaal niet belangrijk'
        'Enigszins belangrijk': 'Enigszins belangrijk'
        'Redelijk belangrijk': 'Redelijk belangrijk'
        'Vrij belangrijk': 'Vrij belangrijk'
        'Heel belangrijk': 'Heel belangrijk'
