  section_4_role_of_risk_communicator:
    '#type': webform_wizard_page
    '#title': "4.\tSegment: rol van de risicocommunicator"
    please_rate_statements_on_risk_perception_to_which_degree_you_ag:
      '#type': webform_likert
      '#title': "4.1.\tGeef aan in hoeverre u het eens of oneens bent met de volgende uitspraken over risicoperceptie."
      '#required': true
      '#questions':
        'De risicoperceptie van mensen omvat/hangt af van hun overtuigingen en houdingen.': 'De risicoperceptie van mensen omvat/hangt af van hun overtuigingen en houdingen.'
        'Risicopercepties worden niet beïnvloed door de oordelen en gevoelens van mensen (persoonlijke ervaring).': 'Risicopercepties worden niet beïnvloed door de oordelen en gevoelens van mensen (persoonlijke ervaring).'
        'Risicopercepties weerspiegelen de bredere culturele en sociale houdingen die mensen aannemen ten aanzien van gevaren en hun voor': 'Risicopercepties weerspiegelen de bredere culturele en sociale houdingen die mensen aannemen ten aanzien van gevaren en hun voordelen.'
        'Risicocommunicatie moet gebaseerd zijn op bevindingen uit risicobeoordelingen, maar moet ook rekening houden met de manier waaro': 'Risicocommunicatie moet gebaseerd zijn op bevindingen uit risicobeoordelingen, maar moet ook rekening houden met de manier waarop leken risico’s inschatten en het belang dat zij eraan hechten.'
        'Mensen die al eens een incident in verband met een bepaald gevaar hebben meegemaakt, schatten de kans dat ze dit opnieuw meemake': 'Mensen die al eens een incident in verband met een bepaald gevaar hebben meegemaakt, schatten de kans dat ze dit opnieuw meemaken doorgaans groter in dan mensen die dat gevaar nog nooit hebben ervaren.'
        'Wanneer mensen voor het eerst over een gevaar horen, denken ze vaak dat de kans dat dit nieuwe gevaar zich voordoet groter is da': 'Wanneer mensen voor het eerst over een gevaar horen, denken ze vaak dat de kans dat dit nieuwe gevaar zich voordoet groter is dan voor andere, bekende gevaren.'
