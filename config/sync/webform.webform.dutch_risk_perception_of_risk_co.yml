    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': "6.1.\tBeeld u in dat er op sociale media misinformatie/geruchten de ronde doen over risico’s in verband met roken en cadmium. Welke van de volgende verklaringen zou u dan het liefst gebruiken?"
      '#options':
        'A: Bij het roken van sigaretten wordt 10 tot 50 % van het cadmiumgehalte opgenomen in de longen. Rokers hebben een cadmiumconcentratie in het bloed van ongeveer 1,5 μg/l en een cadmiumconcentratie in de niercortex van ongeveer 20-30 μg/g nat gewicht. Niet-rokers hebben vier tot vijf keer lagere cadmiumconcentraties in het bloed en twee keer zo lage cadmiumconcentraties in de niercortex. Er is aangetoond dat cadmium longkanker veroorzaakt.': 'A: Bij het roken van sigaretten wordt 10 tot 50 % van het cadmiumgehalte opgenomen in de longen. Rokers hebben een cadmiumconcentratie in het bloed van ongeveer 1,5 μg/l en een cadmiumconcentratie in de niercortex van ongeveer 20-30 μg/g nat gewicht. Niet-rokers hebben vier tot vijf keer lagere cadmiumconcentraties in het bloed en twee keer zo lage cadmiumconcentraties in de niercortex. Er is aangetoond dat cadmium longkanker veroorzaakt.'
        'B: Bij het roken van sigaretten wordt 10 tot 50 % van het cadmiumgehalte opgenomen in de longen, terwijl slechts een paar procent in het maag-darmkanaal terechtkomt. Bij rokers is de cadmiumconcentratie in het bloed vier tot vijf keer zo hoog (ongeveer 1,5 μg/l) en de cadmiumconcentratie in de niercortex twee keer zo hoog (ongeveer 20-30 μg/g nat gewicht) als bij niet-rokers. Er is aangetoond dat cadmium longkanker veroorzaakt, maar er zijn weinig aanwijzingen dat het in verband kan worden gebracht met ni': 'B: Bij het roken van sigaretten wordt 10 tot 50 % van het cadmiumgehalte opgenomen in de longen, terwijl slechts een paar procent in het maag-darmkanaal terechtkomt. Bij rokers is de cadmiumconcentratie in het bloed vier tot vijf keer zo hoog (ongeveer 1,5 μg/l) en de cadmiumconcentratie in de niercortex twee keer zo hoog (ongeveer 20-30 μg/g nat gewicht) als bij niet-rokers. Er is aangetoond dat cadmium longkanker veroorzaakt, maar er zijn weinig aanwijzingen dat het in verband kan worden gebracht met ni'
        'C: Bij het roken van sigaretten komt heel veel cadmium in de longen terecht, terwijl de opname in het maag-darmkanaal lager is. Rokers hebben aanzienlijk hogere cadmiumconcentraties in het bloed en in de niercortex. Cadmium is kankerverwekkend.': 'C: Bij het roken van sigaretten komt heel veel cadmium in de longen terecht, terwijl de opname in het maag-darmkanaal lager is. Rokers hebben aanzienlijk hogere cadmiumconcentraties in het bloed en in de niercortex. Cadmium is kankerverwekkend.'
