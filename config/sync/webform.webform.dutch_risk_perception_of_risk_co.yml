id: dutch_risk_perception_of_risk_co
title: 'Dutch Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in </span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(34, 34, 34);display:inline !important;float:none;font-family:Arial, Helvetica, sans-serif;font-size:small;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Dutch language</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Toestemming en context'
    description:
      '#type': checkbox
      '#title': 'Ik bevestig dat ik de bovenstaande informatie heb gelezen en ermee akkoord ga.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="NL">Risicoperceptie van risicocommunicatoren</span></h4><p class="p1">Uw mening telt! Draag met uw standpunt bij tot een veiliger beheer van chemische stoffen in Europa door deel te nemen aan een korte enquête over “Risicoperceptie van risicocommunicatoren”. Dit onderzoek wordt uitgevoerd in het kader van PARC&nbsp;(https://www.eu-parc.eu/), het partnerschap voor de beoordeling van risico’s van chemische stoffen.</p><p class="p2">Wat is PARC? Het Europees Partnerschap voor de beoordeling van risico’s van chemische stoffen (PARC) is een gezamenlijk initiatief van dertig&nbsp;landen en drie Europese agentschappen (EEA, ECHA en EFSA), dat tot doel heeft de uitdagingen aan te pakken die gepaard gaan met innovatie op het gebied van de risicobeoordeling van chemische stoffen. PARC heeft tot doel de beleidsvorming in Europa en op nationaal niveau te onderbouwen met degelijke wetenschappelijke gegevens over de blootstelling van burgers aan chemische verontreinigende stoffen en de mogelijke gevolgen daarvan voor de gezondheid. In [naam van uw land] wordt de enquête gecoördineerd door [naam van de uitvoerende organisatie].</p><p class="p2">Wat is het doel van deze enquête? Wij worden allemaal blootgesteld aan talloze verschillende chemische stoffen, waarvan sommige schadelijk kunnen zijn voor de gezondheid. Het is van cruciaal belang om mensen te informeren over de mogelijke risico’s van deze chemische stoffen. Met deze enquête willen we een beter beeld krijgen van de gangbare werkwijzen van risicocommunicatoren, hun mening over risicoperceptie, en hun zorgen en uitdagingen bij het communiceren over gevaren en risico’s.</p><p class="p2">Voor wie is de enquête bedoeld? Deze vragenlijst richt zich voornamelijk op risicocommunicatie in alledaagse situaties, in tegenstelling tot crisiscommunicatie, die betrekking heeft op communicatie in situaties waarin dringende beslissingen moeten worden genomen. Het invullen van de vragenlijst duurt ongeveer 20&nbsp;minuten.</p><p class="p2">Wat gebeurt er met de verzamelde informatie? De verzamelde informatie is anoniem en wordt vertrouwelijk behandeld overeenkomstig de vereisten van de algemene verordening gegevensbescherming (AVG). De antwoorden zullen worden gecombineerd met andere antwoorden in het kader van een analyse door de onderzoekspartners van PARC. Als de wetenschappelijke conclusies van deze enquête tijdens een conferentie worden gepubliceerd of gepresenteerd, worden de resultaten samengevat.</p><p class="p2">Recht tot weigering of intrekking: Uw deelname is geheel vrijwillig. Door deze enquête in te vullen en in te dienen, geeft u aan dat u ermee instemt aan dit onderzoek deel te nemen. U kunt op elk moment zonder opgave van redenen en zonder enige gevolgen uw deelname intrekken of ervoor kiezen om helemaal niet deel te nemen.<br><br><strong>Hartelijk dank voor uw tijd en medewerking.</strong></p>'
      '#description_display': before
      '#required': true
