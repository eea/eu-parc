    please_rate_statements_on_risk_communication_to_which_degree_you:
      '#type': webform_likert
      '#title': "3.3.\tGeef aan in hoeverre u het eens of oneens bent met de volgende uitspraken over risicocommunicatie."
      '#required': true
      '#questions':
        'Bij communicatie over risico’s is het belangrijk onderscheid te maken tussen gevaren en risico’s.': 'Bij communicatie over risico’s is het belangrijk onderscheid te maken tussen gevaren en risico’s.'
        'Risicocommunicatie mag niet worden beïnvloed door de perceptie van het risico door het publiek.': 'Risicocommunicatie mag niet worden beïnvloed door de perceptie van het risico door het publiek.'
        'De beginselen (zoals objectiviteit en onpartijdigheid) waarop risicocommunicatie is gebaseerd, zijn consistent in alle sectoren ': 'De beginselen (zoals objectiviteit en onpartijdigheid) waarop risicocommunicatie is gebaseerd, zijn consistent in alle sectoren (zoals chemische gevaren en besmettelijke ziekten).'
        'Door alle onzekerheden in verband met risico’s en gevaren te beschrijven, raken mensen in de war.': 'Door alle onzekerheden in verband met risico’s en gevaren te beschrijven, raken mensen in de war.'
        'Risicocommunicatie moet plaatsvinden in samenwerking met de betrokken belanghebbenden.': 'Risicocommunicatie moet plaatsvinden in samenwerking met de betrokken belanghebbenden.'
        'Nieuwsmedia zijn meer geïnteresseerd in crisiscommunicatie, waarbij de presentatie van risico’s vaak overdreven is.': 'Nieuwsmedia zijn meer geïnteresseerd in crisiscommunicatie, waarbij de presentatie van risico’s vaak overdreven is.'
      '#answers':
