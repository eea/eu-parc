id: norway_risk_perception_of_risk_c
title: 'Norway_Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks.</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Samtykke og kontekst'
    description:
      '#type': checkbox
      '#title': 'Jeg bekrefter at jeg har lest og godtar informasjonen ovenfor.'
      '#description': '<p><strong>RISIKOOPPFATNING HOS PERSONER SOM INFORMERER OM RISIKO</strong></p><p><span>Din mening teller! Vi inviterer deg til å bidra i arbeidet for en tryggere kjemikaliehåndtering i Europa ved å delta i en kort spørreundersøkelse: «Risikooppfatning blant personer som informerer om risiko». Undersøkelsen gjennomføres innenfor rammen av PARC (https://www.eu-parc.eu/), som står for «Partnership for the Assessment of Risks from Chemicals».</span></p><p><strong>Om PARC:</strong> Det europeiske partnerskapet for vurdering av risiko fra kjemikalier (PARC) er et samarbeid mellom 30 land og tre europeiske byråer (EEA, ECHA og EFSA). Målet er å møte utfordringer knyttet til innovasjon i vurdering av kjemikalierisiko. PARC skal bidra til beslutningstaking på både europeisk og nasjonalt nivå gjennom pålitelige vitenskapelige data om befolkningens eksponering for kjemiske stoffer og deres mulige helseeffekter. I Norge koordineres undersøkelsen av Folkehelseinstituttet.</p><p><strong>Formålet med denne undersøkelsen:&nbsp;</strong><br>Alle mennesker utsettes for en rekke kjemikalier i hverdagen, og noen av disse kan være helseskadelige. Derfor er det viktig å kommunisere risiko på en tydelig og god måte.<br>Denne undersøkelsen har som mål å gi bedre innsikt i:<br>•&nbsp;&nbsp;&nbsp;&nbsp;hvilke metoder som brukes i risikokommunikasjon<br>•&nbsp;&nbsp;&nbsp;&nbsp;hvordan risiko oppfattes<br>•&nbsp;&nbsp;&nbsp;&nbsp;hvilke utfordringer og bekymringer som oppstår når man formidler informasjon om fare og risiko.</p><p><strong>Hvem undersøkelsen er rettet mot:&nbsp;</strong><br>Undersøkelsen retter seg mot personer som arbeider med risikokommunikasjon i hverdagslige situasjoner (ikke krisekommunikasjon). Det tar omtrent 20 minutter å besvare spørreskjemaet.</p><p><strong>Hva som skjer med den innsamlede informasjonen:&nbsp;</strong><br>Alle opplysninger behandles anonymt og konfidensielt i tråd med personvernforordningen (GDPR). Svarene vil bli analysert samlet av PARCs forskningspartnere, og eventuelle publikasjoner eller presentasjoner vil kun vise aggregerte resultater.</p><p><strong>Rett til å nekte å delta eller trekke seg:</strong>&nbsp;</p><p>Deltakelse i undersøkelsen er helt frivillig. Ved å svare gir du samtykke til å delta. Du står fritt til å trekke deg når som helst uten å oppgi grunn og uten konsekvenser.</p><p><strong>Takk for at du tar deg tid til å bidra.</strong></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
