  section_6_language:
    '#type': webform_wizard_page
    '#title': '6. Avsnitt: Språk'
    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': '6.1. La oss anta at det sirkulerer feilinformasjon eller rykter i sosiale medier om risikoen ved røyking og kadmium. Hvilket av følgende påstander foretrekker du å bruke?'
      '#options':
        'A: Ved røyking av sigaretter er opptaket av kadmium i lungene 10–50 %. Røykere har kadmiumkonsentrasjoner i blodet på rundt 1,5 μg/l, og kadmiumkonsentrasjoner i nyrebarken på rundt 20–30 μg/g våtvekt. Ikke-røykere har 4–5 ganger lavere kadmiumkonsentrasjoner i blodet og dobbelt så lave kadmiumkonsentrasjoner i nyrebarken. Det er påvist at kadmium forårsaker lungekreft.': 'A: Ved røyking av sigaretter er opptaket av kadmium i lungene 10–50 %. Røykere har kadmiumkonsentrasjoner i blodet på rundt 1,5 μg/l, og kadmiumkonsentrasjoner i nyrebarken på rundt 20–30 μg/g våtvekt. Ikke-røykere har 4–5 ganger lavere kadmiumkonsentrasjoner i blodet og dobbelt så lave kadmiumkonsentrasjoner i nyrebarken. Det er påvist at kadmium forårsaker lungekreft.'
        'B: Ved røyking av sigaretter er opptaket av kadmium i lungene 10–50 %, mens opptaket i mage-tarm-kanalen bare er noen få prosent. Røykere har omtrent 4–5 ganger høyere kadmiumkonsentrasjoner i blodet (ca. 1,5 μg/l) og dobbelt så høye kadmiumkonsentrasjoner i nyrebarken (ca. 20–30 μg/g våtvekt) som ikke-røykere. Det er påvist at kadmium kan forårsake lungekreft, men det foreligger begrenset dokumentasjon på at det har sammenheng med nyre-, lever- og prostatakreft.': 'B: Ved røyking av sigaretter er opptaket av kadmium i lungene 10–50 %, mens opptaket i mage-tarm-kanalen bare er noen få prosent. Røykere har omtrent 4–5 ganger høyere kadmiumkonsentrasjoner i blodet (ca. 1,5 μg/l) og dobbelt så høye kadmiumkonsentrasjoner i nyrebarken (ca. 20–30 μg/g våtvekt) som ikke-røykere. Det er påvist at kadmium kan forårsake lungekreft, men det foreligger begrenset dokumentasjon på at det har sammenheng med nyre-, lever- og prostatakreft.'
        'C: Ved røyking av sigaretter er opptaket av kadmium ekstremt høyt i lungene, mens opptaket i mage-tarm-kanalen er lavere. Røykere har betydelig høyere kadmiumkonsentrasjoner i blodet og i nyrebarken. Kadmium er kreftfremkallende.': 'C: Ved røyking av sigaretter er opptaket av kadmium ekstremt høyt i lungene, mens opptaket i mage-tarm-kanalen er lavere. Røykere har betydelig høyere kadmiumkonsentrasjoner i blodet og i nyrebarken. Kadmium er kreftfremkallende.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': '6.2. Følgende vitenskapelige uttalelse sier at: «Akrylamid er en kjemikalie som dannes naturlig i stivelsesholdige matvarer når de tilberedes ved høye temperaturer (over 120 °C). Når det finnes akrylamid i mat, kan det mulig øke risikoen for at forbrukere i alle aldersgrupper utvikler kreft. Heldigvis finnes det måter å redusere akrylamidnivået i mat på». Hvilken påstand ville du valgt hvis du skulle gi forbrukerne råd om hvordan de kan redusere akrylamidnivået i hjemmelaget mat?'
      '#options':
        'Prøv å få en gyllengul farge (eller lysere) når du steker, baker, rister eller steker stivelsesholdige matvarer, og unngå overopphetet mat for å oppnå bedre helse.': 'Prøv å få en gyllengul farge (eller lysere) når du steker, baker, rister eller steker stivelsesholdige matvarer, og unngå overopphetet mat for å oppnå bedre helse.'
        'Lang tilberedningstid og høyere temperaturer fører til dannelse av mer akrylamid – et stoff som kan være kreftfremkallende hos mennesker – enn kort tilberedningstid og lavere temperaturer.': 'Lang tilberedningstid og høyere temperaturer fører til dannelse av mer akrylamid – et stoff som kan være kreftfremkallende hos mennesker – enn kort tilberedningstid og lavere temperaturer.'
      '#required': true
