id: italian_risk_perception_of_risk
title: 'Italian Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in </span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(34, 34, 34);display:inline !important;float:none;font-family:Arial, Helvetica, sans-serif;font-size:small;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Italian language.</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Consenso e contesto'
    description:
      '#type': checkbox
      '#title': 'Confermo di aver letto e di accettare le informazioni riportate sopra.'
      '#description': '<h4>Percezione dei rischi da parte dei comunicatori dei rischi</h4><p class="p2">La tua opinione conta! Fai sentire la tua voce per una gestione più sicura delle sostanze chimiche in Europa partecipando a una breve indagine intitolata «Percezione dei rischi da parte dei comunicatori dei rischi». Lo studio è condotto nell’ambito del progetto PARC (https://www.eu-parc.eu/), acronimo di «Partnership for the Assessment of Risks from Chemicals» (partenariato per la valutazione dei rischi derivanti dalle sostanze chimiche).</p><p class="p3">Informazioni sul PARC: il partenariato europeo per la valutazione dei rischi derivanti dalle sostanze chimiche&nbsp;(PARC) è un’iniziativa congiunta di 30&nbsp;paesi e 3&nbsp;agenzie europee (AEA, ECHA, EFSA), volta ad affrontare le sfide legate alle innovazioni in materia di valutazione dei rischi delle sostanze chimiche. L’obiettivo del PARC è quello di orientare l’elaborazione delle politiche in Europa e a livello nazionale grazie a dati scientifici attendibili sull’esposizione dei cittadini agli inquinanti chimici e sui loro possibili effetti sulla salute. In [nome del tuo paese], l’indagine è coordinata da [nome dell’organizzazione responsabile dell’attuazione].</p><p class="p3">Scopo della presente indagine: siamo tutti esposti a una moltitudine di sostanze chimiche, alcune delle quali possono essere dannose per la salute. Pertanto, è fondamentale informare sui potenziali rischi derivanti da queste sostanze chimiche. Con questa indagine intendiamo approfondire la comprensione delle pratiche comunemente adottate dai comunicatori dei rischi, le loro opinioni riguardo alla percezione dei rischi, nonché le loro preoccupazioni e le sfide che devono affrontare quando comunicano i pericoli e i rischi.</p><p class="p3">Destinatari dell’indagine: questo questionario verte principalmente sulla comunicazione dei rischi nelle situazioni quotidiane, a differenza della comunicazione in caso di crisi, che riguarda invece la comunicazione in situazioni che richiedono decisioni urgenti. La compilazione richiederà circa 20&nbsp;minuti.</p><p class="p3">Cosa succederà con le informazioni raccolte: le informazioni raccolte saranno anonime e trattate in modo riservato, in conformità alle disposizioni del regolamento generale sulla protezione dei dati&nbsp;(RGPDGDPR). Le risposte saranno raggruppate con altre risposte durante l’analisi da parte dei partner di ricerca del PARC. Qualora le conclusioni scientifiche di questa indagine venissero pubblicate o presentate in occasione di un convegno, i risultati saranno aggregati.</p><p class="p3">Diritto di rifiutare o revocare: la tua partecipazione è del tutto volontaria. Compilando e inviando questa indagine, dai il tuo consenso a partecipare all’indagine stessa. Hai la possibilità di rinunciare alla partecipazione in qualsiasi momento o di decidere di non partecipare affatto, senza dover fornire alcuna motivazione e senza alcuna conseguenza.</p><p class="p2"><strong>Grazie per la collaborazione e per il tempo che ci hai dedicato</strong></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
