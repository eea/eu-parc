    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': "6.1.\tSupponiamo che sui social media circolino informazioni errate o voci sui rischi legati al fumo e al cadmio. Quale delle seguenti affermazioni preferiresti usare?"
      '#options':
        'A: Quando si fumano sigarette, l’assorbimento del cadmio nei polmoni è pari al 10-50 %. I fumatori presentano concentrazioni di cadmio nel sangue pari a circa 1,5 μg/l e concentrazioni di cadmio nella corteccia renale pari a circa 20-30 μg/g di peso umido. I non fumatori presentano concentrazioni di cadmio nel sangue 4-5 volte più basse e concentrazioni di cadmio nella corteccia renale due volte più basse. È stato dimostrato che il cadmio provoca il cancro ai polmoni.': 'A: Quando si fumano sigarette, l’assorbimento del cadmio nei polmoni è pari al 10-50 %. I fumatori presentano concentrazioni di cadmio nel sangue pari a circa 1,5 μg/l e concentrazioni di cadmio nella corteccia renale pari a circa 20-30 μg/g di peso umido. I non fumatori presentano concentrazioni di cadmio nel sangue 4-5 volte più basse e concentrazioni di cadmio nella corteccia renale due volte più basse. È stato dimostrato che il cadmio provoca il cancro ai polmoni.'
        'B: Quando si fumano sigarette, l’assorbimento del cadmio nei polmoni è pari al 10-50 %, mentre l’assorbimento nel tratto gastrointestinale è solo di pochi punti percentuali. I fumatori presentano concentrazioni di cadmio nel sangue circa 4-5 volte superiori (circa 1,5 μg/l) e concentrazioni di cadmio nella corteccia renale due volte superiori (circa 20-30 μg/g di peso umido) rispetto ai non fumatori. È stato dimostrato che il cadmio provoca il cancro ai polmoni, ma le prove sul nesso con il cancro ai reni': 'B: Quando si fumano sigarette, l’assorbimento del cadmio nei polmoni è pari al 10-50 %, mentre l’assorbimento nel tratto gastrointestinale è solo di pochi punti percentuali. I fumatori presentano concentrazioni di cadmio nel sangue circa 4-5 volte superiori (circa 1,5 μg/l) e concentrazioni di cadmio nella corteccia renale due volte superiori (circa 20-30 μg/g di peso umido) rispetto ai non fumatori. È stato dimostrato che il cadmio provoca il cancro ai polmoni, ma le prove sul nesso con il cancro ai reni'
        'C: Quando si fumano sigarette, l’assorbimento del cadmio nei polmoni è estremamente elevato, mentre l’assorbimento nel tratto gastrointestinale è inferiore. I fumatori presentano concentrazioni di cadmio nel sangue e concentrazioni di cadmio nella corteccia renale notevolmente più elevate. Il cadmio è cancerogeno.': 'C: Quando si fumano sigarette, l’assorbimento del cadmio nei polmoni è estremamente elevato, mentre l’assorbimento nel tratto gastrointestinale è inferiore. I fumatori presentano concentrazioni di cadmio nel sangue e concentrazioni di cadmio nella corteccia renale notevolmente più elevate. Il cadmio è cancerogeno.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tSecondo la seguente dichiarazione scientifica: «L’acrilammide è una sostanza chimica che si forma naturalmente negli alimenti ricchi di amido quando vengono cotti ad alte temperature (superiori a 120 °C). La presenza di acrilammide negli alimenti può potenzialmente aumentare il rischio di cancro per i consumatori di tutte le età. Fortunatamente, esistono modi per ridurre i livelli di acrilammide negli alimenti». Quale affermazione sceglieresti se dovessi dare consigli ai consumatori su come ridurre al minimo i livelli di acrilammide nella preparazione del cibo in casa?"
      '#options':
        'Quando friggi, cuoci al forno, tosti o arrostisci alimenti ricchi di amido, cerca di ottenere un colore giallo dorato (o più chiaro) ed evita di surriscaldarli, per una salute migliore.': 'Quando friggi, cuoci al forno, tosti o arrostisci alimenti ricchi di amido, cerca di ottenere un colore giallo dorato (o più chiaro) ed evita di surriscaldarli, per una salute migliore.'
        'I tempi di cottura prolungati e le temperature più elevate determinano una maggiore formazione di acrilammide, una sostanza potenzialmente cancerogena per l’uomo, rispetto ai tempi di cottura brevi e alle temperature più basse.': 'I tempi di cottura prolungati e le temperature più elevate determinano una maggiore formazione di acrilammide, una sostanza potenzialmente cancerogena per l’uomo, rispetto ai tempi di cottura brevi e alle temperature più basse.'
      '#required': true
