  section_3_developing_risk_communication:
    '#type': webform_wizard_page
    '#title': "3.\tSezione: sviluppare la comunicazione dei rischi"
    when_communicating_with_the_target_audience_on_risk_how_importan:
      '#type': webform_likert
      '#title': "3.1.\tQuando comunichi con il pubblico destinatario in merito ai rischi, quanto è importante includere le seguenti caratteristiche?"
      '#required': true
      '#questions':
        'Utilizzo di rappresentazioni visive dei rischi tramite grafici, diagrammi, immagini e mappe': 'Utilizzo di rappresentazioni visive dei rischi tramite grafici, diagrammi, immagini e mappe'
        'Confronti tra pericoli diversi a seconda della probabilità': 'Confronti tra pericoli diversi a seconda della probabilità'
        'Descrizione di tutte le incertezze connesse al rischio': 'Descrizione di tutte le incertezze connesse al rischio'
        'Valori limite numerici (ad es. dose giornaliera tollerabile di una determinata sostanza chimica, espressa in numeri)': 'Valori limite numerici (ad es. dose giornaliera tollerabile di una determinata sostanza chimica, espressa in numeri)'
        'Descrizione dei diversi rischi per i diversi gruppi di persone (ad es. differenza di rischio tra vari gruppi professionali)': 'Descrizione dei diversi rischi per i diversi gruppi di persone (ad es. differenza di rischio tra vari gruppi professionali)'
        'Informazioni sulla differenza tra esposizione a lungo termine e a breve termine a un pericolo': 'Informazioni sulla differenza tra esposizione a lungo termine e a breve termine a un pericolo'
        'Informazioni sulla sottovalutazione dei rischi da parte del pubblico (ad es. quando il comunicatore dei rischi dispone di inform': 'Informazioni sulla sottovalutazione dei rischi da parte del pubblico (ad es. quando il comunicatore dei rischi dispone di informazioni che indicano che il pubblico non percepisce come pericolose determinate sostanze chimiche come dovrebbe)'
        'Informazioni sulla sopravvalutazione dei rischi da parte del pubblico (ad es. quando il comunicatore dei rischi dispone di infor': 'Informazioni sulla sopravvalutazione dei rischi da parte del pubblico (ad es. quando il comunicatore dei rischi dispone di informazioni che indicano che il pubblico percepisce determinate sostanze chimiche come più pericolose di quanto non lo siano in realtà)'
        'Descrizione delle strategie per evitare l’esposizione al pericolo': 'Descrizione delle strategie per evitare l’esposizione al pericolo'
      '#answers':
        'Per niente importante': 'Per niente importante'
        'Poco importante': 'Poco importante'
        'Mediamente importante': 'Mediamente importante'
        'Abbastanza importante': 'Abbastanza importante'
        'Molto importante': 'Molto importante'
    when_communicating_risk_how_important_are_the_following_aspects:
      '#type': webform_likert
      '#title': "3.2.\tNella comunicazione dei rischi, quanto ritieni importanti i seguenti aspetti della fiducia per la percezione dei rischi da parte del pubblico destinatario?"
      '#required': true
      '#questions':
        'La fiducia del pubblico nell’esperto che comunica il rischio': 'La fiducia del pubblico nell’esperto che comunica il rischio'
        'La fiducia del pubblico nelle istituzioni/autorità nazionali/europee': 'La fiducia del pubblico nelle istituzioni/autorità nazionali/europee'
        'La fiducia del pubblico nei dati scientifici': 'La fiducia del pubblico nei dati scientifici'
      '#answers':
        'Per niente importante': 'Per niente importante'
        'Poco importante': 'Poco importante'
        'Mediamente importante': 'Mediamente importante'
        'Abbastanza importante': 'Abbastanza importante'
        'Molto importante': 'Molto importante'
    please_rate_statements_on_risk_communication_to_which_degree_you:
      '#type': webform_likert
      '#title': "3.3.\tValuta le seguenti affermazioni relative alla comunicazione dei rischi, indicando in che misura sei d’accordo o in disaccordo con esse."
      '#required': true
      '#questions':
        'Nella comunicazione dei rischi è importante distinguere tra pericolo e rischio.': 'Nella comunicazione dei rischi è importante distinguere tra pericolo e rischio.'
        'La comunicazione dei rischi non dovrebbe essere influenzata dalla percezione dei rischi da parte del pubblico.': 'La comunicazione dei rischi non dovrebbe essere influenzata dalla percezione dei rischi da parte del pubblico.'
        'I principi (ad es. obiettività, imparzialità) su cui si fonda la comunicazione dei rischi sono validi in tutti i settori (ad es.': 'I principi (ad es. obiettività, imparzialità) su cui si fonda la comunicazione dei rischi sono validi in tutti i settori (ad es. pericoli chimici, malattie trasmissibili).'
        'Descrivere tutte le incertezze relative ai rischi e ai pericoli crea confusione.': 'Descrivere tutte le incertezze relative ai rischi e ai pericoli crea confusione.'
        'La comunicazione dei rischi dovrebbe essere praticata/effettuata in collaborazione con i portatori di interessi coinvolti.': 'La comunicazione dei rischi dovrebbe essere praticata/effettuata in collaborazione con i portatori di interessi coinvolti.'
        'I media sono più interessati alla comunicazione di crisi, in cui la percezione dei rischi viene spesso esagerata.': 'I media sono più interessati alla comunicazione di crisi, in cui la percezione dei rischi viene spesso esagerata.'
      '#answers':
        'Completamente in disaccordo': 'Completamente in disaccordo'
        'Parzialmente in disaccordo': 'Parzialmente in disaccordo'
        'Né d’accordo né in disaccordo': 'Né d’accordo né in disaccordo'
        'In parte d’accordo': 'In parte d’accordo'
        'Pienamente d’accordo': 'Pienamente d’accordo'
  section_4_role_of_risk_communicator:
    '#type': webform_wizard_page
    '#title': "4.\tSezione: ruolo del comunicatore dei rischi"
    please_rate_statements_on_risk_perception_to_which_degree_you_ag:
      '#type': webform_likert
      '#title': "4.1.\tValuta le affermazioni relative alla percezione dei rischi indicando in che misura sei d’accordo o in disaccordo con esse."
      '#required': true
      '#questions':
        'La percezione dei rischi da parte delle persone include o dipende dalle loro convinzioni e dai loro atteggiamenti.': 'La percezione dei rischi da parte delle persone include o dipende dalle loro convinzioni e dai loro atteggiamenti.'
        'La percezione dei rischi non è influenzata dalle opinioni e dai sentimenti delle persone (esperienza personale).': 'La percezione dei rischi non è influenzata dalle opinioni e dai sentimenti delle persone (esperienza personale).'
        'La percezione dei rischi riflette gli atteggiamenti culturali e sociali più ampi che le persone assumono nei confronti dei peric': 'La percezione dei rischi riflette gli atteggiamenti culturali e sociali più ampi che le persone assumono nei confronti dei pericoli e dei relativi benefici.'
        'La comunicazione dei rischi dovrebbe basarsi sui dati emersi dalle valutazioni dei rischi, ma dovrebbe anche tenere conto della ': 'La comunicazione dei rischi dovrebbe basarsi sui dati emersi dalle valutazioni dei rischi, ma dovrebbe anche tenere conto della percezione dei pericoli da parte dei non addetti ai lavori e dell’importanza che essi vi attribuiscono.'
        'Le persone che hanno già vissuto un episodio legato a un pericolo tendono a ritenere che ci siano maggiori probabilità di trovar': 'Le persone che hanno già vissuto un episodio legato a un pericolo tendono a ritenere che ci siano maggiori probabilità di trovarsi nuovamente in quella situazione rispetto a chi non ha mai affrontato quel pericolo.'
        'Quando le persone vengono a conoscenza di un pericolo per la prima volta tendono a ritenere che tale nuovo pericolo abbia maggio': 'Quando le persone vengono a conoscenza di un pericolo per la prima volta tendono a ritenere che tale nuovo pericolo abbia maggiori probabilità di verificarsi rispetto ad altri pericoli ben noti.'
        'Quanto più le persone acquisiscono conoscenze specifiche in merito a un pericolo, tanto meno si affidano al loro intuito riguard': 'Quanto più le persone acquisiscono conoscenze specifiche in merito a un pericolo, tanto meno si affidano al loro intuito riguardo al rischio connesso a tale pericolo.'
