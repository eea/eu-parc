      '#type': radios
      '#title': "6.1.\tFöreställ dig att det cirkulerar felaktig information/rykten på sociala medier om riskerna med rökning och kadmium. Vilket av följande påståenden skulle du föredra att använda?"
      '#options':
        'A: Vid cigarettrökning uppgår upptaget av kadmium i lungorna till 10–50 %. Rökare har kadmiumkoncentrationer i blodet på cirka 1,5 μg/l och kadmiumkoncentrationer i njurbarken på cirka 20–30 μg/g våtvikt. Icke-rökare har 4–5 gånger lägre kadmiumkoncentrationer i blodet och hälften så låga kadmiumkoncentrationer i njurbarken. Kadmium har visat sig orsaka lungcancer.': 'A: Vid cigarettrökning uppgår upptaget av kadmium i lungorna till 10–50 %. Rökare har kadmiumkoncentrationer i blodet på cirka 1,5 μg/l och kadmiumkoncentrationer i njurbarken på cirka 20–30 μg/g våtvikt. Icke-rökare har 4–5 gånger lägre kadmiumkoncentrationer i blodet och hälften så låga kadmiumkoncentrationer i njurbarken. Kadmium har visat sig orsaka lungcancer.'
        'B: Vid cigarettrökning uppgår upptaget av kadmium i lungorna till 10–50 %, medan upptaget i mag-tarmkanalen endast uppgår till några få procent. Rökare har ungefär 4–5 gånger högre kadmiumkoncentrationer i blodet (cirka 1,5 μg/l) och dubbelt så höga kadmiumkoncentrationer i njurbarken (cirka 20–30 μg/g våtvikt) som icke-rökare. Kadmium kan orsaka lungcancer, men det finns endast begränsade belägg för att det skulle ha något samband med cancer i njurar, lever och prostata.': 'B: Vid cigarettrökning uppgår upptaget av kadmium i lungorna till 10–50 %, medan upptaget i mag-tarmkanalen endast uppgår till några få procent. Rökare har ungefär 4–5 gånger högre kadmiumkoncentrationer i blodet (cirka 1,5 μg/l) och dubbelt så höga kadmiumkoncentrationer i njurbarken (cirka 20–30 μg/g våtvikt) som icke-rökare. Kadmium kan orsaka lungcancer, men det finns endast begränsade belägg för att det skulle ha något samband med cancer i njurar, lever och prostata.'
        'C: Vid cigarettrökning är upptaget av kadmium extremt högt i lungorna, medan upptaget i mag-tarmkanalen är lägre. Rökare har betydligt högre kadmiumkoncentrationer i blodet och i njurbarken. Kadmium är ett cancerframkallande ämne.': 'C: With smoking cigarettes, the absorption of cadmium is extremely high in the lungs, while the absorption in the gastrointestinal tract is lower. Smokers have significantly higher blood cadmium concentrations and kidney cortex cadmium concentrations. Cadmium is carcinogenic. '
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tEtt vetenskapligt uttalande lyder som följer: ”Akrylamid är en kemikalie som bildas naturligt i stärkelserika livsmedel när de tillagas vid höga temperaturer (över 120 °C). När akrylamid förekommer i livsmedel kan det potentiellt öka risken för att konsumenter i alla åldrar utvecklar cancer. Men det finns sätt att minska akrylamidhalten i livsmedel”. Vilket påstående skulle du välja om du skulle ge konsumenterna råd om hur de kan minimera akrylamidhalten i hemlagad mat?"
      '#options':
        'Sträva efter en gyllengul färg (eller ljusare) när du steker, bakar, rostar eller tillagar stärkelserika livsmedel, och undvik "överstekta” livsmedel för en bättre hälsa.': 'Sträva efter en gyllengul färg (eller ljusare) när du steker, bakar, rostar eller tillagar stärkelserika livsmedel, och undvik "överstekta” livsmedel för en bättre hälsa.'
        'Långa tillagningstider och högre temperaturer bildar mer akrylamid – ett ämne som kan vara cancerframkallande för människor – än korta tillagningstider och lägre temperaturer.': 'Långa tillagningstider och högre temperaturer bildar mer akrylamid – ett ämne som kan vara cancerframkallande för människor – än korta tillagningstider och lägre temperaturer.'
