      '#required': true
      '#questions':
        'Människors riskuppfattning omfattar/beror på deras övertygelser och attityder.': 'Människors riskuppfattning omfattar/beror på deras övertygelser och attityder.'
        'Riskuppfattning påverkas inte av människors bedömningar och känslor (personliga erfarenheter).': 'Riskuppfattning påverkas inte av människors bedömningar och känslor (personliga erfarenheter).'
        'Riskuppfattning återspeglar  kulturella och sociala inställningar som människor har gentemot faror.': 'Riskuppfattning återspeglar  kulturella och sociala inställningar som människor har gentemot faror.'
        'Riskkommunikation bör baseras på resultat från riskbedömningar, men bör även ta hänsyn till hur lekmän uppfattar faran och dess ': 'Riskkommunikation bör baseras på resultat från riskbedömningar, men bör även ta hänsyn till hur lekmän uppfattar faran och dess betydelse. bör baseras på resultat från riskbedömningar, men bör även ta hänsyn till hur lekmän uppfattar faran och dess betydelse.'
