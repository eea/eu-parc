        'Någorlunda viktigt': 'Någorlunda viktigt'
        'Ganska viktigt': 'Ganska viktigt'
        Viktigt: Viktigt
        'Mycket viktigt': 'Mycket viktigt'
    please_rate_statements_on_risk_communication_to_which_degree_you:
      '#type': webform_likert
      '#title': "3.3.\tAnge i vilken utsträckning du håller med eller inte håller med om följande påståenden om riskkommunikation."
      '#required': true
      '#questions':
        'När man informerar om risker är det viktigt att skilja mellan fara och risk.': 'När man informerar om risker är det viktigt att skilja mellan fara och risk.'
        'Riskkommunikation bör inte påverkas av allmänhetens uppfattning om risker.': 'Riskkommunikation bör inte påverkas av allmänhetens uppfattning om risker.'
        'De principer (t.ex. objektivitet och opartiskhet) som riskkommunikation bygger på är desamma inom alla sektorer (t.ex. för kemis': 'De principer (t.ex. objektivitet och opartiskhet) som riskkommunikation bygger på är desamma inom alla sektorer (t.ex. för kemiska faror och smittsamma sjukdomar).'
        'Att beskriva alla osäkerhetsfaktorer som rör risker och faror gör att människor blir förvirrade.': 'Att beskriva alla osäkerhetsfaktorer som rör risker och faror gör att människor blir förvirrade.'
        'Riskkommunikation bör ske i samarbete med berörda intressenter.': 'Riskkommunikation bör ske i samarbete med berörda intressenter.'
        'Nyhetsmedierna är mer intresserade av kriskommunikation, där riskerna ofta framställs på ett överdrivet sätt.': 'Nyhetsmedierna är mer intresserade av kriskommunikation, där riskerna ofta framställs på ett överdrivet sätt.'
      '#answers':
        'Håller inte alls med': 'Håller inte alls med'
        'Håller delvis inte med': 'Håller delvis inte med'
        'Varken håller med eller inte håller med': 'Varken håller med eller inte håller med'
        'Håller delvis med': 'Håller delvis med'
        'Håller med helt och hållet': 'Håller med helt och hållet'
