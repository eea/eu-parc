id: swedish_risk_perception_of_risk
title: 'Swedish Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied </span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(34, 34, 34);display:inline !important;float:none;font-family:&quot;Segoe UI&quot;;font-size:13.3333px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Swedish language</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Samtycke och sammanhang'
    description:
      '#type': checkbox
      '#title': 'ag bekräftar att jag har läst och accepterar informationen ovan.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="SV">Riskuppfattning hos riskkommunikatörer</span></h4><p class="p2">Din åsikt är viktig! Delta i en kort enkät om ”Riskuppfattning hos riskkommunikatörer” och låt din röst göra skillnad för en säkrare kemikaliehantering i Europa. Studien genomförs inom ramen för partnerskapet för riskbedömning av kemikalier (PARC, Partnership for the Assessment of Risks from Chemicals [https://www.eu-parc.eu/]).</p><p class="p3">Om PARC: PARC är en gemensam insats mellan 30 länder och tre europeiska myndigheter (EEA, Echa och Efsa) som syftar till att hantera utmaningar i samband med innovation inom ramen för kemikalieriskbedömning. Målet är att ta fram underlag för beslutsfattande på europeisk och nationell nivå genom att tillhandahålla tillförlitliga vetenskapliga data om medborgarnas exponering för kemiska föroreningar och deras eventuella hälsoeffekter. I Sverige samordnar Livsmedelsverket arbetet med enkäten.</p><p class="p3">Enkätens syfte: Vi är alla exponerade för en stor mängd kemikalier, varav vissa kan vara skadliga för hälsan. Det är mycket viktigt att informera om potentiella risker med dessa kemikalier. Syftet med denna enkät är att få en bättre inblick i de metoder som riskkommunikatörer vanligtvis använder, såväl som deras syn på riskuppfattning samt de farhågor och utmaningar som de möter när de informerar om faror och risker.</p><p class="p3">Enkätens fokus: Denna enkät handlar främst om riskkommunikation i vardagliga situationer, till skillnad från kriskommunikation, som avser kommunikation i situationer där brådskande beslut måste fattas. Det tar cirka 20&nbsp;minuter att fylla i enkäten.</p><p class="p3">Insamling och hantering av uppgifter: De uppgifter som samlas in är anonyma och kommer att behandlas konfidentiellt i enlighet med kraven i den allmänna dataskyddsförordningen. Svaren kommer att kombineras med andra svar när de analyseras av PARC:s forskningspartner. Om de vetenskapliga slutsatserna från denna enkät publiceras eller presenteras vid en konferens kommer resultaten att grupperas.</p><p class="p3">Rätt att inte delta eller att återkalla sitt deltagande: Ditt deltagande är helt frivilligt. Genom att fylla i och skicka in denna enkät ger du ditt samtycke till att delta. Du kan när som helst välja att återkalla ditt deltagande eller välja att inte delta alls, utan att du behöver ange någon anledning och utan att det medför några konsekvenser.</p><p class="p4"><br><br><strong>Tack för att du tar dig tid att hjälpa oss!</strong></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
