    when_communicating_with_the_target_audience_on_risk_how_importan:
      '#type': webform_likert
      '#title': "3.1.\tHur viktigt är följande när man kommunicerar med målgruppen om risker?"
      '#required': true
      '#questions':
        'Användning av visuella illustrationer av risker med hjälp av grafer, diagram, bilder och kartor.': 'Användning av visuella illustrationer av risker med hjälp av grafer, diagram, bilder och kartor.'
        'Jämförelser mellan olika faror/risker efter sannolikhet.': 'Jämförelser mellan olika faror/risker efter sannolikhet.'
        'Beskrivning av alla osäkerhetsfaktorer som rör risken.': 'Beskrivning av alla osäkerhetsfaktorer som rör risken.'
        'Numeriska hälsobaseraderiktvärden (t.ex. tolerabelt dagligt intag för en viss kemikalie uttryckt i siffror).': 'Numeriska hälsobaseraderiktvärden (t.ex. tolerabelt dagligt intag för en viss kemikalie uttryckt i siffror).'
        'Beskrivning av olika risker för olika grupper av personer (t.ex. skillnader i risk mellan olika yrkesgrupper).': 'Beskrivning av olika risker för olika grupper av personer (t.ex. skillnader i risk mellan olika yrkesgrupper).'
        'Information om skillnaden mellan långvarig och kortvarig exponering för faror.': 'Information om skillnaden mellan långvarig och kortvarig exponering för faror.'
        'Information om allmänhetens underskattning av risker (t.ex. när riskkommunikatören har kännedom om att allmänheten underskattar ': 'Information om allmänhetens underskattning av risker (t.ex. när riskkommunikatören har kännedom om att allmänheten underskattar hur farliga vissa kemikalier faktiskt är).'
        'Information om allmänhetens överskattning av risker (t.ex. när riskkommunikatören har kännedom om att allmänheten uppfattar viss': 'Information om allmänhetens överskattning av risker (t.ex. när riskkommunikatören har kännedom om att allmänheten uppfattar vissa kemikalier som farligare än vad de faktiskt är).'
        'Beskrivning av strategier för att undvika exponering för faror.': 'Beskrivning av strategier för att undvika exponering för faror.'
      '#answers':
        'Inte alls viktigt': 'Inte alls viktigt'
        'Någorlunda viktigt': 'Någorlunda viktigt'
        'Ganska viktigt': 'Ganska viktigt'
        Viktigt: Viktigt
        'Mycket viktigt': 'Mycket viktigt'
    when_communicating_risk_how_important_are_the_following_aspects:
