        'Allmänhetens förtroende för nationella/europeiska institutioner/myndigheter.': 'Allmänhetens förtroende för nationella/europeiska institutioner/myndigheter.'
        'Allmänhetens förtroende för vetenskapliga data.': 'Allmänhetens förtroende för vetenskapliga data.'
      '#answers':
