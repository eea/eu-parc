id: finnish_risk_perception_of_risk
title: 'Finnish Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in finnish language</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Suostumus ja taustatiedot'
    description:
      '#type': checkbox
      '#title': 'Vahvistan, että olen lukenut ja hyväksyn yllä esitetyt tiedot.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="FI">Riskiviestijän riskikäsitys</span></h4><p>Mielipiteelläsi on väliä. Vaikuta kemikaalien parempaan hallintaan Euroopassa osallistumalla lyhyeen kyselyyn aiheesta ”Riskiviestijän riskikäsitys”. Tutkimus toteutetaan PARC-hankkeen (https://www.eu-parc.eu/) puitteissa. PARC on lyhenne sanoista ”Partnership for the Assessment of Risks from Chemicals” (kemikaalien riskinarvioinnin kumppanuusohjelma).</p><p>Tietoa PARC-hankkeesta: Eurooppalainen kemikaalien riskinarvioinnin kumppanuusohjelma (PARC) on 30 maan ja kolmen eurooppalaisen viraston (EEA, ECHA, EFSA) yhteinen hanke, jonka tarkoituksena on kehittää kemikaalien riskinarviointia n. Kumppanuuden tavoitteena on tarjota Euroopan ja kansallisen tason poliittista päätöksentekoa varten luotettavaa tieteellistä tietoa kansalaisten altistumisesta kemiallisille saasteille ja saasteiden mahdollisista terveysvaikutuksista. Suomessa kyselytutkimusta koordinoi Työterveyslaitos.</p><p>Kyselytutkimuksen tarkoitus: Altistumme jatkuvasti lukuisille kemikaaleille, joista jotkin voivat olla haitallisia terveydelle. On<span>&nbsp; </span>tärkeää tiedottaa haitallisiin kemikaaleihin liittyvistä riskeistä. Tällä kyselyllä pyrimme saamaan paremman käsityksen riskiviestijien yleisistä käytännöistä, heidän riskien havaitsemista koskevista käsityksistään sekä huolenaiheista ja haasteista, joita he kohtaavat tiedottaessaan vaaroista ja riskeistä.</p><p>Kyselyn kohderyhmä: Tässä kyselylomakkeessa käsitellään pääasiassa riskiviestintää arjessa, eikä kriisiviestintää, joka tarkoittaa viestintää kiireellisiä päätöksiä edellyttävissä tilanteissa. Kyselyyn vastaaminen kestää noin 20 minuuttia.</p><p>Mitä kerätyille tiedoille tapahtuu: Kerätyt tiedot ovat anonyymejä ja niitä käsitellään luottamuksellisesti yleisen tietosuoja-asetuksen vaatimusten mukaisesti. Vastaukset yhdistetään muihin vastauksiin, kun PARC:n tutkimuskumppanit analysoivat niitä. Mikäli tämän tutkimuksen tieteelliset johtopäätökset julkaistaan tai esitellään konferenssissa, tulokset esitetään kootusti.</p><p>Oikeus kieltäytyä tai peruuttaa osallistuminen: Kyselyyn osallistuminen on täysin vapaaehtoista. Täyttämällä ja lähettämällä tämän kyselyn osoitat suostumuksesi kyselyyn osallistumiseen. Voit milloin tahansa perua osallistumisesi tai päättää olla osallistumatta lainkaan ilman perusteluja ja ilman seuraamuksia. Lähetettyäsi kyselyn, osallistumista ei kuitenkaan voida enää peruuttaa.</p><p><strong>Kiitos osallistumisestasi!</strong></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
