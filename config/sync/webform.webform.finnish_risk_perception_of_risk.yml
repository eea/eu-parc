    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': "6.1.\tOletetaan, että sosiaalisessa mediassa liikkuu väärää tietoa tai huhuja tupakoinnin ja kadmiumin aiheuttamista riskeistä. Mitä seuraavista lausunnoista haluaisit käyttää?"
      '#options':
        'A: Savukkeita poltettaessa kadmiumista imeytyy keuhkoihin 10–50 prosenttia. Tupakoitsijoiden veren kadmiumpitoisuus on noin 1,5 μg/l, ja munuaiskuoren kadmiumpitoisuus noin 20–30 μg/g märkäpainossa. Tupakoimattomien veren kadmiumpitoisuus on 4–5 kertaa pienempi ja munuaiskuoren puolet pienempi. Kadmiumin on osoitettu aiheuttavan keuhkosyöpää.': 'A: Savukkeita poltettaessa kadmiumista imeytyy keuhkoihin 10–50 prosenttia. Tupakoitsijoiden veren kadmiumpitoisuus on noin 1,5 μg/l, ja munuaiskuoren kadmiumpitoisuus noin 20–30 μg/g märkäpainossa. Tupakoimattomien veren kadmiumpitoisuus on 4–5 kertaa pienempi ja munuaiskuoren puolet pienempi. Kadmiumin on osoitettu aiheuttavan keuhkosyöpää.'
        'B: Savukkeita poltettaessa kadmiumista imeytyy keuhkoihin 10–50 prosenttia. Ruoansuolatuskanavassa imeytyminen on vain muutamia prosentteja. Tupakoitsijoiden veren kadmiumpitoisuus on noin 4–5 kertaa suurempi (noin 1,5 μg/l) ja munuaiskuoren kadmiumpitoisuus kaksi kertaa suurempi (noin 20–30 μg/g märkäpainossa) kuin tupakoimattomien. Kadmiumin on osoitettu aiheuttavan keuhkosyöpää, mutta sen yhteydestä munuais-, maksa- ja eturauhassyöpään on vain vähän näyttöä.': 'B: Savukkeita poltettaessa kadmiumista imeytyy keuhkoihin 10–50 prosenttia. Ruoansuolatuskanavassa imeytyminen on vain muutamia prosentteja. Tupakoitsijoiden veren kadmiumpitoisuus on noin 4–5 kertaa suurempi (noin 1,5 μg/l) ja munuaiskuoren kadmiumpitoisuus kaksi kertaa suurempi (noin 20–30 μg/g märkäpainossa) kuin tupakoimattomien. Kadmiumin on osoitettu aiheuttavan keuhkosyöpää, mutta sen yhteydestä munuais-, maksa- ja eturauhassyöpään on vain vähän näyttöä.'
        'C: Savukkeita poltettaessa kadmiumia imeytyy keuhkoihin erittäin paljon, kun taas ruoansulatuskanavassa se imeytyy huonommin. Veren ja munuaiskuoren kadmiumpitoisuus on tupakoitsijoilla huomattavasti korkeampi kuin muilla. Kadmium on syöpää aiheuttava aine.': 'C: Savukkeita poltettaessa kadmiumia imeytyy keuhkoihin erittäin paljon, kun taas ruoansulatuskanavassa se imeytyy huonommin. Veren ja munuaiskuoren kadmiumpitoisuus on tupakoitsijoilla huomattavasti korkeampi kuin muilla. Kadmium on syöpää aiheuttava aine.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tSeuraavassa tieteellisessä lausunnossa todetaan: ”Akryyliamidi on kemikaali, jota muodostuu luonnollisesti tärkkelyspitoisissa elintarvikkeissa, kun niitä kypsennetään korkeissa lämpötiloissa (yli 120 °C). Kun elintarvikkeissa on akryyliamidia, se voi mahdollisesti lisätä kaiken ikäisten kuluttajien syöpäriskiä. Onneksi on olemassa keinoja vähentää akryyliamidien määrää elintarvikkeissa.” Kumman lausunnon valitsisit, jos haluaisit neuvoa kuluttajia minimoimaan akryyliamidipitoisuuden kotiruoanlaitossa?"
      '#options':
        'Terveyden kannalta parasta on pitää tavoitteena kullankeltaista väriä (tai vaaleampaa) paistettaessa, leivottaessa, paahtaessa tai paahdettaessa tärkkelyspitoisia elintarvikkeita ja välttää ylikuumennettuja elintarvikkeita.': 'Terveyden kannalta parasta on pitää tavoitteena kullankeltaista väriä (tai vaaleampaa) paistettaessa, leivottaessa, paahtaessa tai paahdettaessa tärkkelyspitoisia elintarvikkeita ja välttää ylikuumennettuja elintarvikkeita.'
        'Pitkät kypsennysajat ja korkeammat lämpötilat muodostavat enemmän akryyliamidia, joka voi aiheuttaa syöpää, kuin lyhyet kypsennysajat ja matalammat lämpötilat.': 'Pitkät kypsennysajat ja korkeammat lämpötilat muodostavat enemmän akryyliamidia, joka voi aiheuttaa syöpää, kuin lyhyet kypsennysajat ja matalammat lämpötilat.'
      '#required': true
