        'Riskikäsitykset heijastavat ihmisten yleisiä kulttuurisia ja yhteiskunnallisia asenteita vaaroja ja niiden tuomia hyötyjä kohtaa': 'Riskikäsitykset heijastavat ihmisten yleisiä kulttuurisia ja yhteiskunnallisia asenteita vaaroja ja niiden tuomia hyötyjä kohtaan.'
        'Riskiviestinnän tulisi perustua riskinarviointien tuloksiin, mutta siinä tulisi ottaa huomioon myös maallikoiden näkemys vaaran ': 'Riskiviestinnän tulisi perustua riskinarviointien tuloksiin, mutta siinä tulisi ottaa huomioon myös maallikoiden näkemys vaaran luonteesta ja merkityksestä.'
        'Ihmiset, jotka ovat aiemmin kokeneet vaaraan liittyvän ongelmatilanteen, pitävät yleensä todennäköisempänä joutumista samaan til': 'Ihmiset, jotka ovat aiemmin kokeneet vaaraan liittyvän ongelmatilanteen, pitävät yleensä todennäköisempänä joutumista samaan tilanteeseen uudelleen kuin ne, jotka eivät ole koskaan kohdanneet kyseistä vaaraa.'
        'Kun ihmiset saavat tietää vaarasta ensimmäistä kertaa, heillä on taipumus pitää uutta vaaraa todennäköisempänä kuin muita tunnet': 'Kun ihmiset saavat tietää vaarasta ensimmäistä kertaa, heillä on taipumus pitää uutta vaaraa todennäköisempänä kuin muita tunnettuja vaaroja.'
        'Mitä tarkempaa tietoa ihmiset saavat vaarasta, sitä vähemmän he luottavat intuitioonsa vaaran aiheuttamasta riskistä.': 'Mitä tarkempaa tietoa ihmiset saavat vaarasta, sitä vähemmän he luottavat intuitioonsa vaaran aiheuttamasta riskistä.'
        'Luottamus riskiviestijään on tärkeämpää kuin tieto itse.': 'Luottamus riskiviestijään on tärkeämpää kuin tieto itse.'
