        'Kuvaus riskeistä eri ihmisryhmien välillä(esim. eri ammattiryhmien riskierot)': 'Kuvaus riskeistä eri ihmisryhmien välillä(esim. eri ammattiryhmien riskierot)'
        'Tieto pitkäaikaisen ja lyhytaikaisen altistumisen välisestä erosta': 'Tieto pitkäaikaisen ja lyhytaikaisen altistumisen välisestä erosta'
        'Tieto siitä, että yleisö aliarvioi riskejä (esim. kun riskiviestijä tietää, että yleisö ei pidä tiettyjä kemikaaleja niin vaaral': 'Tieto siitä, että yleisö aliarvioi riskejä (esim. kun riskiviestijä tietää, että yleisö ei pidä tiettyjä kemikaaleja niin vaarallisina kuin pitäisi)'
        'Tieto siitä, että yleisö yliarvioi riskejä (esim. kun riskiviestijä tietää, että yleisö pitää tiettyjä kemikaaleja vaarallisempina kuin ne todellisuudessa ovat)': 'Tieto siitä, että yleisö yliarvioi riskejä (esim. kun riskiviestijä tietää, että yleisö pitää tiettyjä kemikaaleja vaarallisempina kuin ne todellisuudessa ovat)'
        'Kuvaus strategioista, joilla voidaan välttää altistuminen vaaroille': 'Kuvaus strategioista, joilla voidaan välttää altistuminen vaaroille'
      '#answers':
