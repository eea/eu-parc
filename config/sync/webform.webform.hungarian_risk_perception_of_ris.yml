      '#type': radios
      '#title': "6.1.\tTegyük fel, hogy a közösségi médiában téves információk vagy pletykák keringenek a dohányzás és a kadmium kockázatairól. Az alábbi állítások közül melyiket részesítené előnyben?"
      '#options':
        'A: Cigarettázás esetén a kadmium felszívódása a tüdőben 10–50%. A dohányosok vérében körülbelül 1,5 μg/l a kadmiumkoncentráció, a veséjük kéregében pedig körülbelül 20–30 μg/g a nedves tömegre vonatkoztatott kadmiumkoncentráció. A nemdohányzók vérének kadmiumkoncentrációja 4–5-ször alacsonyabb, a veséjük kortex kadmiumkoncentrációja pedig kétszer alacsonyabb. Bebizonyosodott, hogy a kadmium tüdőrákot okoz.': 'A: Cigarettázás esetén a kadmium felszívódása a tüdőben 10–50%. A dohányosok vérében körülbelül 1,5 μg/l a kadmiumkoncentráció, a veséjük kéregében pedig körülbelül 20–30 μg/g a nedves tömegre vonatkoztatott kadmiumkoncentráció. A nemdohányzók vérének kadmiumkoncentrációja 4–5-ször alacsonyabb, a veséjük kortex kadmiumkoncentrációja pedig kétszer alacsonyabb. Bebizonyosodott, hogy a kadmium tüdőrákot okoz.'
        'B: Cigarettázás esetén a kadmium felszívódása a tüdőben 10–50%, míg a gyomor-bélrendszerben csupán néhány százalék. A dohányosok vérében körülbelül 4–5-ször magasabb a kadmiumkoncentráció (kb. 1,5 μg/l), a vese kéregében pedig kétszer olyan magas (kb. 20–30 μg/g nedves tömeg), mint a nemdohányzóknál. Bebizonyosodott, hogy a kadmium tüdőrákot okoz, de csak korlátozott bizonyítékok utalnak arra, hogy összefüggésbe hozható a vese-, máj- és prosztatarákkal.': 'B: Cigarettázás esetén a kadmium felszívódása a tüdőben 10–50%, míg a gyomor-bélrendszerben csupán néhány százalék. A dohányosok vérében körülbelül 4–5-ször magasabb a kadmiumkoncentráció (kb. 1,5 μg/l), a vese kéregében pedig kétszer olyan magas (kb. 20–30 μg/g nedves tömeg), mint a nemdohányzóknál. Bebizonyosodott, hogy a kadmium tüdőrákot okoz, de csak korlátozott bizonyítékok utalnak arra, hogy összefüggésbe hozható a vese-, máj- és prosztatarákkal.'
        'C: Cigarettázáss esetén a kadmium felszívódása a tüdőben rendkívül magas, míg a gyomor-bélrendszerben alacsonyabb. A dohányosok vérében és a vese kéregében jelentősen magasabb a kadmiumkoncentráció. A kadmium rákkeltő.': 'C: Cigarettázáss esetén a kadmium felszívódása a tüdőben rendkívül magas, míg a gyomor-bélrendszerben alacsonyabb. A dohányosok vérében és a vese kéregében jelentősen magasabb a kadmiumkoncentráció. A kadmium rákkeltő.'
