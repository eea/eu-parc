id: hungarian_risk_perception_of_ris
title: 'Hungarian Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in </span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(34, 34, 34);display:inline !important;float:none;font-family:&quot;Segoe UI&quot;;font-size:13.3333px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Hungarian language.</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Hozzájárulás és háttérinformációk'
    description:
      '#type': checkbox
      '#title': 'Megerősítem, hogy elolvastam és elfogadom a fentiekben közölt információkat.'
      '#description': '<h4>Kockázati kommunikátorok kockázatérzékelése</h4><p class="p1">Véleménye fontos számunkra! Vegyen részt a „Kockázati kommunikátorok kockázatérzékelése” című rövid felmérésben, és járuljon hozzá a biztonságosabb vegyianyag-gazdálkodáshoz Európában! A tanulmány a PARC (https://www.eu-parc.eu/) keretében készül, amelynek neve a „Partnership for the Assessment of Risks from Chemicals” (Kémiai anyagok kockázatértékelésére irányuló partnerség) rövidítése.</p><p class="p2">A PARC-ről: A vegyi anyagok kockázatértékelésével foglalkozó európai partnerség (PARC) 30 ország és 3 európai ügynökség (EEA, ECHA, EFSA) közös kezdeményezése, amelynek célja a vegyi anyagok kockázatértékelésének innovációjával kapcsolatos kihívások kezelése. A PARC célja, hogy megbízható tudományos adatokkal tájékoztassa az európai és nemzeti szintű szakpolitikai döntéshozatalt a polgárok vegyi szennyező anyagoknak való kitettségéről és azoknak az egészségre gyakorolt lehetséges hatásairól. [Ország neve] területén a felmérést a [végrehajtó szervezet neve] koordinálja.</p><p class="p2">A felmérés célja: Mindannyian rengeteg vegyi anyagnak vagyunk kitéve, amelyek közül néhány káros lehet az egészségre. Az ilyen vegyi anyagok miatti potenciális kockázatokról való tájékoztatás elengedhetetlen. Ebben a felmérésben arra törekszünk, hogy jobban megismerjük a kockázati kommunikátorok által alkalmazott közös gyakorlatokat, a kockázatérzékeléssel kapcsolatos meggyőződéseiket, valamint aggodalmaikat és azokat a kihívásokat, amelyekkel a veszélyek és kockázatok kommunikálása során szembesülnek.</p><p class="p2">A felmérés címzettjei: Ez a kérdőív elsősorban a mindennapi körülmények közötti kockázati kommunikációval foglalkozik, szemben a válságkommunikációval, amely a sürgős döntéseket igénylő helyzetekben folytatott kommunikációra vonatkozik. A kitöltése körülbelül 20 percet vesz igénybe.</p><p class="p2">MI történik az összegyűjtött információkkal? Az összegyűjtött adatok anonimizáltak, és azokat az általános adatvédelmi rendelet (GDPR) előírásainak megfelelően bizalmasan kezeljük. A válaszokat a PARC kutatói partnerei az elemzés során más válaszokkal együtt fogják értékelni. Ha a felmérés tudományos következtetéseit közzéteszik vagy konferencián mutatják be, az eredményeket összesített módon kommunikálják.</p><p class="p2">A részvétel elutasításának vagy visszavonásának a joga: A részvétel teljes mértékben önkéntes. A felmérés kitöltésével és benyújtásával Ön kijelenti, hogy hozzájárul a felmérésben való részvételhez. Ön bármikor visszaléphet a részvételtől, vagy indokolás és következmények nélkül dönthet úgy, hogy egyáltalán nem vesz részt a felmérésben.<br><br><strong>Köszönjük, hogy segíti munkánkat!</strong></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
