    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tA következő tudományos nyilatkozat állításai: „Az akrilamid egy olyan vegyi anyag, amely természetes módon keletkezik a keményítőtartalmú élelmiszerekben, amikor azokat magas hőmérsékleten (120°C felett) főzik.” Ha az élelmiszerekben akrilamid található, az minden korosztályban növelheti a rák kialakulásának kockázatát. Szerencsére van mód az élelmiszerek akrilamidszintjének csökkentésére.” Melyik állítást választaná, ha azt tanácsolná a fogyasztóknak, hogy az otthoni főzés során minimalizálják a keletkező akrilamid szintjét?"
      '#options':
        'A keményítőtartalmú ételek olajban sütése, sütése, pirítása vagy pörkölése során törekedjen, hogy az étel színe ne legyen sötétebb az aranysárga színnél (vagy annál világosabb szín), és az egészség érdekében kerülje az ételek túlzott hőkezelését.': 'A keményítőtartalmú ételek olajban sütése, sütése, pirítása vagy pörkölése során törekedjen, hogy az étel színe ne legyen sötétebb az aranysárga színnél (vagy annál világosabb szín), és az egészség érdekében kerülje az ételek túlzott hőkezelését.'
        'A hosszú főzési idő és a magasabb hőmérséklet több akrilamidot eredményez, ami rákot okozhat, mint amennyi a rövid főzési idő és az alacsonyabb hőmérséklet esetében keletkezik.': 'A hosszú főzési idő és a magasabb hőmérséklet több akrilamidot eredményez, ami rákot okozhat, mint amennyi a rövid főzési idő és az alacsonyabb hőmérséklet esetében keletkezik.'
