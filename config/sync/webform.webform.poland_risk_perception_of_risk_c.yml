    '#type': webform_wizard_page
    '#title': '6. Część: Język'
    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': "6.1.\tZałóżmy, że w mediach społecznościowych krążą nieprawdziwe informacje lub plotki na temat ryzyka związanego z paleniem tytoniu i kadmem. Którego z poniższych oświadczeń wolał(a)byś użyć?"
      '#options':
        ' A: W przypadku palenia papierosów wchłanianie kadmu w płucach wynosi 10–50%. U palaczy stężenie kadmu we krwi wynosi około 1,5 μg/l, a stężenie kadmu w korze nerkowej wynosi około 20–30 μg/g masy mokrej. U osób niepalących stężenie kadmu we krwi jest 4–5 razy niższe, a stężenie kadmu w korze nerkowej – dwukrotnie niższe. Wykazano, że kadm powoduje raka płuc.': ' A: W przypadku palenia papierosów wchłanianie kadmu w płucach wynosi 10–50%. U palaczy stężenie kadmu we krwi wynosi około 1,5 μg/l, a stężenie kadmu w korze nerkowej wynosi około 20–30 μg/g masy mokrej. U osób niepalących stężenie kadmu we krwi jest 4–5 razy niższe, a stężenie kadmu w korze nerkowej – dwukrotnie niższe. Wykazano, że kadm powoduje raka płuc.'
        'B: W przypadku palenia papierosów wchłanianie kadmu w płucach wynosi 10–50%, natomiast w przewodzie pokarmowym – zaledwie kilka procent. U palaczy stężenie kadmu we krwi jest około 4–5 razy wyższe (około 1,5 μg/l), a stężenie kadmu w korze nerkowej dwukrotnie wyższe (około 20–30 μg/g masy mokrej) niż u osób niepalących. Wykazano, że kadm powoduje raka płuc, ale dowody na jego związek z rakiem nerek, wątroby i prostaty są ograniczone.': 'B: W przypadku palenia papierosów wchłanianie kadmu w płucach wynosi 10–50%, natomiast w przewodzie pokarmowym – zaledwie kilka procent. U palaczy stężenie kadmu we krwi jest około 4–5 razy wyższe (około 1,5 μg/l), a stężenie kadmu w korze nerkowej dwukrotnie wyższe (około 20–30 μg/g masy mokrej) niż u osób niepalących. Wykazano, że kadm powoduje raka płuc, ale dowody na jego związek z rakiem nerek, wątroby i prostaty są ograniczone.'
        'C: W przypadku palenia papierosów wchłanianie kadmu w płucach jest bardzo wysokie, podczas gdy w przewodzie pokarmowym jest ono niższe. U palaczy stężenie kadmu we krwi i w korze nerkowej jest znacznie wyższe. Kadm ma działanie rakotwórcze.': 'C: W przypadku palenia papierosów wchłanianie kadmu w płucach jest bardzo wysokie, podczas gdy w przewodzie pokarmowym jest ono niższe. U palaczy stężenie kadmu we krwi i w korze nerkowej jest znacznie wyższe. Kadm ma działanie rakotwórcze.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tW poniższym oświadczeniu naukowym stwierdza się, że: „Akrylamid to związek chemiczny, który powstaje naturalnie w produktach spożywczych zawierających skrobię podczas ich podgrzewania w wysokiej temperaturze (powyżej 120°C). Obecność akrylamidu w żywności może potencjalnie zwiększać ryzyko zachorowania na raka u konsumentów w każdym wieku. Na szczęście istnieją sposoby na obniżenie stężenia akrylamidu w żywności.” Które stwierdzenie wybrał(a)byś, gdybyś miał(a) doradzać konsumentom, jak zmniejszyć stężenie akrylamidu w przygotowywanych posiłkach?"
      '#options':
        'Aby zadbać o swoje zdrowie, podczas smażenia, pieczenia lub opiekania potraw bogatych w skrobię staraj się uzyskać złocistożółty (lub jaśniejszy) kolor i unikaj przygotowywania potraw w zbyt wysokiej temperaturze.': 'Aby zadbać o swoje zdrowie, podczas smażenia, pieczenia lub opiekania potraw bogatych w skrobię staraj się uzyskać złocistożółty (lub jaśniejszy) kolor i unikaj przygotowywania potraw w zbyt wysokiej temperaturze.'
        'Dłuższy czas gotowania i wyższa temperatura powodują powstawanie większej ilości akrylamidu, który może wywoływać nowotwory u ludzi, w porównaniu do krótszego czasu przygotowywania potraw w niższej temperaturze.': 'Dłuższy czas gotowania i wyższa temperatura powodują powstawanie większej ilości akrylamidu, który może wywoływać nowotwory u ludzi, w porównaniu do krótszego czasu przygotowywania potraw w niższej temperaturze.'
      '#required': true
