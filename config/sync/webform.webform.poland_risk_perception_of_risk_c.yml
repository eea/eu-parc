id: poland_risk_perception_of_risk_c
title: 'Poland_Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in Polish language. </span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Zgoda i kontekst'
    description:
      '#type': checkbox
      '#title': 'Potwierdzam zapoznanie się z powyższymi informacjami i ich akceptację.'
      '#description': '<p><span style="font-family:Satoshi;" lang="PL"><strong>POSTRZEGANIE RYZYKA PRZEZ OSOBY PRZEKAZUJĄCE INFORMACJE O RYZYKU</strong></span><strong>&nbsp;</strong></p><p><span>Twoje zdanie jest dla nas ważne! Wypowiedz się na temat bezpieczniejszego zarządzania chemikaliami w Europie poprzez udział w krótkiej ankiecie zatytułowanej „Postrzeganie ryzyka przez osoby przekazujące informacje o ryzyku”. Badanie jest prowadzone w ramach programu PARC (https://www.eu-parc.eu/) – partnerstwa na rzecz oceny ryzyka związanego z chemikaliami.&nbsp;</span></p><p><span><strong>O PARC:</strong> Europejskie partnerstwo na rzecz oceny ryzyka związanego z chemikaliami (PARC) stanowi wspólną inicjatywę 30 krajów oraz trzech agencji europejskich (EEA, ECHA, EFSA), której celem jest sprostanie wyzwaniom związanym z wprowadzeniem zmian w zakresie oceny ryzyka chemicznego. Celem PARC jest dostarczanie informacji na potrzeby kształtowania polityki w Europie i na szczeblu krajowym, zawierających rzetelne dane naukowe dotyczące narażenia obywateli na zanieczyszczenia chemiczne oraz ich potencjalnego wpływu na zdrowie. W Polsce badanie jest koordynowane przez Instytut Medycyny Pracy im. prof. J. Nofera.</span></p><p><span>&nbsp;<strong>Cel ankiety: </strong>Wszyscy jesteśmy narażeni na działanie licznych substancji chemicznych, z których niektóre mogą być szkodliwe dla zdrowia. Informowanie o potencjalnym ryzyku związanym z tymi substancjami chemicznymi jest bardzo ważne. Za pomocą tej ankiety chcemy uzyskać bardziej szczegółowe informacje na temat powszechnych praktyk stosowanych przez osoby przekazujące informacje o ryzyku, ich przekonań na temat postrzegania ryzyka, a także ich obaw i wyzwań, jakie napotykają podczas informowania o zagrożeniach i ryzyku.</span></p><p><span><strong>Do kogo skierowana jest ankieta: </strong>Badanie dotyczy przede wszystkim informowania o ryzyku w codziennych sytuacjach, w odróżnieniu od komunikacji kryzysowej, która odnosi się do komunikacji w sytuacjach wymagających podjęcia pilnych decyzji. Wypełnienie ankiety zajmie około 20 minut.</span></p><p><span><strong>Co się stanie z zebranymi informacjami: </strong>Zebrane informacje będą miały charakter anonimowy i będą traktowane jako poufne zgodnie z wymogami ogólnego rozporządzenia o ochronie danych (RODO). Odpowiedzi zostaną połączone z innymi odpowiedziami podczas analizy przez partnerów badawczych PARC. W przypadku opublikowania wyników badania lub przedstawienia ich podczas konferencji zostaną one podane w formie zbiorczej.</span></p><p><span><strong>Prawo do odmowy lub rezygnacji:</strong> Udział w badaniu jest całkowicie dobrowolny. Wypełniając i przesyłając tę ankietę, wyrażają Państwo zgodę na udział w badaniu. W każdej chwili mogą Państwo zrezygnować z udziału lub zdecydować się w ogóle nie brać udziału bez podawania przyczyny i bez żadnych konsekwencji.</span></p><p><span>Dziękujemy za poświęcony czas i współpracę!&nbsp;</span></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
