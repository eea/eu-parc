      '#title': "6.1.\tΑς υποθέσουμε ότι υπάρχει παραπληροφόρηση/φήμη στα μέσα κοινωνικής δικτύωσης σχετικά με τον κίνδυνο που σχετίζεται με το κάπνισμα και το κάδμιο. Ποια από τις παρακάτω προτάσεις θα προτιμούσατε να χρησιμοποιήσετε;"
      '#options':
        'A: Στους καπνιστές η συγκέντρωση καδμίου στο αίμα είναι περίπου 1,5 μg/l και οι συγκεντρώσεις καδμίου στον φλοιό των νεφρών είναι περίπου 20-30 μg/g υγρού βάρους. Οι μη καπνιστές έχουν 4-5 φορές χαμηλότερες συγκεντρώσεις καδμίου στο αίμα και δύο φορές χαμηλότερες συγκεντρώσεις καδμίου στον φλοιό των νεφρών. Το κάδμιο έχει αποδειχθεί ότι προκαλεί καρκίνο του πνεύμονα.': 'A: Στους καπνιστές η συγκέντρωση καδμίου στο αίμα είναι περίπου 1,5 μg/l και οι συγκεντρώσεις καδμίου στον φλοιό των νεφρών είναι περίπου 20-30 μg/g υγρού βάρους. Οι μη καπνιστές έχουν 4-5 φορές χαμηλότερες συγκεντρώσεις καδμίου στο αίμα και δύο φορές χαμηλότερες συγκεντρώσεις καδμίου στον φλοιό των νεφρών. Το κάδμιο έχει αποδειχθεί ότι προκαλεί καρκίνο του πνεύμονα.'
        'B: Οι καπνιστές έχουν περίπου 4-5 φορές υψηλότερες συγκεντρώσεις καδμίου στο αίμα (περίπου 1,5 μg/l) και διπλάσιες συγκεντρώσεις καδμίου στον φλοιό των νεφρών (περίπου 20-30 μg/g υγρού βάρους) από τους μη καπνιστές. Το κάδμιο έχει αποδειχθεί ότι προκαλεί καρκίνο του πνεύμονα, αλλά υπάρχουν περιορισμένες ενδείξεις ότι συνδέεται με καρκίνο των νεφρών, του ήπατος και του προστάτη.': 'B: Οι καπνιστές έχουν περίπου 4-5 φορές υψηλότερες συγκεντρώσεις καδμίου στο αίμα (περίπου 1,5 μg/l) και διπλάσιες συγκεντρώσεις καδμίου στον φλοιό των νεφρών (περίπου 20-30 μg/g υγρού βάρους) από τους μη καπνιστές. Το κάδμιο έχει αποδειχθεί ότι προκαλεί καρκίνο του πνεύμονα, αλλά υπάρχουν περιορισμένες ενδείξεις ότι συνδέεται με καρκίνο των νεφρών, του ήπατος και του προστάτη.'
        'Γ: Οι καπνιστές έχουν σημαντικά υψηλότερες συγκεντρώσεις καδμίου στο αίμα και στον φλοιό των νεφρών. Το κάδμιο είναι καρκινογόνο.': 'Γ: Οι καπνιστές έχουν σημαντικά υψηλότερες συγκεντρώσεις καδμίου στο αίμα και στον φλοιό των νεφρών. Το κάδμιο είναι καρκινογόνο.'
