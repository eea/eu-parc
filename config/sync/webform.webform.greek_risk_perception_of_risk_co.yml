    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tΈχοντας υπόψη την ακόλουθη επιστημονική δήλωση που αναφέρει ότι: «Το ακρυλαμίδιο είναι μια χημική ουσία που σχηματίζεται φυσικά σε αμυλούχα τρόφιμα, όταν αυτά μαγειρεύονται σε υψηλές θερμοκρασίες (πάνω από 120°C). Όταν το ακρυλαμίδιο υπάρχει στα τρόφιμα, μπορεί δυνητικά να αυξήσει τον κίνδυνο εμφάνισης καρκίνου στους καταναλωτές όλων των ηλικιών. Ευτυχώς, υπάρχουν τρόποι να μειωθούν τα επίπεδα ακρυλαμιδίου στα τρόφιμα», ποια δήλωση θα επιλέγατε για να συμβουλέψετε τους καταναλωτές προκειμένου να ελαχιστοποιήσουν τα επίπεδα ακρυλαμιδίου στο μαγείρεμα στο σπίτι;"
      '#options':
        'Οι μεγάλοι χρόνοι μαγειρέματος και οι υψηλότερες θερμοκρασίες σχηματίζουν περισσότερο ακρυλαμίδιο που έχει τη δυνατότητα να προκαλέσει καρκίνο στον άνθρωπο, σε σχέση με μικρότερους χρόνους μαγειρέματος και χαμηλότερες θερμοκρασίες. ': 'Οι μεγάλοι χρόνοι μαγειρέματος και οι υψηλότερες θερμοκρασίες σχηματίζουν περισσότερο ακρυλαμίδιο που έχει τη δυνατότητα να προκαλέσει καρκίνο στον άνθρωπο, σε σχέση με μικρότερους χρόνους μαγειρέματος και χαμηλότερες θερμοκρασίες. '
        'Στοχεύστε σε ένα χρυσοκίτρινο χρώμα (ή πιο ανοιχτό) όταν τηγανίζετε, φρυγανίζετε ή ψήνετε αμυλούχα τρόφιμα και αποφύγετε τα τρόφιμα που έχουν μαγειρευτεί σε υπερβολικά ψηλές θερμοκρασίες, για να έχετε καλύτερη υγεία. ': 'Στοχεύστε σε ένα χρυσοκίτρινο χρώμα (ή πιο ανοιχτό) όταν τηγανίζετε, φρυγανίζετε ή ψήνετε αμυλούχα τρόφιμα και αποφύγετε τα τρόφιμα που έχουν μαγειρευτεί σε υπερβολικά ψηλές θερμοκρασίες, για να έχετε καλύτερη υγεία. '
