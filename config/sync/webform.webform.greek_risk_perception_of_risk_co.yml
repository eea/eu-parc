      '#title': "4.1.\tΣε ποιο βαθμό συμφωνείτε ή διαφωνείτε με τα ακόλουθα:"
      '#required': true
      '#questions':
        'Η αντίληψη των ανθρώπων για την πιθανότητα βλάβης από έναν κίνδυνο εξαρτάται από τις πεποιθήσεις και τη στάση τους για αυτόν': 'Η αντίληψη των ανθρώπων για την πιθανότητα βλάβης από έναν κίνδυνο εξαρτάται από τις πεποιθήσεις και τη στάση τους για αυτόν'
        'Η αντίληψη των ανθρώπων  για την πιθανότητα βλάβης από την έκθεσή τους σε έναν κίνδυνο  δεν επηρεάζεται από τις κρίσεις και τα σ': 'Η αντίληψη των ανθρώπων  για την πιθανότητα βλάβης από την έκθεσή τους σε έναν κίνδυνο  δεν επηρεάζεται από τις κρίσεις και τα συναισθήματα τους (προσωπική εμπειρία)'
        'Οι ευρύτερες πολιτιστικές και κοινωνικές τάσεις και προδιαθέσεις  των ανθρώπων επηρεάζουν την αντίληψη  για τις πιθανότητες βλάβ': 'Οι ευρύτερες πολιτιστικές και κοινωνικές τάσεις και προδιαθέσεις  των ανθρώπων επηρεάζουν την αντίληψη  για τις πιθανότητες βλάβης από την έκθεσή τους σε έναν κίνδυνο'
        'Η επικοινωνία της επικινδυνότητας θα πρέπει να βασίζεται σε επιστημονικά δεδομένα, αλλά θα πρέπει να ληφθεί υπόψη και η σημασία ': 'Η επικοινωνία της επικινδυνότητας θα πρέπει να βασίζεται σε επιστημονικά δεδομένα, αλλά θα πρέπει να ληφθεί υπόψη και η σημασία που δίνουν οι απλοί άνθρωποι στην πιθανότητα να πάθουν βλάβη από έκθεση σε αυτόν'
        'Τα άτομα που έχουν βιώσει στο παρελθόν ένα περιστατικό που σχετίζεται με έναν κίνδυνο, τείνουν να αισθάνονται ότι υπάρχουν περισ': 'Τα άτομα που έχουν βιώσει στο παρελθόν ένα περιστατικό που σχετίζεται με έναν κίνδυνο, τείνουν να αισθάνονται ότι υπάρχουν περισσότερες πιθανότητες να το βιώσουν ξανά, σε σύγκριση με άτομα που δεν έχουν βιώσει ποτέ τον συγκεκριμένο κίνδυνο'
        'Όταν οι άνθρωποι ενημερώνονται για την ύπαρξη ενός κινδύνου που δεν έχουν ξανακούσει, τείνουν να αισθάνονται ότι αυτός ο νέος κί': 'Όταν οι άνθρωποι ενημερώνονται για την ύπαρξη ενός κινδύνου που δεν έχουν ξανακούσει, τείνουν να αισθάνονται ότι αυτός ο νέος κίνδυνος είναι πιο πιθανό να τους προκαλέσει βλάβη σε σχέση με άλλους ήδη γνωστούς κινδύνους'
        'Όσο πιο συγκεκριμένες και εξειδικευμένες πληροφορίες λαμβάνουν οι άνθρωποι για έναν κίνδυνο, τόσο λιγότερο βασίζονται στη διαίσθ': 'Όσο πιο συγκεκριμένες και εξειδικευμένες πληροφορίες λαμβάνουν οι άνθρωποι για έναν κίνδυνο, τόσο λιγότερο βασίζονται στη διαίσθησή τους σχετικά με την πιθανότητα βλάβης από την έκθεσή τους στον κίνδυνο αυτό'
        'Η εμπιστοσύνη στον υπεύθυνο επικοινωνίας είναι πιο σημαντική από την ίδια την πληροφορία σχετικά με τον κίνδυνο και την πιθανότη': 'Η εμπιστοσύνη στον υπεύθυνο επικοινωνίας είναι πιο σημαντική από την ίδια την πληροφορία σχετικά με τον κίνδυνο και την πιθανότητα βλάβης από την έκθεση σε αυτόν.'
      '#answers':
        'Διαφωνώ πλήρως': 'Διαφωνώ πλήρως'
        'Διαφωνώ εν μέρει': 'Διαφωνώ εν μέρει'
        'Ούτε συμφωνώ ούτε διαφωνώ': 'Ούτε συμφωνώ ούτε διαφωνώ'
        'Συμφωνώ εν μέρει': 'Συμφωνώ εν μέρει'
