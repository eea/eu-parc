id: greek_risk_perception_of_risk_co
title: 'Greek_Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in Greek language. </span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Συγκατάθεση και πλαίσιο'
    description:
      '#type': checkbox
      '#title': 'Επιβεβαιώνω ότι έχω διαβάσει και αποδέχομαι τις πληροφορίες που αναφέρονται παραπάνω'
      '#description': '<h4>Η Αντίληψη των Υπευθύνων<br>Επικοινωνίας Επικινδυνότητας για<br>το ρόλο τους</h4><p>Σας προσκαλούμε να λάβετε μέρος σε μια σύντομη έρευνα με θέμα «Η Αντίληψη των Υπευθύνων Επικοινωνίας Επικινδυνότητας για το ρόλο τους». Η έρευνα διεξάγεται στο πλαίσιο της Ευρωπαϊκής Σύμπραξης για την Εκτίμηση της Επικινδυνότητας Χημικών ουσιών με το ακρωνύμιο PARC (Partnership for the Assessment of Risks from Chemicals, www.eu_parc.eu). Η γνώμη σας μετράει!</p><p><strong>Σχετικά με το PARC:</strong> Η Ευρωπαϊκή Σύμπραξη για την εκτίμηση της επικινδυνότητας χημικών ουσιών (PARC) αποτελεί μια κοινή προσπάθεια 30 χωρών και 3 ευρωπαϊκών φορέων (ΕΕΑ, ECHA, EFSA) και έχει σχεδιαστεί για την αντιμετώπιση των προκλήσεων που σχετίζονται με την καινοτόμο αξιολόγηση χημικών κινδύνων. Στόχος του PARC είναι να συμβάλει στη χάραξη πολιτικής στην Ευρώπη αλλά και σε εθνικό επίπεδο, με έγκυρα επιστημονικά δεδομένα σχετικά με την έκθεση των πολιτών σε χημικούς ρύπους/επιμολυντές και τις πιθανές επιπτώσεις τους στην υγεία. Στην Ελλάδα, η έρευνα σχετικά με την αντίληψη των υπευθύνων επικοινωνίας επικινδυνότητας για τον ρόλο τους συντονίζεται από τον Ενιαίο Φορέα Ελέγχου Τροφίμων (ΕΦΕΤ) στο πλαίσιο του προγράμματος RARC.&nbsp;</p><p><strong>Σκοπός της έρευνας:</strong> Όλοι είμαστε εκτεθειμένοι σε πληθώρα χημικών ουσιών, μερικές από τις οποίες μπορεί να είναι επιβλαβείς για την υγεία. Η επικοινωνία της επικινδυνότητας (πιθανής βλάβης από την έκθεση σε χημικές ουσίες) είναι ζωτικής σημασίας. Με αυτή την έρευνα στοχεύουμε να αποκτήσουμε περισσότερες πληροφορίες σχετικά με την αντίληψη των υπευθύνων επικοινωνίας της επικινδυνότητας για τον ρόλο τους στην επικοινωνία του κινδύνου (hazard) και της πιθανότητας βλάβης από αυτόν (risk), τις πρακτικές που εφαρμόζουν καθώς και τις προκλήσεις που αντιμετωπίζουν.</p><p><strong>Σε ποιους απευθύνεται η έρευνα: </strong>σε όλους τους υπεύθυνους επικοινωνίας της επικινδυνότητας. Το παρόν ερωτηματολόγιο αφορά κατά κύριο λόγο στην επικοινωνία της επικινδυνότητας σε περιόδους/καταστάσεις μη-κρίσης, όπου δεν απαιτείται η λήψη επειγουσών αποφάσεων (πέρα των ερωτήσεων όπου θα αναφέρεται ρητά η επικοινωνία της επικινδυνότητας σε περιόδους/καταστάσεις κρίσης – crisis communication). Για τη συμπλήρωσή του θα χρειαστείτε περίπου 20 λεπτά.</p><p><strong>Τι θα συμβεί με τις πληροφορίες που συλλέγονται:</strong> Οι πληροφορίες που συλλέγονται θα είναι πλήρως ανωνυμοποιημένες και θα αντιμετωπίζονται εμπιστευτικά σύμφωνα με τις απαιτήσεις του Γενικού Κανονισμού Προστασίας Δεδομένων (GDPR). Το όνομα, η εργασία και τα στοιχεία επικοινωνίας σας (π.χ. διεύθυνση email) δεν θα διατηρηθούν μετά την ολοκλήρωση της συλλογής δεδομένων, ούτε θα παρασχεθούν σε τρίτους. Τα επιστημονικά συμπεράσματα που θα προκύψουν από τη μελέτη, οι οποιεσδήποτε ανακοινώσεις σε συνέδρια ή δημοσιεύσεις θα είναι συγκεντρωτικά από όλους τους συμμετέχοντες στη μελέτη και δεν θα αποκαλύπτεται η ταυτότητά σας.&nbsp;</p><p><strong>Δικαίωμα άρνησης ή υπαναχώρησης:</strong> Η συμμετοχή σας είναι εντελώς εθελοντική. Συμπληρώνοντας και υποβάλλοντας αυτήν την έρευνα, δηλώνετε τη συγκατάθεσή σας για συμμετοχή σε αυτή. Είστε ελεύθεροι να αποσυρθείτε από τη συμμετοχή ανά πάσα στιγμή ή να επιλέξετε να μην συμμετάσχετε καθόλου χωρίς αιτιολόγηση και χωρίς κάποια συνέπεια.&nbsp;</p><p>Σας ευχαριστούμε για τον χρόνο και τη συνεργασία σας!</p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
