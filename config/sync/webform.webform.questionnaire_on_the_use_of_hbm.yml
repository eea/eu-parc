      '#description': '<p style="margin-left:54.0pt;text-align:left;" align="left"><span lang="EN-GB">Can you give a concrete example of a soft policy measure in which HBM results have played a role? </span><em><span lang="EN-GB">(e.g. guidelines for the use of pesticides in gardens).</span></em></p>'
