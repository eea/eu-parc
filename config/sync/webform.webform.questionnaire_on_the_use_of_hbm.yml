id: questionnaire_on_the_use_of_hbm
title: 'Questionnaire on the use of HBM in policy'
description: ''
categories:
  - HBM
elements: |-
  context:
    '#type': webform_wizard_page
    '#title': 'Data protection and Consent'
    i_confirm_that_i_have_read_and_i_accept_the_information_stated_a:
      '#type': checkbox
      '#title': 'I confirm that I have read and I accept the information stated above.'
      '#description': '<p><span style="color:#2E75B5;font-size:14.0pt;" lang="EN-US"><strong>Background</strong></span></p><p><span lang="EN-GB">The&nbsp;<strong>WHO Environment and Health Partnership on Human Biomonitoring (HBM)</strong>&nbsp;brings together 20 Member States to strengthen the application of human biomonitoring as a scientific tool for supporting regulatory decision-making on hazardous chemicals and protecting public health.</span></p><p><span lang="EN-GB">As part of the Partnership''s activities, and in collaboration with the&nbsp;<strong>Partnership for the Assessment of Risks from Chemicals (PARC)</strong>, particularly the work on sustainability and the long-term uptake of HBM, a survey has been developed to better understand how HBM data are currently used to support policy development, implementation and evaluation at national and international levels.</span></p><p><span lang="EN-GB">The survey aims to identify existing practices, challenges and opportunities related to the use of HBM in policymaking. The results will contribute to a report on the policy use of HBM and will also be used to organise a webinar presenting the main findings and showcasing examples of good practice.</span><br><span lang="EN-GB">The survey takes approximately 1015 minutes to complete.</span></p><p><span lang="EN-GB">Your experience and insights are highly valuable, and we greatly appreciate your participation.</span></p><p>&nbsp;</p><p><span style="color:#2E75B5;font-size:14.0pt;" lang="EN-GB"><strong>Data protection and consent</strong></span></p><p><span lang="EN-GB">Participation in this survey is voluntary.</span></p><p><span lang="EN-GB">The survey collects a limited amount of personal and professional information (e.g. organisation, country and professional role) solely for the purpose of analysing the responses and interpreting the survey results. Survey findings will be reported only in aggregated or anonymised form, and individual respondents will not be identified in any reports, publications or presentations without their explicit consent.</span></p><p><span lang="EN-GB">The data collected will be processed exclusively for the purposes of this survey and related activities within the WHO Environment and Health Partnership on Human Biomonitoring and PARC. Personal data will be handled in accordance with the&nbsp;<strong>General Data Protection Regulation (EU) 2016/679 (GDPR)&nbsp;</strong>and will be stored securely for the duration of the WHO Environment and Health Partnership on Human Biomonitoring (HBM), after which they will be deleted in accordance with applicable data retention policies.</span></p><p><span lang="EN-GB">By proceeding with the survey, you confirm that you have read and understood the information above and consent to the processing of your personal data for the purposes described.</span></p><p><span lang="EN-GB">If you have any questions about the survey or the processing of your data, please contact&nbsp;<strong>Maja Mampaey</strong>&nbsp;at&nbsp;<strong>maja.mampaey@vlaanderen.be</strong>.</span></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
  general_background_of_the_respondent:
    '#type': webform_wizard_page
    '#title': 'General background of the respondent'
    11_in_which_country_or_region:
      '#type': textfield
      '#title': '1. In which country or region (within a country) are you involved in human biomonitoring (HBM) activities?'
      '#description': '<h5><strong>1. In which country or region (within a country) are you involved in human biomonitoring (HBM) activities?</strong></h5>'
