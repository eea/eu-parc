    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': '6.1 Pretpostavimo da na društvenim mrežama kruže netočne informacije / glasine o riziku povezanom s pušenjem i kadmijem. Koju biste od sljedećih tvrdnji objavili?'
      '#options':
        "•\tA: Prilikom pušenja cigareta apsorpcija kadmija u plućima iznosi 10 – 50 %. Koncentracija kadmija u krvi pušača iznosi oko 1,5 μg/l, a koncentracija kadmija u bubrežnoj kori oko 20 – 30 μg/g mokre mase. Koncentracija kadmija u krvi u nepušača manja je 4 – 5 puta, a koncentracija kadmija u bubrežnoj kori dvostruko je niža. Dokazano je da kadmij uzrokuje rak pluća.": "•\tA: Prilikom pušenja cigareta apsorpcija kadmija u plućima iznosi 10 – 50 %. Koncentracija kadmija u krvi pušača iznosi oko 1,5 μg/l, a koncentracija kadmija u bubrežnoj kori oko 20 – 30 μg/g mokre mase. Koncentracija kadmija u krvi u nepušača manja je 4 – 5 puta, a koncentracija kadmija u bubrežnoj kori dvostruko je niža. Dokazano je da kadmij uzrokuje rak pluća."
        "•\tB: Prilikom pušenja cigareta apsorpcija kadmija u plućima iznosi 10 – 50 %, dok apsorpcija u probavnom traktu iznosi tek nekoliko posto. Pušači imaju otprilike 4 – 5 puta veće koncentracije kadmija u krvi (oko 1,5 μg/l) i dvostruko veće koncentracije kadmija u bubrežnoj kori (oko 20 – 30 μg/g mokre mase) od nepušača. Dokazano je da kadmij uzrokuje rak pluća, ali dokazi za njegovu povezanost s rakom bubrega, jetre i prostate su ograničeni.": "•\tB: Prilikom pušenja cigareta apsorpcija kadmija u plućima iznosi 10 – 50 %, dok apsorpcija u probavnom traktu iznosi tek nekoliko posto. Pušači imaju otprilike 4 – 5 puta veće koncentracije kadmija u krvi (oko 1,5 μg/l) i dvostruko veće koncentracije kadmija u bubrežnoj kori (oko 20 – 30 μg/g mokre mase) od nepušača. Dokazano je da kadmij uzrokuje rak pluća, ali dokazi za njegovu povezanost s rakom bubrega, jetre i prostate su ograničeni."
        "•\tC: Prilikom pušenja cigareta apsorpcija kadmija u plućima izuzetno je visoka, dok je apsorpcija u probavnom traktu niža. Pušači imaju znatno veće koncentracije kadmija u krvi i koncentracije kadmija u bubrežnoj kori. Kadmij je kancerogen.": "•\tC: Prilikom pušenja cigareta apsorpcija kadmija u plućima izuzetno je visoka, dok je apsorpcija u probavnom traktu niža. Pušači imaju znatno veće koncentracije kadmija u krvi i koncentracije kadmija u bubrežnoj kori. Kadmij je kancerogen."
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': '6.2 U znanstvenoj tvrdnji u nastavku navodi se sljedeće: „Akrilamid je kemikalija koja prirodno nastaje u prehrambenim proizvodima bogatima škrobom kada se kuhaju na visokim temperaturama (iznad 120 °C). Prisutnost akrilamida u hrani može potencijalno povećati rizik od razvoja raka u potrošača svih dobnih skupina. Srećom, postoje načini za smanjenje razina akrilamida u hrani.” Koju biste izjavu odabrali kada biste potrošačima trebali dati savjet o smanjenju razine akrilamida u hrani koju kuhaju kod kuće?'
      '#options':
        'Radi zaštite zdravlja škrobnu hranu treba pržiti, peći ili tostirati dok ne poprimi zlatnožutu (ili svjetliju) boju, a pregrijanu hranu treba izbjegavati.': 'Radi zaštite zdravlja škrobnu hranu treba pržiti, peći ili tostirati dok ne poprimi zlatnožutu (ili svjetliju) boju, a pregrijanu hranu treba izbjegavati.'
        'Dugotrajnim kuhanjem i na višim temperature stvara se veća količina akrilamida, koji u ljudi može uzrokovati rak, nego kada hranu kuhate kratko i na nižim temperaturama.': 'Dugotrajnim kuhanjem i na višim temperature stvara se veća količina akrilamida, koji u ljudi može uzrokovati rak, nego kada hranu kuhate kratko i na nižim temperaturama.'
      '#required': true
