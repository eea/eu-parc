id: croatia_risk_perception_of_risk
title: 'Croatia_Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks.</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Privola i kontekst'
    description:
      '#type': checkbox
      '#title': 'Potvrđujem da sam pročitao/la i prihvaćam gore navedene informacije.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="HR">Percepcija rizika među osobama koje obavještavaju o riziku</span></h4><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="HR">O PARC-u:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="HR">Europsko partnerstvo za procjenu rizika od kemikalija (PARC) rezultat je zajedničkih napora 30 zemalja i triju europskih agencija (EEA, ECHA, EFSA), a osmišljeno je radi rješavanja izazova povezanih s inovacijama u procjeni rizika od kemikalija. Cilj &nbsp;PARC-a je pružati pouzdane znanstvene podatke o izloženosti građana kemijskim onečišćivačima i njihovim mogućim učincima na zdravlje te na taj način omogućiti donošenje utemeljenih političkih odluka na razini Europe i na nacionalnoj razini. U [naziv vaše zemlje] anketu koordinira [naziv provedbene organizacije].</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="HR">Svrha ove ankete:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="HR">Izloženi smo brojnim kemikalijama od kojih neke mogu biti štetne za zdravlje. Obavještavanje o potencijalnom riziku od tih kemikalija izuzetno je važno. Pomoću ove ankete želimo &nbsp;saznati više o uobičajenim praksama koje primjenjuju osobe zadužene za obavještavanje o rizicima, njihovom mišljenju o percepciji rizika kao i o pitanjima i izazovima s kojima se suočavaju pri obavještavanju o opasnostima i rizicima.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="HR">Kome je anketa namijenjena:</span><span style="font-size:14.0pt;line-height:115%;" lang="HR"> Upitnik se uglavnom odnosi na obavještavanje o rizicima u svakodnevnim okolnostima, za razliku od obavještavanja u kriznim situacijama u okolnostima kada je potrebno donijeti hitne odluke. Za ispunjavanje će vam biti potrebno otprilike 20&nbsp;minuta.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008474;font-size:14.0pt;line-height:115%;" lang="HR">Što će se dogoditi s prikupljenim informacijama:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="HR">Prikupljene će informacije biti &nbsp;anonimne i s njima će se postupati kao s povjerljivim podatcima u skladu sa zahtjevima Opće uredbe o zaštiti podataka (GDPR). Prilikom analize koju obavljaju istraživački partneri PARC-a odgovori će se kombinirati s drugim odgovorima. Ako znanstveni zaključci ove ankete budu objavljeni ili predstavljeni na nekoj konferenciji, rezultati će biti agregirani.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="HR">Pravo na odbijanje ili povlačenje iz ankete:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="HR">Vaše je sudjelovanje u potpunosti dobrovoljno. Ispunjavanjem i slanjem ove ankete dajete svoju privolu za sudjelovanje u anketi. U bilo kojem trenutku, bez navođenja razloga i bez ikakvih posljedica, možete se povući iz sudjelovanja ili odlučiti da uopće nećete sudjelovati.</span></p><p style="margin-left:54.0pt;"><br><br><br><span style="font-family:Satoshi;font-size:14.0pt;line-height:110%;" lang="HR"><strong>Hvala vam na suradnji i izdvojenom vremenu!</strong></span></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
