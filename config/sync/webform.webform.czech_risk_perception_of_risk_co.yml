    '#type': webform_wizard_page
    '#title': '6. oddíl: Styl'
    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': '6.1 Předpokládejme, že se na sociálních sítích šíří dezinformace či fámy o riziku spojeném s kouřením a kadmiem. Které z následujících tvrzení byste použili?'
      '#options':
        'A: Při kouření cigaret se v plicích absorbuje 10–50 % kadmia. U kuřáků je koncentrace kadmia v krvi přibližně 1,5 μg/l a v kůře ledvin přibližně 20–30 μg/g čerstvé hmotnosti. Nekuřáci vykazují 4–5krát nižší koncentrace kadmia v krvi a 2krát nižší koncentrace kadmia v kůře ledvin. Bylo prokázáno, že kadmium způsobuje rakovinu plic.': 'A: Při kouření cigaret se v plicích absorbuje 10–50 % kadmia. U kuřáků je koncentrace kadmia v krvi přibližně 1,5 μg/l a v kůře ledvin přibližně 20–30 μg/g čerstvé hmotnosti. Nekuřáci vykazují 4–5krát nižší koncentrace kadmia v krvi a 2krát nižší koncentrace kadmia v kůře ledvin. Bylo prokázáno, že kadmium způsobuje rakovinu plic.'
        'B: Při kouření cigaret se v plicích absorbuje 10–50 % kadmia, zatímco v zažívacím traktu jen několik málo % kadmia. V porovnání s nekuřáky vykazují kuřáci přibližně 4–5krát vyšší koncentrace kadmia v krvi (přibližně 1,5 μg/l) a 2krát vyšší koncentrace kadmia v kůře ledvin (přibližně 20–30 μg/g čerstvé hmotnosti). Bylo prokázáno, že kadmium způsobuje rakovinu plic, o jeho spojitosti s rakovinou ledvin, jater a prostaty však existují pouze omezené důkazy.': 'B: Při kouření cigaret se v plicích absorbuje 10–50 % kadmia, zatímco v zažívacím traktu jen několik málo % kadmia. V porovnání s nekuřáky vykazují kuřáci přibližně 4–5krát vyšší koncentrace kadmia v krvi (přibližně 1,5 μg/l) a 2krát vyšší koncentrace kadmia v kůře ledvin (přibližně 20–30 μg/g čerstvé hmotnosti). Bylo prokázáno, že kadmium způsobuje rakovinu plic, o jeho spojitosti s rakovinou ledvin, jater a prostaty však existují pouze omezené důkazy.'
        'C: Při kouření cigaret je absorpce kadmia v plicích mimořádně vysoká, zatímco v zažívacím traktu je nižší. Kuřáci vykazují výrazně vyšší koncentrace kadmia v krvi i v kůře ledvin. Kadmium je karcinogenní.': 'C: Při kouření cigaret je absorpce kadmia v plicích mimořádně vysoká, zatímco v zažívacím traktu je nižší. Kuřáci vykazují výrazně vyšší koncentrace kadmia v krvi i v kůře ledvin. Kadmium je karcinogenní.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': '6.2 V tomto vědeckém vyjádření se uvádí, že: „akrylamid je chemická látka, která se přirozeně vytváří v potravinách obsahujících škrob při jejich přípravě při vysokých teplotách (nad 120 °C). Přítomnost akrylamidu v potravinách může potenciálně zvýšit riziko vzniku rakoviny u spotřebitelů v kterémkoli věku. Naštěstí existují možnosti, jak obsah akrylamidu ve stravě snížit.“ Které tvrzení byste zvolili, kdybyste měli spotřebitelům poradit, jak při vaření doma snížit obsah akrylamidu?'
      '#options':
        'Při smažení, pečení, toastování nebo opékání potravin obsahujících škrob se snažte dosáhnout zlatožluté (nebo světlejší) barvy a v zájmu zdraví se vyhýbejte potravinám připravovaným při příliš vysokých teplotách.': 'Při smažení, pečení, toastování nebo opékání potravin obsahujících škrob se snažte dosáhnout zlatožluté (nebo světlejší) barvy a v zájmu zdraví se vyhýbejte potravinám připravovaným při příliš vysokých teplotách.'
        'Při dlouhé době vaření a vyšších teplotách se vytváří více akrylamidu, který může u lidí způsobit rakovinu, než při kratší době vaření a nižších teplotách.': 'Při dlouhé době vaření a vyšších teplotách se vytváří více akrylamidu, který může u lidí způsobit rakovinu, než při kratší době vaření a nižších teplotách.'
      '#required': true
