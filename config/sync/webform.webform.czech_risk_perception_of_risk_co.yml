id: czech_risk_perception_of_risk_co
title: 'Czech_Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in Czech language. </span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Souhlas a kontext'
    description:
      '#type': checkbox
      '#title': 'Potvrzuji, že jsem si přečetl(a) výše uvedené informace a souhlasím s nimi.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="CS"><strong>Vnímání rizik ze strany osob, které o&nbsp;nich informují</strong></span></h4><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="CS"><strong>O&nbsp;partnerství PARC:&nbsp;</strong></span><span style="font-size:14.0pt;line-height:115%;" lang="CS">Evropské partnerství pro posuzování rizik chemických látek (PARC) je výsledkem společného úsilí 30&nbsp;zemí a&nbsp;3 evropských agentur (agentury EEA, agentury ECHA a&nbsp;úřadu EFSA). Bylo zřízeno za účelem řešení výzev v&nbsp;souvislosti se zaváděním inovací v&nbsp;posuzování chemických rizik. Cílem partnerství PARC je poskytovat podklady pro evropské a&nbsp;vnitrostátní politiky, konkrétně spolehlivá vědecká data o&nbsp;expozici občanů chemickým znečišťujícím látkám a&nbsp;o&nbsp;možných účincích na zdraví. Průzkum v&nbsp; ČR &nbsp;koordinuje RECETOX, Masarykova univerzita.&nbsp;</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="CS"><strong>Účel průzkumu:</strong>&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="CS">Všichni jsme vystaveni velkému množství chemických látek, z&nbsp;nichž některé mohou být zdraví škodlivé. Informování o&nbsp;potenciálních rizicích spojených s&nbsp;těmito chemickými látkami je velmi důležité. Cílem tohoto průzkumu je získat lepší přehled o&nbsp;běžných postupech používaných osobami, které o&nbsp;rizicích informují, o&nbsp;jejich názorech na vnímání rizik, jakožto i&nbsp;o&nbsp;jejich obavách a&nbsp;výzvách, jimž čelí při informování o&nbsp;nebezpečích a&nbsp;rizicích.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="CS"><strong>Komu je průzkum určen:</strong></span><span style="font-size:14.0pt;line-height:115%;" lang="CS"> Tento dotazník se týká především informování o&nbsp;rizicích v každodenním životě, nikoli poskytování informací v&nbsp;krizové situaci, kdy je zapotřebí přijímat naléhavá rozhodnutí. Jeho vyplnění vám zabere přibližně 20&nbsp;minut.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="CS"><strong>Co se stane se shromážděnými daty:&nbsp;</strong></span><span style="font-size:14.0pt;line-height:115%;" lang="CS">Shromážděná data budou anonymní a&nbsp;v&nbsp;souladu s&nbsp;požadavky obecného nařízení o&nbsp;ochraně osobních údajů (nařízení GDPR) s&nbsp;nimi bude zacházeno jako s&nbsp;důvěrnými. Poskytnuté odpovědi budou analyzovány společně s&nbsp;dalšími odpověďmi výzkumnými partnery PARC. Pokud budou vědecké závěry tohoto průzkumu zveřejněny nebo prezentovány na konferenci, budou získané výsledky sloučeny.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="CS"><strong>Právo odmítnout účast nebo z&nbsp;průzkumu odstoupit:</strong>&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="CS">Vaše účast je zcela dobrovolná. Vyplněním a&nbsp;odesláním tohoto dotazníku vyjadřujete souhlas s&nbsp;účastí v&nbsp;průzkumu. Účast si můžete kdykoli rozmyslet. Můžete se také rozhodnout, že se průzkumu nezúčastníte vůbec, a&nbsp;to bez udání důvodu a&nbsp;jakýchkoli následků.</span></p><p style="margin-left:54.0pt;"><br><br><br><span style="font-family:Satoshi;font-size:14.0pt;line-height:110%;" lang="CS"><strong>Děkujeme za váš čas a&nbsp;spolupráci.</strong></span></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
