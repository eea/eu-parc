id: france_risk_perception_of_risk_c
title: 'France_Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in French language. </span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Consentement et contexte'
    description:
      '#type': checkbox
      '#title': 'Je confirme avoir lu et accepté les informations ci-dessus.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="FR"><strong>Perception des risques par les personnes chargées de la communication des risques</strong></span></h4><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="FR">À propos du PARC:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="FR">Le Partenariat européen pour l’évaluation des risques liés aux substances chimiques est une initiative conjointe de 30&nbsp;pays et de 3&nbsp;agences européennes (l’AEE, l’ECHA et l’EFSA) qui vise à relever les défis liés aux innovations en matière d’évaluation des risques chimiques. L’objectif du PARC est de contribuer à l’élaboration des politiques en Europe et au niveau national grâce à des données scientifiques fiables sur l’exposition des citoyens aux polluants chimiques et sur leurs effets potentiels sur la santé. En/au [nom de votre pays], l’enquête est coordonnée par [nom de l’organisme chargé de la mise en œuvre].</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008474;font-size:14.0pt;line-height:115%;" lang="FR">Objet de la présente enquête:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="FR">Nous sommes tous&nbsp; exposés à une multitude de substances chimiques, dont certaines peuvent être nocives pour la santé. La communication sur les risques potentiels liés à ces substances est donc essentielle. Dans cette enquête, nous cherchons à mieux comprendre les pratiques communes des personnes chargées de la communication des risques, leurs avis sur la perception des risques, ainsi que leurs préoccupations et les défis auxquels ils sont confrontés lorsqu’ils communiquent sur les dangers et les risques.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="FR">Destinataires de l’enquête:</span><span style="font-size:14.0pt;line-height:115%;" lang="FR"> Ce questionnaire porte principalement sur la communication sur les risques dans des situations quotidiennes, par opposition à la communication de crise, qui désigne la communication dans des situations nécessitant des décisions urgentes. Il vous faudra environ 20&nbsp;minutes pour le compléter.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="FR">Traitement des données recueillies:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="FR">Les données recueillies seront anonymes et traitées de manière confidentielle, conformément aux exigences du règlement général sur la protection des données (RGPD). Les réponses seront regroupées avec d’autres réponses lors de leur analyse par les partenaires de recherche du PARC. Si les conclusions scientifiques de cette enquête sont publiées ou présentées lors d’une conférence, les résultats seront agrégés.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="FR">Droit de refus ou de retrait:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="FR">Votre participation est entièrement volontaire. En remplissant et en soumettant ce questionnaire, vous donnez votre consentement à participer à cette enquête. Vous êtes libre de retirer votre consentement à tout moment ou de décider de ne pas participer, sans avoir à fournir de justification et sans aucune conséquence.</span><br><br><span style="font-family:Satoshi;font-size:14.0pt;line-height:110%;" lang="FR"><strong>Nous vous remercions pour le temps que vous consacrerez à cette enquête et pour votre coopération.</strong></span></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
