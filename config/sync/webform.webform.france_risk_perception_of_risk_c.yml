  section_3_developing_risk_communication:
    '#type': webform_wizard_page
    '#title': '3. Partie: Développer la communication sur les risques'
    when_communicating_with_the_target_audience_on_risk_how_importan:
      '#type': webform_likert
      '#title': '3.1 Lorsque vous communiquez sur les risques auprès d’un public cible, dans quelle mesure est-il important d’inclure les éléments suivants?'
      '#required': true
      '#questions':
        'Utilisation d’illustrations visuelles des risques à l’aide de graphiques, de schémas, d’images et de cartes': 'Utilisation d’illustrations visuelles des risques à l’aide de graphiques, de schémas, d’images et de cartes'
        'Comparaisons entre différents dangers en fonction de leur probabilité': 'Comparaisons entre différents dangers en fonction de leur probabilité'
        'Description de toutes les incertitudes liées au risque': 'Description de toutes les incertitudes liées au risque'
        'Valeurs limites chiffrées (par exemple, dose journalière tolérable d’une substance chimique donnée, exprimée en chiffres)': 'Valeurs limites chiffrées (par exemple, dose journalière tolérable d’une substance chimique donnée, exprimée en chiffres)'
        'Description des différents risques selon les groupes de population  (par exemple, différence des risques entre différentes catég': 'Description des différents risques selon les groupes de population  (par exemple, différence des risques entre différentes catégories professionnelles)'
        'Informations sur la différence entre l’exposition à long terme et l’exposition à court terme à un danger': 'Informations sur la différence entre l’exposition à long terme et l’exposition à court terme à un danger'
        'Informations sur la sous-estimation des risques par le public (par exemple, lorsque la personne chargée de la communication des ': 'Informations sur la sous-estimation des risques par le public (par exemple, lorsque la personne chargée de la communication des risques dispose d’informations indiquant que le public ne perçoit pas certaines substances chimiques comme étant aussi dangereuses qu’elles le sont réellement)'
        'Information on overestimation of risk by the public (e.g. When risk communicator has the information that the public perceive': 'Informations sur la surestimation des risques par le public (par exemple, lorsque la personne chargée de la communication des risques dispose d’informations indiquant que le public perçoit certaines substances chimiques comme étant plus dangereuses qu’elles ne le sont réellement)'
        'Description des stratégies visant à éviter  l’exposition au danger': 'Description des stratégies visant à éviter  l’exposition au danger'
      '#answers':
        'Pas du tout important': 'Pas du tout important'
        'Peu important': 'Peu important'
        'Moyennement important': 'Moyennement important'
        'Assez important': 'Assez important'
        'Très important': 'Très important'
    when_communicating_risk_how_important_are_the_following_aspects:
      '#type': webform_likert
      '#title': '3.2 Lors de la communication des  risques, dans quelle mesure les aspects suivants liés à la confiance sont-ils imports  pour la perception des risques par le public cible, selon vous?'
      '#required': true
      '#questions':
        'Confiance du public accordée à la personne chargée de la communication des risques ': 'Confiance du public accordée à la personne chargée de la communication des risques '
        'Confiance du public dans les institutions et autorités nationales et européennes': 'Confiance du public dans les institutions et autorités nationales et européennes'
        'Confiance du public dans les données scientifiques': 'Confiance du public dans les données scientifiques'
      '#answers':
        'Pas du tout important': 'Pas du tout important'
        'Peu important': 'Peu important'
        'Moyennement important': 'Moyennement important'
        'Assez important': 'Assez important'
        'Très important': 'Très important'
    please_rate_statements_on_risk_communication_to_which_degree_you:
      '#type': webform_likert
      '#title': '3.3 Veuillez indiquer dans quelle mesure vous êtes d’accord ou non avec les affirmations suivantes concernant  la communication  des risques.'
      '#required': true
      '#questions':
        'Il importe de faire la distinction entre le danger et le risque dans la communication  des risques.': 'Il importe de faire la distinction entre le danger et le risque dans la communication  des risques.'
        'La communication  des risques ne devrait pas être influencée par la perception du public concernant ces risques.': 'La communication  des risques ne devrait pas être influencée par la perception du public concernant ces risques.'
        'Les principes (tels que l’objectivité et l’impartialité) sur lesquels repose la communication des risques sont cohérents dans to': 'Les principes (tels que l’objectivité et l’impartialité) sur lesquels repose la communication des risques sont cohérents dans tous les domaines (par exemple, les dangers chimiques ou les maladies transmissibles).'
        'Le fait de décrire toutes les incertitudes liées aux risques et aux dangers sème la confusion dans l’esprit du public.': 'Le fait de décrire toutes les incertitudes liées aux risques et aux dangers sème la confusion dans l’esprit du public.'
        'La communication des risques devrait être menée en collaboration avec les parties prenantes concernées.': 'La communication des risques devrait être menée en collaboration avec les parties prenantes concernées.'
        'Les médias d’information s’intéressent davantage à la communication de crise,  où la présentation des risques est souvent exagér': 'Les médias d’information s’intéressent davantage à la communication de crise,  où la présentation des risques est souvent exagérée.'
      '#answers':
        'Tout à fait en désaccord': 'Tout à fait en désaccord'
        'Partiellement en désaccord': 'Partiellement en désaccord'
        'Ni d’accord ni en désaccord': 'Ni d’accord ni en désaccord'
        'Partiellement d’accord': 'Partiellement d’accord'
        'Tout à fait d’accord': 'Tout à fait d’accord'
  section_4_role_of_risk_communicator:
    '#type': webform_wizard_page
    '#title': '4. Partie: Rôle de la personne chargée de la communication des risques'
    please_rate_statements_on_risk_perception_to_which_degree_you_ag:
      '#type': webform_likert
      '#title': "4.1.\tVeuillez indiquer dans quelle mesure vous êtes d’accord ou en désaccord avec les affirmations suivantes sur la perception des risques."
      '#required': true
      '#questions':
        'La perception des risques par le public tient compte ou dépend de ses convictions et de ses attitudes.': 'La perception des risques par le public tient compte ou dépend de ses convictions et de ses attitudes.'
        'La perception des risques n’est pas influencée par les jugements et les émotions des personnes (expérience personnelle).': 'La perception des risques n’est pas influencée par les jugements et les émotions des personnes (expérience personnelle).'
        'La perception des risques reflète les dispositions culturelles et sociales plus larges que les personnes adoptent face aux des d': 'La perception des risques reflète les dispositions culturelles et sociales plus larges que les personnes adoptent face aux des dangers et à leurs bénéfices .'
        'La communication des risques devrait s’appuyer sur les données probantes issues des évaluations des risques, mais également teni': 'La communication des risques devrait s’appuyer sur les données probantes issues des évaluations des risques, mais également tenir compte de la perception de ces dangers par les non-initiés et de l’importance qu’ils leur accordent.'
        'Les personnes qui ont déjà été confrontées à un incident lié à un danger ont tendance à penser qu’elles ont plus de chances d’y ': 'Les personnes qui ont déjà été confrontées à un incident lié à un danger ont tendance à penser qu’elles ont plus de chances d’y être de nouveau confrontées que celles qui n’ont jamais été exposées à ce danger.'
        'Lorsqu’une personne entend parler d’un danger pour la première fois, elle a tendance à penser que ce nouveau danger est plus sus': 'Lorsqu’une personne entend parler d’un danger pour la première fois, elle a tendance à penser que ce nouveau danger est plus susceptible de survenir que d’autres dangers déjà connus.'
        'The more specific knowledge people gain about a hazard, the less they rely on their intuition about risk related to this hazard.': 'Plus une personne acquiert de connaissances spécifiques sur un danger, moins elle se fie à son intuition concernant le risque associé à ce danger.'
        'La confiance accordée à la personne chargée de la communication des risques est plus importante que l’information elle-même.': 'La confiance accordée à la personne chargée de la communication des risques est plus importante que l’information elle-même.'
      '#answers':
