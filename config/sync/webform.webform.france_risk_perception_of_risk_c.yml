    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': '6.1 Supposons que de fausses informations ou des rumeurs circulent sur les réseaux sociaux concernant les risques liés au tabagisme et au cadmium. Parmi les affirmations suivantes, laquelle préféreriez-vous utiliser?'
      '#options':
        'A: With smoking cigarettes, the absorption of cadmium in the lungs is 10-50%. Smokers have about 1.5 μg/l blood cadmium concentrations, and kidney cortex cadmium concentrations about 20-30 μg/g wet weight. Non-smokers have 4-5 times lower blood cadmium concentrations and twice as low kidney cortex cadmium concentrations. Cadmium has been shown to cause lung cancer. ': "•\tA: Lorsque vous fumez, entre 10 % et 50 % du cadmium dans les cigarettes est absorbé par les poumons. Chez les fumeurs, la concentration en cadmium dans le sang est d’environ 1,5 μg/l, tandis que la concentration en cadmium dans le cortex rénal atteint 20 à 30 μg/g de poids humide. Chez les non-fumeurs, la concentration en cadmium dans le sang est quatre à cinq fois moins élevée et la concentration en cadmium dans le cortex rénal est deux fois moins élevée. Il a été démontré que le cadmium est cancérigène -- •\tA: Lorsque vous fumez, entre 10 % et 50 % du cadmium dans les cigarettes est absorbé par les poumons. Chez les fumeurs, la concentration en cadmium dans le sang est d’environ 1,5 μg/l, tandis que la concentration en cadmium dans le cortex rénal atteint 20 à 30 μg/g de poids humide. Chez les non-fumeurs, la concentration en cadmium dans le sang est quatre à cinq fois moins élevée et la concentration en cadmium dans le cortex rénal est deux fois moins élevée. Il a été démontré que le cadmium est cancérigène pour le poumon."
        'B: With smoking cigarettes, the absorption of cadmium in the lungs is 10-50%, while the absorption in the gastrointestinal tract is only a few percent. Smokers have about 4-5 times higher blood cadmium concentrations (about 1.5 μg/l), and twice as high kidney cortex cadmium concentrations (about 20-30 μg/g wet weight) as nonsmokers. Cadmium has been shown to cause lung cancer, but there is limited evidence that it is linked to kidney, liver and prostate cancer. ': "•\tB: Lorsque vous fumez, entre 10 % et 50 % du cadmium dans les cigarettes est absorbé par les poumons, alors qu’un très faible pourcentage est absorbé par le tube digestif. Les fumeurs présentent des concentrations de cadmium dans le sang environ 4 à 5 fois plus élevées (environ 1,5 μg/l) et des concentrations de cadmium dans le cortex rénal deux fois plus élevées (environ 20 à 30 μg/g de poids humide) que les non-fumeurs. Il a été démontré que le cadmium est cancérigène pour le poumon, mais les preuves co -- •\tB: Lorsque vous fumez, entre 10 % et 50 % du cadmium dans les cigarettes est absorbé par les poumons, alors qu’un très faible pourcentage est absorbé par le tube digestif. Les fumeurs présentent des concentrations de cadmium dans le sang environ 4 à 5 fois plus élevées (environ 1,5 μg/l) et des concentrations de cadmium dans le cortex rénal deux fois plus élevées (environ 20 à 30 μg/g de poids humide) que les non-fumeurs. Il a été démontré que le cadmium est cancérigène pour le poumon, mais les preuves concernant son lien avec les cancers du rein, du foie et de la prostate sont limitées."
        "•\tC: Lorsque vous fumez, vos poumons absorbent une très grande partie du cadmium contenu dans les cigarettes, tandis que le taux d’absorption est plus faible dans le tube digestif. Les fumeurs présentent des concentrations de cadmium dans le sang et dans le cortex rénal nettement plus élevées que les non-fumeurs. Le cadmium est cancérigène.": "•\tC: Lorsque vous fumez, vos poumons absorbent une très grande partie du cadmium contenu dans les cigarettes, tandis que le taux d’absorption est plus faible dans le tube digestif. Les fumeurs présentent des concentrations de cadmium dans le sang et dans le cortex rénal nettement plus élevées que les non-fumeurs. Le cadmium est cancérigène. -- •\tC: Lorsque vous fumez, vos poumons absorbent une très grande partie du cadmium contenu dans les cigarettes, tandis que le taux d’absorption est plus faible dans le tube digestif. Les fumeurs présentent des concentrations de cadmium dans le sang et dans le cortex rénal nettement plus élevées que les non-fumeurs. Le cadmium est cancérigène."
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tSelon la déclaration scientifique suivante, «l’acrylamide est une substance chimique qui se forme naturellement dans les aliments riches en amidon au cours des processus de cuisson à haute température (à plus de 120 °C). Lorsque l’acrylamide est présent dans les aliments, il augmente potentiellement le risque de cancer pour les consommateurs de tous âges. Heureusement, il existe des moyens de réduire les niveaux d’acrylamide dans les aliments». Quelle affirmation choisiriez-vous si vous deviez conseiller les consommateurs sur les façons de réduire au minimum les niveaux d’acrylamide lorsqu'ils cuisinent à la maison?"
      '#options':
        "•\tPour préserver votre santé, évitez la cuisson à haute température lorsque vous faites frire, cuire au four, griller ou rôtir des aliments riches en amidon. Évitez de faire brunir ces aliments et visez une couleur jaune doré.": "•\tPour préserver votre santé, évitez la cuisson à haute température lorsque vous faites frire, cuire au four, griller ou rôtir des aliments riches en amidon. Évitez de faire brunir ces aliments et visez une couleur jaune doré."
        "•\tLa formation de l’acrylamide, une substance cancérigène chez l’homme, augmente davantage lors de cuissons longues et à haute température que lors de cuissons courtes et à des températures plus basses.": "•\tLa formation de l’acrylamide, une substance cancérigène chez l’homme, augmente davantage lors de cuissons longues et à haute température que lors de cuissons courtes et à des températures plus basses."
      '#required': true
