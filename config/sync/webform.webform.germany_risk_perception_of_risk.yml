id: germany_risk_perception_of_risk
title: 'Germany_Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks.</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Einwilligung und Kontext'
    description:
      '#type': checkbox
      '#title': 'Ich bestätige, dass ich die oben genannten Informationen gelesen habe und akzeptiere.'
      '#description': '<p><strong>RISIKOWAHRNEHMUNG DURCH RISIKOKOMMUNIKATOREN</strong></p><p data-pm-slice="1 1 []"><span data-prompt-literal-paste="">Ihre Meinung zählt! Tragen Sie zu einem sichereren Chemikalienmanagement in Europa bei, indem Sie an einer kurzen Umfrage zum Thema „Risikowahrnehmung durch Risikokommunikatoren“ teilnehmen. Die Studie wird im Rahmen der europäischen Partnerschaft PARC (https://www.eu-parc.eu/) durchgeführt. PARC steht für „Partnership for the Assessment of Risks from Chemicals“ (Partnerschaft für die Risikobewertung von Chemikalien).</span></p><p><strong>Über PARC:</strong> Die Europäische Partnerschaft für die Risikobewertung von Chemikalien (PARC) ist ein Gemeinschaftsprojekt von 30 Ländern und drei EU-Behörden (EEA, ECHA, EFSA), das sich mit den Herausforderungen im Zusammenhang mit der Weiterentwicklung der chemischen Risikobewertung befasst. Ziel von PARC ist es, die politischen Entscheidungsträger in Europa und auf nationaler Ebene mit fundierten wissenschaftlichen Daten über die Exposition der Bevölkerung gegenüber chemischen Schadstoffen und deren möglichen Auswirkungen auf die Gesundheit zu versorgen. In [Name Ihres Landes] wird die Umfrage von [Name der durchführenden Einrichtung] koordiniert.</p><p><strong>Zweck dieser Umfrage:</strong> Wir alle sind einer Vielzahl von Chemikalien ausgesetzt, von denen einige gesundheitsschädlich sein können. Die Kommunikation über das von diesen Chemikalien ausgehende potenzielle Risiko ist von entscheidender Bedeutung. &nbsp;Mit dieser Umfrage möchten wir tiefere Einblicke in die gängigen Praktiken von Risikokommunikatoren und -kommunikatorinnen, ihre Ansichten zur Risikowahrnehmung sowie ihre Bedenken und die Herausforderungen gewinnen, denen sie bei der Kommunikation von Gefahren und Risiken gegenüberstehen.</p><p><strong>An wen sich diese Umfrage richtet:</strong> Diese Umfrage befasst sich hauptsächlich mit der Risikokommunikation im Alltag, im Gegensatz zur Krisenkommunikation, bei der es um die Kommunikation in Situationen geht, in denen dringende Entscheidungen erforderlich sind. Das Ausfüllen des Fragebogens dauert etwa 20 Minuten.</p><p><strong>Was geschieht mit den erhobenen Informationen?</strong> Die erhobenen Informationen werden anonymisiert erhoben und gemäß den Anforderungen der Datenschutz-Grundverordnung (DSGVO) vertraulich behandelt. Die Antworten werden bei der Auswertung durch die PARC-Forschungspartner mit anderen Antworten zusammengeführt. Sollten die wissenschaftlichen Schlussfolgerungen dieser Umfrage veröffentlicht oder im Rahmen einer Konferenz vorgestellt werden, werden die Ergebnisse aggregiert dargestellt.</p><p><strong>Ablehnungs- oder Widerrufsrecht:</strong> Ihre Teilnahme ist freiwillig. Mit dem Ausfüllen und Absenden dieser Umfrage erklären Sie sich mit der Teilnahme einverstanden. Es steht Ihnen frei, jederzeit und ohne Angabe von Gründen von der Teilnahme zurückzutreten oder sich von vornherein gegen eine Teilnahme zu entscheiden, ohne dass dies irgendwelche Konsequenzen nach sich zieht.</p><p><br><strong>Vielen Dank, dass Sie sich die Zeit für die Teilnahme nehmen.</strong></p>'
      '#description_display': before
      '#required': true
