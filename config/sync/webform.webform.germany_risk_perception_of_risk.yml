    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': '6.1. Nehmen wir an, dass in den sozialen Medien Falschinformationen oder Gerüchte über die mit Rauchen und Cadmium verbundenen Risiken kursieren. Welche der folgenden Aussagen würden Sie lieber verwenden?'
      '#options':
        'A: Beim Zigarettenrauchen werden 10 bis 50 % des Cadmiums durch die Lunge aufgenommen. Bei Raucherinnen und Rauchern liegt die Cadmiumkonzentration im Blut bei etwa 1,5 μg/l und die Cadmiumkonzentration in der Nierenrinde bei etwa 20 bis 30 μg/g Nassgewicht. Nichtraucherinnen und Nichraucher haben eine vier bis fünfmal niedrigere Cadmiumkonzentration im Blut und eine doppelt so hohe Cadmiumkonzentration in der Nierenrinde. Es wurde nachgewiesen, dass Cadmium Lungenkrebs verursacht.': 'A: Beim Zigarettenrauchen werden 10 bis 50 % des Cadmiums durch die Lunge aufgenommen. Bei Raucherinnen und Rauchern liegt die Cadmiumkonzentration im Blut bei etwa 1,5 μg/l und die Cadmiumkonzentration in der Nierenrinde bei etwa 20 bis 30 μg/g Nassgewicht. Nichtraucherinnen und Nichraucher haben eine vier bis fünfmal niedrigere Cadmiumkonzentration im Blut und eine doppelt so hohe Cadmiumkonzentration in der Nierenrinde. Es wurde nachgewiesen, dass Cadmium Lungenkrebs verursacht.'
        'B: Beim Zigarettenrauchen werden 10 bis 50 % des Cadmiums durch die Lunge aufgenommen, während im Magen-Darm-Trakt nur wenige Prozent aufgenommen werden. Raucherinnen und Raucher weisen eine etwa vier- bis fünfmal höhere Cadmiumkonzentration im Blut (etwa 1,5 μg/l) und eine doppelt so hohe Cadmiumkonzentration in der Nierenrinde (etwa 20 bis 30 μg/g Nassgewicht) auf wie Nichtraucherinnen und Nichraucher. Es wurde nachgewiesen, dass Cadmium Lungenkrebs verursacht, es gibt jedoch nur wenige Belege dafür, da': "•\tB: Beim Zigarettenrauchen werden 10 bis 50 % des Cadmiums durch die Lunge aufgenommen, während im Magen-Darm-Trakt nur wenige Prozent aufgenommen werden. Raucherinnen und Raucher weisen eine etwa vier- bis fünfmal höhere Cadmiumkonzentration im Blut (etwa 1,5 μg/l) und eine doppelt so hohe Cadmiumkonzentration in der Nierenrinde (etwa 20 bis 30 μg/g Nassgewicht) auf wie Nichtraucherinnen und Nichraucher. Es wurde nachgewiesen, dass Cadmium Lungenkrebs verursacht, es gibt jedoch nur wenige Belege dafür, da -- B: Beim Zigarettenrauchen werden 10 bis 50 % des Cadmiums durch die Lunge aufgenommen, während im Magen-Darm-Trakt nur wenige Prozent aufgenommen werden. Raucherinnen und Raucher weisen eine etwa vier- bis fünfmal höhere Cadmiumkonzentration im Blut (etwa 1,5 μg/l) und eine doppelt so hohe Cadmiumkonzentration in der Nierenrinde (etwa 20 bis 30 μg/g Nassgewicht) auf wie Nichtraucherinnen und Nichraucher. Es wurde nachgewiesen, dass Cadmium Lungenkrebs verursacht, es gibt jedoch nur wenige Belege dafür, dass es mit Nieren-, Leber- und Prostatakrebs in Verbindung steht."
        'C: Beim Rauchen von Zigaretten ist die Resorption von Cadmium in der Lunge extrem hoch, während die Resorption im Magen-Darm-Trakt geringer ist. Raucherinnen und Raucher haben eine signifikant höhere Cadmiumkonzentration im Blut und in der Nierenrinde. Cadmium ist krebserregend.': 'C: Beim Rauchen von Zigaretten ist die Resorption von Cadmium in der Lunge extrem hoch, während die Resorption im Magen-Darm-Trakt geringer ist. Raucherinnen und Raucher haben eine signifikant höhere Cadmiumkonzentration im Blut und in der Nierenrinde. Cadmium ist krebserregend.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': '6.2. In der folgenden wissenschaftlichen Erklärung heißt es: „Acrylamid ist eine Chemikalie, die sich auf natürliche Weise in stärkehaltigen Lebensmitteln bildet, wenn diese bei hohen Temperaturen (über 120 °C) gegart werden. Wenn Acrylamid in Lebensmitteln vorhanden ist, kann es potenziell das Krebsrisiko für Verbraucher aller Altersgruppen erhöhen. Glücklicherweise gibt es Möglichkeiten, den Acrylamidgehalt in Lebensmitteln zu senken.“ Welche Aussage würden Sie wählen, wenn Sie Verbraucher dazu beraten müssten, den Acrylamidgehalt bei der Zubereitung von Mahlzeiten zu Hause zu minimieren?'
      '#options':
        "•\tBei der Zubereitung stärkehaltiger Lebensmittel – ob frittiert, gebacken, geröstet oder gebraten – sollten Sie auf eine goldgelbe Farbe (oder heller) abzielen  und zur Förderung der Gesundheit eine Überhitzung der Speisen vermeiden. Versuchen Sie beim Braten, Backen, Toasten oder Rösten von stärkehaltigen Lebensmitteln, eine goldgelbe Farbe (oder heller) zu erreichen und meiden Sie überhitzte Lebensmittel –Ihrer Gesundheit zuliebe!": "•\tBei der Zubereitung stärkehaltiger Lebensmittel – ob frittiert, gebacken, geröstet oder gebraten – sollten Sie auf eine goldgelbe Farbe (oder heller) abzielen  und zur Förderung der Gesundheit eine Überhitzung der Speisen vermeiden. Versuchen Sie beim Braten, Backen, Toasten oder Rösten von stärkehaltigen Lebensmitteln, eine goldgelbe Farbe (oder heller) zu erreichen und meiden Sie überhitzte Lebensmittel –Ihrer Gesundheit zuliebe!"
        "•\tBei langen Garzeiten und höheren Temperaturen entsteht mehr Acrylamid, das beim Menschen Krebs auslösen kann, als bei kurzen Garzeiten und niedrigeren Temperaturen.": "•\tBei langen Garzeiten und höheren Temperaturen entsteht mehr Acrylamid, das beim Menschen Krebs auslösen kann, als bei kurzen Garzeiten und niedrigeren Temperaturen."
