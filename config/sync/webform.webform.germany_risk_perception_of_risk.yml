        'Menschen, die zuvor einen Vorfall im Zusammenhang mit einer Gefahr erlebt haben, haben tendenziell das Gefühl, dass die Wahrsche': 'Menschen, die zuvor einen Vorfall im Zusammenhang mit einer Gefahr erlebt haben, haben tendenziell das Gefühl, dass die Wahrscheinlichkeit einer erneuten Gefahr größer ist als Menschen, die diese Gefahr noch nie erlebt haben.'
