        'Informationen zur Unterschätzung von Risiken durch die Öffentlichkeit (z. B. wenn der Risikokommunikator, bzw. die -kommunikator': 'Informationen zur Unterschätzung von Risiken durch die Öffentlichkeit (z. B. wenn der Risikokommunikator, bzw. die -kommunikatorin weiß, dass die Öffentlichkeit bestimmte Chemikalien als nicht so gefährlich einschätzt, wie es eigentlich sein sollte)'
        'Informationen zur Überschätzung von Risiken durch die Öffentlichkeit (z. B. wenn der Risikokommunikator, bzw. die –kommunikatori': 'Informationen zur Überschätzung von Risiken durch die Öffentlichkeit (z. B. wenn der Risikokommunikator, bzw. die –kommunikatorin  weiß, dass die Öffentlichkeit bestimmte Chemikalien als gefährlicher einschätzt, als sie eigentlich sind)'
        'Beschreibung der Strategien zur Expositionsvermeidung': 'Beschreibung der Strategien zur Expositionsvermeidung'
      '#answers':
        'Überhaupt nicht wichtig': 'Überhaupt nicht wichtig'
        'Kaum wichtig': 'Kaum wichtig'
        'Relativ wichtig': 'Relativ wichtig'
        'Durchaus wichtig': 'Durchaus wichtig'
        'Sehr wichtig': 'Sehr wichtig'
