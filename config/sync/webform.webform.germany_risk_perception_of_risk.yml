      '#required': true
      '#questions':
        'Veranschaulichung von Risiken mithilfe von Grafiken, Diagrammen, Bildern und Karten': 'Veranschaulichung von Risiken mithilfe von Grafiken, Diagrammen, Bildern und Karten'
        'Vergleiche zwischen verschiedenen Gefahren nach ihrer Wahrscheinlichkeit': 'Vergleiche zwischen verschiedenen Gefahren nach ihrer Wahrscheinlichkeit'
        'Beschreibung aller mit dem Risiko verbundenen Unsicherheiten': 'Beschreibung aller mit dem Risiko verbundenen Unsicherheiten'
        'Grenzwerte (z. B. tolerierbare tägliche Aufnahmemenge für eine bestimmte Chemikalie als quantitative Angabe)': 'Grenzwerte (z. B. tolerierbare tägliche Aufnahmemenge für eine bestimmte Chemikalie als quantitative Angabe)'
        'Beschreibung der verschiedenen Risiken für verschiedene Personengruppen. (z. B. unterschiedliches Risiko für verschiedene Berufs': 'Description of different risks for different groups of people (e.g., difference in risk for different occupational groups) '
