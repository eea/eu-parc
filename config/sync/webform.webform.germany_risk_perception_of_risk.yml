    please_rate_statements_on_risk_communication_to_which_degree_you:
      '#type': webform_likert
      '#title': '3.3. Bitte bewerten Sie die Aussagen zur Risikokommunikation danach, inwieweit Sie ihnen zustimmen oder nicht zustimmen.'
      '#required': true
      '#questions':
        'Bei der Risikokommunikation ist es wichtig, zwischen Gefahren und Risiken zu unterscheiden.': 'Bei der Risikokommunikation ist es wichtig, zwischen Gefahren und Risiken zu unterscheiden.'
        'Die Risikokommunikation sollte nicht von der Risikowahrnehmung der Öffentlichkeit beeinflusst werden.': 'Die Risikokommunikation sollte nicht von der Risikowahrnehmung der Öffentlichkeit beeinflusst werden.'
        'Die Grundsätze (z. B. Objektivität, Unparteilichkeit), auf denen die Risikokommunikation beruht, gelten einheitlich für alle Ber': 'Die Grundsätze (z. B. Objektivität, Unparteilichkeit), auf denen die Risikokommunikation beruht, gelten einheitlich für alle Bereiche (z. B. chemische Gefahren, übertragbare Krankheiten).'
        'Es verwirrt die Menschen, wenn alle mit einem Risiko oder einer Gefahr verbundenen Unsicherheiten beschrieben werden.': 'Describing all uncertainties related to risk and hazard confuses people. '
        'Die Risikokommunikation sollte in Zusammenarbeit mit den betroffenen Interessengruppen erfolgen.': 'Die Risikokommunikation sollte in Zusammenarbeit mit den betroffenen Interessengruppen erfolgen.'
        'Die Medien interessieren sich stärker für diejenige Krisenkommunikation, bei der Risiken  übertrieben dargestellt werden.': 'Die Medien interessieren sich stärker für diejenige Krisenkommunikation, bei der Risiken  übertrieben dargestellt werden.'
      '#answers':
