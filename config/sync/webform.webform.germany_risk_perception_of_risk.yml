    please_rate_statements_on_risk_perception_to_which_degree_you_ag:
      '#type': webform_likert
      '#title': '4.1. Bitte bewerten Sie die Aussagen zur Risikowahrnehmung danach, inwieweit Sie ihnen zustimmen oder nicht zustimmen.'
      '#required': true
      '#questions':
        'Die Überzeugungen und Einstellungen der Menschen beeinflussen, bzw. sind Teil ihrer Risikowahrnehmung.': 'Die Überzeugungen und Einstellungen der Menschen beeinflussen, bzw. sind Teil ihrer Risikowahrnehmung.'
        'Die Risikowahrnehmung wird nicht von den Urteilen und Gefühlen, bzw. denpersönlichen Erfahrungen der Menschen beeinflusst.': 'Die Risikowahrnehmung wird nicht von den Urteilen und Gefühlen, bzw. denpersönlichen Erfahrungen der Menschen beeinflusst.'
