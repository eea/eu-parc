    question_2_intro:
      '#type': webform_markup
      '#markup': '<p><strong>2. Please indicate the current level of implementation for each of the following activities in your country or region.</strong></p><p style="margin-bottom:10px;"><strong>Definitions:</strong></p><ul><li data-list-item-id="eb73acbe5aa77c6a6ea30dbceca2ead4a"><strong>Not started</strong><br>No activities, initiatives, or concrete plans are in place.</li><li data-list-item-id="e1c0cce4b9fbfb8fecaded871d17100db"><strong>Early development</strong><br>The activity is in the planning, design, or pilot phase (e.g. feasibility studies, initial discussions, small-scale testing).</li><li data-list-item-id="e072e5188b4fbba7e93af4c754314eb5c"><strong>Partially implemented</strong><br>The activity is already in use, but not yet fully established, scaled up, or systematically implemented (e.g. limited coverage, fragmented implementation, or temporary arrangements).</li><li data-list-item-id="e02c3f9fd5a4aad4eeda88ce128f87cea"><strong>Fully implemented / operational</strong><br>The activity is fully functioning and regularly carried out, but long-term sustainability (e.g. stable funding, institutionalisation) may not yet be ensured.</li></ul>'
