rial, Verdana, sans-serif;font-size:12px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px;orphans:2;overflow:visible;padding:0px;position:relative;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;user-select:text;white-space:normal;widows:2;word-spacing:0px;"><p class="Paragraph SCXW256404655 BCX8" style="-webkit-tap-highlight-color:transparent;-webkit-user-drag:none;background-color:transparent;color:windowtext;font-kerning:none;font-style:normal;font-weight:normal;margin:0px 0px 10.6667px;overflow-wrap:break-word;padding:0px;text-align:justify;text-indent:0px;user-select:text;vertical-align:baseline;" paraid="299881863" paraeid="{804722a9-93c9-43a8-8171-eb69f2bd3cfd}{102}"><span class="TextRun SCXW256404655 BCX8 NormalTextRun" style="-webkit-tap-highlight-color:transparent;-webkit-user-drag:none;font-family:Satoshi, Satoshi_EmbeddedFont, Satoshi_MSFontService, sans-serif;font-size:11pt;font-variant-ligatures:none !important;line-height:20.85px;margin:0px;padding:0px;user-select:text;" data-contrast="auto" xml:lang="EN-GB" lang="EN-GB">This survey is carried out under Task 2.3 "Sustainability" as part of the development of the PARC exit strategy. It is addressed to all National Hub Contact Points (NHCPs) to assess progress towards ensuring the sustainability of PARC activities at national level beyond the lifetime of the Partnership.</span><span class="EOP Selected SCXW256404655 BCX8" style="-webkit-tap-highlight-color:transparent;-webkit-user-drag:none;background-color:rgb(198, 198, 198) !important;border-color:rgb(198, 198, 198) !important;cursor:default;font-family:Satoshi, Satoshi_EmbeddedFont, Satoshi_MSFontService, sans-serif;font-size:11pt;line-height:20.85px;margin:0px;padding:0px;user-select:text;" data-ccp-props="{&quot;335551550&quot;:6,&quot;335551620&quot;:6}">&nbsp;</span></p></div><div class="OutlineElement Ltr SCXW256404655 BCX8" style="-webkit-tap-highlight-color:transparent;-webkit-text-stroke-width:0px;-webkit-user-drag:none;background-color:rgb(255, 255, 255);clear:both;color:rgb(0, 0, 0);cursor:text;direction:ltr;font-family:&quot;Segoe UI&quot;, &quot;Segoe UI Web&quot;, Arial, Verdana, sans-serif;font-size:12px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin:0px;orphans:2;overflow:visible;padding:0px;position:relative;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;user-select:text;white-space:normal;widows:2;word-spacing:0px;"><p class="Paragraph SCXW256404655 BCX8" style="-webkit-tap-highlight-color:transparent;-webkit-user-drag:none;background-color:transparent;color:windowtext;font-kerning:none;font-style:normal;font-weight:normal;margin:0px 0px 10.6667px;overflow-wrap:break-word;padding:0px;text-align:justify;text-indent:0px;user-select:text;vertical-align:baseline;" paraid="209255899" paraeid="{804722a9-93c9-43a8-8171-eb69f2bd3cfd}{120}"><span class="TextRun SCXW256404655 BCX8 NormalTextRun" style="-webkit-tap-highlight-color:transparent;-webkit-user-drag:none;font-family:Satoshi, Satoshi_EmbeddedFont, Satoshi_MSFontService, sans-serif;font-size:11pt;font-variant-ligatures:none !important;line-height:20.85px;margin:0px;padding:0px;user-select:text;" data-contrast="auto" xml:lang="EN-GB" lang="EN-GB">The first exit strategy survey established a baseline by identifying priorities and possible frameworks to sustain PARC activities after the project. This second survey aims to monitor progress by identifying which activities have advanced since the first survey, assessing their current level of implementation and long-term sustainability, and evaluating the contribution of PARC to these developments.</span><span class="EOP Selected SCXW256404655 BCX8" style="-webkit-t