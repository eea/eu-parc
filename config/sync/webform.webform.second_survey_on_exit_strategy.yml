elements: |-
  second_survey_on_exit_strategy:
    '#type': webform_wizard_page
    '#title': 'SECOND SURVEY ON EXIT STRATEGY'
    description:
      '#type': checkbox
      '#title': 'I confirm that I have read and I accept the information stated above'
      '#description': '<h5><strong>Second Survey on Exit Strategy</strong><br>&nbsp;</h5><p>This survey is carried out under Task 2.3 "Sustainability" as part of the development of the PARC exit strategy. It is addressed to all National Hub Contact Points (NHCPs) to assess progress towards ensuring the sustainability of PARC activities at national level beyond the lifetime of the Partnership.</p><p>The first exit strategy survey established a baseline by identifying priorities and possible frameworks to sustain PARC activities after the project. This second survey aims to monitor progress by identifying which activities have advanced since the first survey, assessing their current level of implementation and long-term sustainability, and evaluating the contribution of PARC to these developments.</p><p>In addition, the survey seeks to identify the main barriers that may hinder the sustainable implementation of PARC activities at national level. The information collected will provide evidence to support the further development and implementation of the PARC exit strategy, identify good practices and remaining challenges, and demonstrate the long-term impact of the Partnership.</p><p>We kindly ask each NHCP to coordinate the completion of this survey. Where appropriate, NHCPs are encouraged to consult with National Hub members. One consolidated response representing the national perspective is expected from each country.</p><p>The collected information will be treated confidentially in accordance with the requirements of the General Data Protection Regulation (GDPR). Data obtained from this survey will be stored by the National Center for Public Health and Pharmacy (NCPHP) during the implementation of the PARC project and for up to five years after its completion. The data will be processed by the Task 2.3 partners for the purposes described above.</p><p>The deadline for completing the survey is <strong>30 November 2026</strong>.</p><p>Thank you for taking the time to complete this survey.</p><p>If you have any questions, please contact us.</p><p>Task 2.3 Co-leaders</p><ul><li data-list-item-id="e434832c973813c6f088ef7bcadaf8b67">Tamás Szigeti (<a href="mailto:szigeti.tamas@nngyk.gov.hu">szigeti.tamas@nngyk.gov.hu</a>)</li><li data-list-item-id="e4310920c6200f06d200d7ede7e7f749e">Adrienne Pittman (<a href="mailto:adrienne.pittman@anses.fr">adrienne.pittman@anses.fr</a>) &nbsp;</li><li data-list-item-id="e8725b81bbd0ee718c8e6080cac24cc69">Robert Barouki (<a href="mailto:robert.barouki@parisdescartes.fr">robert.barouki@parisdescartes.fr</a>)</li></ul><p>&nbsp;</p>'
      '#more_title': ' I confirm that I have read and I accept the information stated above'
      '#title_display': inline
      '#description_display': before
      '#required': true
