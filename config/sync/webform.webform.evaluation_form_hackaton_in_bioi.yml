    i_confirm_that_i_have_read_and_i_accept_the_information_stated_a:
      '#type': checkbox
      '#title': 'I confirm that I have read and I accept the information stated above'
      '#description': '<h3><strong>Context and Consent</strong></h3><p><span lang="EN-US">As we concluded the Hackaton for Bioinformatics, convened by the PARC project, we would appreciate it if you could spend some time completing this evaluation questionnaire.&nbsp;</span><br><br><span lang="EN-US">All data collected in this form are anonymous and will be used only for training evaluation and PARC project reporting. Your feedback will be of uttermost value so that we can continue to improve and refine future activities. Data collected will be saved and stored by the National Institute of Health Dr. Ricardo Jorge (INSA), Portugal.</span><br><br>&nbsp;</p>'
