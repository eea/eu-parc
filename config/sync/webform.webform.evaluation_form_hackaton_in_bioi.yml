              filled: true
          - or
          - ':input[name="satisfaction_with_course_content_structure_delivery_methods_and[The supporting materials provided were useful and pertinent]"]':
              filled: true
          - or
          - ':input[name="satisfaction_with_course_content_structure_delivery_methods_and[The balance between presentations and other activities was suitable ]"]':
              filled: true
          - or
          - ":input[name=\"satisfaction_with_course_content_structure_delivery_methods_and[The trainers’ explanations were clear and understandable•\tOverall, the trainers’ explanations were clear and understandable]\"]":
              filled: true
          - or
          - ':input[name="satisfaction_with_course_content_structure_delivery_methods_and[Trainers provided adequate opportunities for questions and discussion during class time]"]':
              filled: true
          - or
          - ':input[name="satisfaction_with_course_content_structure_delivery_methods_and[The content of the course included new information for me]"]':
              filled: true
          - or
          - ":input[name=\"satisfaction_with_course_content_structure_delivery_methods_and[Overall, the training met my expectations•\tOverall, the training met my expectations]\"]":
              filled: true
          - or
          - ':input[name="satisfaction_with_course_content_structure_delivery_methods_and[I would recommend this course to others]"]':
              filled: true
          - or
          - ':input[name="satisfaction_with_course_content_structure_delivery_methods_and[I would be interested in attending a more advanced edition of this course ]"]':
              filled: true
