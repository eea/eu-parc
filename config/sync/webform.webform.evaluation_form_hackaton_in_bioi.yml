  motivation1:
    '#type': webform_wizard_page
    '#title': Evaluation
    satisfaction_with_course_organisation_2:
      '#type': webform_likert
      '#title': 'Satisfaction with course organisation'
      '#description': '<h3><strong>Evaluation</strong></h3><p>&nbsp;</p><h5><span lang="EN-US"><strong>Satisfaction with course organisation</strong></span></h5>'
      '#title_display': invisible
      '#description_display': before
      '#required': true
      '#questions':
        'All the information and materials necessary for course attendance were timely delivered': 'All the information and materials necessary for course attendance were timely delivered'
        'The venue provided all the conditions necessary (e.g., classroom/lab space, structure, furnishings etc.) ': 'The venue provided all the conditions necessary (e.g., classroom/lab space, structure, furnishings etc.) '
      '#answers':
        1: 'Strongly disagree'
        2: Disagree
        3: 'Neither agree nor disagree'
        4: Agree
        5: 'Strongly agree'
    if_you_have_any_additional_comment_on_this_matter_please_add_it:
      '#type': textfield
      '#title': 'If you have any additional comment on this matter, please add it here_org'
      '#description': '<h5><strong>If you have any additional comment on this matter, please add it here:</strong></h5>'
      '#title_display': invisible
      '#description_display': before
      '#states':
        visible-slide:
          - ':input[name="satisfaction_with_course_organisation_2[All the information and materials necessary for course attendance were timely delivered]"]':
              filled: true
          - or
          - ':input[name="satisfaction_with_course_organisation_2[The venue provided all the conditions necessary (e.g., classroom/lab space, structure, furnishings etc.) ]"]':
              filled: true
    satisfaction_with_course_content_structure_delivery_methods_and:
      '#type': webform_likert
      '#title': 'Satisfaction with course content/structure, delivery methods and trainer(s)'
      '#description': '<h5><span lang="EN-US"><strong>Satisfaction with course content/structure, delivery methods and trainer(s)</strong></span></h5>'
      '#title_display': invisible
      '#description_display': before
      '#required': true
      '#questions':
        'The agenda was interesting, useful, and well-structured': 'The agenda was interesting, useful, and well-structured'
        'The objectives were clear and achievable': 'The objectives were clear and achievable'
        'There was a close agreement between the stated course objectives and what was covered during the training': 'There was a close agreement between the stated course objectives and what was covered during the training'
        'The method of delivery (in-person, hybrid, remote, online) was appropriate for the content of this course': 'The method of delivery (in-person, hybrid, remote, online) was appropriate for the content of this course'
        'The duration of the course was appropriate': 'The duration of the course was appropriate'
        'The supporting materials provided were useful and pertinent': 'The supporting materials provided were useful and pertinent'
        'The balance between presentations and other activities was suitable ': 'The balance between presentations and other activities was suitable '
        "The trainers’ explanations were clear and understandable•\tOverall, the trainers’ explanations were clear and understandable": "The trainers’ explanations were clear and understandable•\tOverall, the trainers’ explanations were clear and understandable"
        'Trainers provided adequate opportunities for questions and discussion during class time': 'Trainers provided adequate opportunities for questions and discussion during class time'
        'The content of the course included new information for me': 'The content of the course included new information for me'
        "Overall, the training met my expectations•\tOverall, the training met my expectations": "Overall, the training met my expectations•\tOverall, the training met my expectations"
        'I would recommend this course to others': 'I would recommend this course to others'
        'I would be interested in attending a more advanced edition of this course ': 'I would be interested in attending a more advanced edition of this course '
      '#answers':
        1: 'Strongly disagree'
        2: Disagree
        3: 'Neither agree nor disagree'
        4: Agree
        5: 'Strongly agree'
    if_you_have_any_additional_comment_on_this_matter_content:
      '#type': textfield
      '#title': 'If you have any additional comment on this matter, please add it here_cont'
      '#description': '<h5><strong>If you have any additional comment on this matter, please add it here:</strong></h5>'
      '#title_display': invisible
      '#description_display': before
      '#states':
        visible-slide:
