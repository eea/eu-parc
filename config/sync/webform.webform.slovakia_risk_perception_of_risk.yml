        'Vnímanie rizík ľuďmi je založené aj na presvedčeniach a postojoch ľudí alebo od nich závisí.': 'Vnímanie rizík ľuďmi je založené aj na presvedčeniach a postojoch ľudí alebo od nich závisí.'
        'Vnímanie rizika nie je ovplyvnené úsudkami a pocitmi ľudí (osobné skúsenosti).': 'Vnímanie rizika nie je ovplyvnené úsudkami a pocitmi ľudí (osobné skúsenosti).'
        'Vnímanie rizík odráža širšie kultúrne a spoločenské postoje, ktoré ľudia zaujímajú voči nebezpečnostiam a ich prínosom.': 'The principles (e.g. objectivity, impartiality) upon which risk communication is based are consistent across all sectors (e.g. chemical hazards, communicable diseases.'
        'Informovanie o rizikách by malo vychádzať z dôkazov získaných na základe hodnotenia rizík, malo by však zohľadňovať aj to, ako l': 'Informovanie o rizikách by malo vychádzať z dôkazov získaných na základe hodnotenia rizík, malo by však zohľadňovať aj to, ako laická verejnosť vníma nebezpečnosť a akú dôležitosť jej prikladá.'
        'Ľudia, ktorí už v minulosti zažili mimoriadnu udalosť súvisiacu s určitou nebezpečnosťou, majú sklon domnievať sa, že je väčšia ': 'Ľudia, ktorí už v minulosti zažili mimoriadnu udalosť súvisiacu s určitou nebezpečnosťou, majú sklon domnievať sa, že je väčšia pravdepodobnosť, že ju zažijú znova, v porovnaní s ľuďmi, ktorí nič takéto nikdy nezažili.'
        'Keď sa ľudia po prvýkrát dozvedia o novej nebezpečnosti, majú sklon si myslieť, že je pravdepodobnejšie, že k tej situácii dôjde': 'Keď sa ľudia po prvýkrát dozvedia o novej nebezpečnosti, majú sklon si myslieť, že je pravdepodobnejšie, že k tej situácii dôjde, ako v prípade iných, dobre známych nebezpečností.'
