id: slovakia_risk_perception_of_risk
title: 'Slovakia_Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks.</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Súhlas a kontext'
    description:
      '#type': checkbox
      '#title': 'Potvrdzujem, že som si prečítal/-a vyššie uvedené informácie a súhlasím s nimi.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="SK">Vnímanie rizík osobami, ktoré o&nbsp;rizikách informujú</span></h4><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="SK">Čo je&nbsp;PARC:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="SK">Európske partnerstvo pre hodnotenie rizík chemických látok (PARC) je spoločný projekt 30&nbsp;krajín a&nbsp;3&nbsp;európskych agentúr (EEA, ECHA, EFSA), ktorého cieľom je riešiť výzvy spojené s&nbsp;inováciami v&nbsp;oblasti hodnotenia rizík chemických látok. Cieľom partnerstva PARC je poskytnúť spoľahlivé vedecké údaje o&nbsp;vystavení občanov chemickým znečisťujúcim látkam a&nbsp;ich možných účinkoch na zdravie, čím sa poskytne podklad pre tvorbu politických opatrení v&nbsp;Európe a&nbsp;na vnútroštátnej úrovni. Na Slovensku prieskum koordinuje Slovenská zdravotnícka univerzita.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="SK">Účel tohto prieskumu:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="SK">Každý z&nbsp;nás je vystavený veľkému množstvu chemických látok, z&nbsp;ktorých niektoré môžu byť škodlivé pre zdravie. Informovanie o&nbsp;potenciálnych rizikách spojených s&nbsp;týmito chemickými látkami má zásadný význam. Cieľom tohto prieskumu je získať hlbší pohľad na bežné postupy používané odborníkmi pri informovaní o&nbsp;rizikách, na ich názory na vnímanie rizík, ako aj na ich obavy a&nbsp;výzvy, s&nbsp;ktorými sa stretávajú pri informovaní o&nbsp;nebezpečnosti a&nbsp;rizikách.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="SK">Komu je prieskum určený:</span><span style="font-size:14.0pt;line-height:115%;" lang="SK"> Tento dotazník sa zameriava najmä na informovanie o&nbsp;rizikách v&nbsp;každodenných podmienkach, na rozdiel od krízovej komunikácie, ktorá sa vzťahuje na komunikáciu v mimoriadnych&nbsp;situáciách, ktoré si vyžadujú naliehavé rozhodnutia. Vyplnenie dotazníka vám zaberie približne 20&nbsp;minút.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008474;font-size:14.0pt;line-height:115%;" lang="SK">Čo sa stane so zhromaždenými informáciami:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="SK">Zhromaždené informácie budú anonymné a&nbsp;v&nbsp;súlade s požiadavkami </span><span style="color:#008474;font-size:14.0pt;line-height:115%;" lang="SK">V</span><span style="font-size:14.0pt;line-height:115%;" lang="SK">šeobecného nariadenia o&nbsp;ochrane údajov (GDPR) sa s nimi bude zaobchádzať ako s&nbsp;dôvernými informáciami. Poskytnuté odpovede sa pri ich analýze výskumnými partnermi PARC budú analyzovať spoločne s&nbsp;ďalšími odpoveďami. Ak </span><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="SK">budú&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="SK">vedecké závery tohto prieskumu </span><span style="color:#008474;font-size:14.0pt;line-height:115%;" lang="SK">uverejnené&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="SK">alebo </span><span style="color:#008474;font-size:14.0pt;line-height:115%;" lang="SK">prezentované&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="SK">na konferencii, </span><span style="color:#008474;font-size:14.0pt;line-height:115%;" lang="SK">budú uvádzané ako súhrnné výsledky</span><span style="font-size:14.0pt;line-height:115%;" lang="SK">.</span></p><p style="line-height:115%;margin-left:54.0pt;text-align:justify;"><span style="color:#008475;font-size:14.0pt;line-height:115%;" lang="SK">Právo na odmietnutie alebo odstúpenie z&nbsp;prieskumu:&nbsp;</span><span style="font-size:14.0pt;line-height:115%;" lang="SK">Vaša účasť je úplne dobrovoľná. Vyplnením a&nbsp;odoslaním tohto dotazníka vyjadrujete súhlas s&nbsp;účasťou na tomto prieskume. Z&nbsp;účasti môžete kedykoľvek odstúpiť. Môžete sa tiež rozhodnúť, že sa na prieskume vôbec nezúčastníte, a&nbsp;to bez uvedenia dôvodu a bez akýchkoľvek dôsledkov.</span></p><p style="margin-left:54.0pt;"><br><br><br><span style="font-family:Satoshi;font-size:14.0pt;line-height:110%;" lang="SK"><strong>Ďakujeme za váš čas a&nbsp;spoluprácu.</strong></span></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
