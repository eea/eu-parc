        'Informácie o podceňovaní rizika verejnosťou (napr. keď má osoba zodpovedná za informovanie o rizikách informácie o tom, že verej': 'Informácie o podceňovaní rizika verejnosťou (napr. keď má osoba zodpovedná za informovanie o rizikách informácie o tom, že verejnosť nevníma určité chemické látky tak nebezpečné, ako by mala)'
        'Informácie o preceňovaní rizika verejnosťou (napr. keď má osoba, ktorá informuje o rizikách informácie o tom, že verejnosť vníma': 'Informácie o preceňovaní rizika verejnosťou (napr. keď má osoba, ktorá informuje o rizikách informácie o tom, že verejnosť vníma určité chemické látky ako nebezpečnejšie, než v skutočnosti sú)'
