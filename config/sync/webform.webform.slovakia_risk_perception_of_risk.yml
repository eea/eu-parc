    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': '6.1 Predpokladajme, že v sociálnych médiách kolujú dezinformácie alebo fámy o rizikách spojených s fajčením a kadmiom. Ktoré z nasledujúcich tvrdení by ste radšej použili?'
      '#options':
        'A: Pri fajčení cigariet sa v pľúcach absorbuje 10 – 50 % kadmia. U fajčiarov sa koncentrácia kadmia v krvi pohybuje okolo 1,5 μg/l a v kôre obličiek okolo 20 – 30 μg/g mokrej hmotnosti. Nefajčiari majú 4 až 5-krát nižšiu koncentráciu kadmia v krvi a dvojnásobne nižšiu koncentráciu kadmia v kôre obličiek. Preukázalo sa, že kadmium spôsobuje rakovinu pľúc.': 'A: Pri fajčení cigariet sa v pľúcach absorbuje 10 – 50 % kadmia. U fajčiarov sa koncentrácia kadmia v krvi pohybuje okolo 1,5 μg/l a v kôre obličiek okolo 20 – 30 μg/g mokrej hmotnosti. Nefajčiari majú 4 až 5-krát nižšiu koncentráciu kadmia v krvi a dvojnásobne nižšiu koncentráciu kadmia v kôre obličiek. Preukázalo sa, že kadmium spôsobuje rakovinu pľúc.'
        'B: Pri fajčení cigariet sa v pľúcach absorbuje 10 – 50 % kadmia, zatiaľ čo v tráviacej sústave je to len niekoľko percent. V porovnaní s nefajčiarmi majú fajčiari v krvi približne 4 až 5-krát vyššiu koncentráciu kadmia (približne 1,5 μg/l) a v kôre obličiek dvojnásobne vyššiu koncentráciu kadmia (približne 20 – 30 μg/g mokrej hmotnosti). Preukázalo sa, že kadmium spôsobuje rakovinu pľúc. Existujú však len obmedzené dôkazy o tom, že súvisí s rakovinou obličiek, pečene a prostaty.': 'B: Pri fajčení cigariet sa v pľúcach absorbuje 10 – 50 % kadmia, zatiaľ čo v tráviacej sústave je to len niekoľko percent. V porovnaní s nefajčiarmi majú fajčiari v krvi približne 4 až 5-krát vyššiu koncentráciu kadmia (približne 1,5 μg/l) a v kôre obličiek dvojnásobne vyššiu koncentráciu kadmia (približne 20 – 30 μg/g mokrej hmotnosti). Preukázalo sa, že kadmium spôsobuje rakovinu pľúc. Existujú však len obmedzené dôkazy o tom, že súvisí s rakovinou obličiek, pečene a prostaty.'
        'C: Pri fajčení cigariet je absorpcia kadmia v pľúcach mimoriadne vysoká, zatiaľ čo absorpcia v tráviacej sústave je nižšia. Fajčiari majú výrazne vyššie koncentrácie kadmia v krvi a koncentrácie kadmia v kôre obličiek. Kadmium je karcinogénne.': 'C: With smoking cigarettes, the absorption of cadmium is extremely high in the lungs, while the absorption in the gastrointestinal tract is lower. Smokers have significantly higher blood cadmium concentrations and kidney cortex cadmium concentrations. Cadmium is carcinogenic. '
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': '6.2 V tomto vedeckom vyhlásení sa uvádza, že: „akrylamid je chemická látka, ktorá sa prirodzene tvorí v potravinách obsahujúcich škrob pri ich varení pri vysokých teplotách (nad 120 °C). Prítomnosť akrylamidu v potravinách môže potenciálne zvýšiť riziko vzniku rakoviny u spotrebiteľov všetkých vekových skupín. „Našťastie existujú spôsoby, ako znížiť obsah akrylamidu v potravinách.“ Aké tvrdenie by ste si zvolili, keby ste mali spotrebiteľom poradiť, ako znížiť obsah akrylamidu pri varení v domácnosti na čo najnižšiu mieru?'
      '#options':
        'Pri vyprážaní, pečení, opekaní alebo grilovaní potravín obsahujúcich škrob sa snažte dosiahnuť zlatožltú (alebo svetlejšiu) farbu a v záujme svojho zdravia sa vyhýbajte prepečeným potravinám.': 'Pri vyprážaní, pečení, opekaní alebo grilovaní potravín obsahujúcich škrob sa snažte dosiahnuť zlatožltú (alebo svetlejšiu) farbu a v záujme svojho zdravia sa vyhýbajte prepečeným potravinám.'
        'Pri dlhšom varení a vyšších teplotách vzniká viac akrylamidu, ktorý môže u ľudí spôsobiť rakovinu, ako pri krátkom varení a nižších teplotách.': 'Pri dlhšom varení a vyšších teplotách vzniká viac akrylamidu, ktorý môže u ľudí spôsobiť rakovinu, ako pri krátkom varení a nižších teplotách.'
      '#required': true
