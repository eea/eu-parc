  section_4_role_of_risk_communicator:
    '#type': webform_wizard_page
    '#title': 'Section 4: Role of risk communicator'
    please_rate_statements_on_risk_perception_to_which_degree_you_ag:
      '#type': webform_likert
      '#title': "4.1.\tPor favor, evalúe las afirmaciones sobre la percepción del riesgo indicando en qué medida está de acuerdo o en desacuerdo con ellas."
      '#required': true
      '#questions':
        'Las percepciones del riesgo de las personas incluyen o dependen de sus creencias y actitudes.': 'Las percepciones del riesgo de las personas incluyen o dependen de sus creencias y actitudes.'
        'La percepción del riesgo no se ve influida por los juicios y sentimientos de las personas (experiencia personal).': 'La percepción del riesgo no se ve influida por los juicios y sentimientos de las personas (experiencia personal).'
        'Las percepciones del riesgo reflejan las actitudes culturales y sociales generales que las personas adoptan ante los peligros y ': 'Las percepciones del riesgo reflejan las actitudes culturales y sociales generales que las personas adoptan ante los peligros y sus beneficios.'
        'La comunicación del riesgo debe basarse en los datos de las evaluaciones de riesgos, pero también debe tener en cuenta la percep': 'La comunicación del riesgo debe basarse en los datos de las evaluaciones de riesgos, pero también debe tener en cuenta la percepción y la importancia que el público en general atribuye a los peligros.'
        'Las personas que han vivido anteriormente un incidente relacionado con un peligro tienden a pensar que hay más probabilidades de': 'Las personas que han vivido anteriormente un incidente relacionado con un peligro tienden a pensar que hay más probabilidades de volver a enfrentarse a él, en comparación con las personas que nunca han experimentado ese peligro.'
        'Cuando las personas se enteran de un peligro por primera vez, tienden a pensar que es más probable que ese nuevo peligro se prod': 'Cuando las personas se enteran de un peligro por primera vez, tienden a pensar que es más probable que ese nuevo peligro se produzca que otros peligros ya conocidos.'
        'Cuanto más conocimiento específico adquieren las personas sobre un peligro, menos se basan en su intuición a la hora de evaluar ': 'Cuanto más conocimiento específico adquieren las personas sobre un peligro, menos se basan en su intuición a la hora de evaluar el riesgo asociado a ese peligro.'
