    when_communicating_with_the_target_audience_on_risk_how_importan:
      '#type': webform_likert
      '#title': "3.1.\tA la hora de informar al público destinatario sobre los riesgos, ¿qué importancia tiene incluir los siguientes aspectos?"
      '#required': true
      '#questions':
        'Uso de una ilustración visual del riesgo con gráficos, diagramas, imágenes y mapas': 'Uso de una ilustración visual del riesgo con gráficos, diagramas, imágenes y mapas'
        'Comparaciones entre diferentes peligros según la probabilidad': 'Comparaciones entre diferentes peligros según la probabilidad'
        'Descripción de todas las incertidumbres relacionadas con el riesgo': 'Descripción de todas las incertidumbres relacionadas con el riesgo'
        'Valores límite numéricos (por ejemplo, la ingesta diaria tolerable de una sustancia química concreta expresada en cifras)': 'Valores límite numéricos (por ejemplo, la ingesta diaria tolerable de una sustancia química concreta expresada en cifras)'
        'Descripción de los distintos riesgos para los diferentes grupos de personas. (p. ej. diferencia de riesgo para diferentes grupos': 'Descripción de los distintos riesgos para los diferentes grupos de personas. (p. ej. diferencia de riesgo para diferentes grupos profesionales)'
        'Información sobre la diferencia entre la exposición a un peligro a largo plazo y a corto plazo': 'Información sobre la diferencia entre la exposición a un peligro a largo plazo y a corto plazo'
        'Información sobre la subestimación del riesgo por parte del público (p. ej., cuando la persona que comunica el riesgo dispone de': 'Información sobre la subestimación del riesgo por parte del público (p. ej., cuando la persona que comunica el riesgo dispone de información que indica que el público no percibe determinadas sustancias químicas como peligrosas, como deberían)'
        'Información sobre la sobreestimación del riesgo por parte del público (por ejemplo, cuando la persona que comunica el riesgo sab': 'Información sobre la sobreestimación del riesgo por parte del público (por ejemplo, cuando la persona que comunica el riesgo sabe que el público percibe ciertas sustancias químicas como más peligrosas de lo que realmente son)'
        'Descripción de las estrategias para evitar la exposición al peligro': 'Descripción de las estrategias para evitar la exposición al peligro'
      '#answers':
        ' Ninguna importancia': ' Ninguna importancia'
        'Alguna importancia': 'Alguna importancia'
        ' Importancia moderada': ' Importancia moderada'
        'Bastante importancia': 'Bastante importancia'
        'Mucha importancia': 'Mucha importancia'
    when_communicating_risk_how_important_are_the_following_aspects:
