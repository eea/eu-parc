id: spanish_risk_perception_of_risk
title: 'Spanish Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in </span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(34, 34, 34);display:inline !important;float:none;font-family:&quot;Segoe UI&quot;;font-size:13.3333px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Spanish language.</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Consentimiento y contexto'
    description:
      '#type': checkbox
      '#title': 'Confirmo que he leído y acepto la información indicada anteriormente.'
      '#description': '<h4><span style="font-family:Satoshi;" lang="ES">Percepción del riesgo por parte de quienes se encargan de comunicar el riesgo</span></h4><p class="p1">¡Su opinión cuenta! Haga que su opinión cuente para lograr una gestión más segura de las sustancias químicas en Europa participando en una breve encuesta sobre la «Percepción del riesgo por parte de quienes se encargan de comunicar el riesgo». El estudio se lleva a cabo en el marco de PARC (https://www.eu-parc.eu/), cuyas siglas significan «Partenariado para la Evaluación de los Riesgos de las Sustancias Químicas».</p><p class="p2"><strong>Acerca de PARC:</strong> El Partenariado europeo para la Evaluación de los Riesgos Químicos (PARC) es una iniciativa conjunta de 30 países y tres agencias europeas (AEMA, ECHA y EFSA), creada para abordar los retos asociados a la innovación en la evaluación de riesgos químicos. El objetivo de la PARC es fundamentar la elaboración de políticas en Europa y a nivel nacional con datos científicos sólidos sobre la exposición de los ciudadanos a los contaminantes químicos y sus posibles efectos en la salud. En [nombre de su país], la encuesta está coordinada por [nombre de la organización ejecutora].</p><p class="p2"><strong>Objetivo de esta encuesta: </strong>Todas las personas estamos expuestas a una multitud de sustancias químicas, algunas de las cuales pueden ser perjudiciales para la salud. Es fundamental informar sobre los posibles riesgos que plantean estas sustancias químicas. Con esta encuesta pretendemos conocer mejor las prácticas habituales de quienes comunican los riesgos, sus opiniones sobre la percepción del riesgo, así como sus preocupaciones y los retos a los que se enfrentan a la hora de comunicar peligros y riesgos.</p><p class="p2"><strong>Personas destinatarias de la encuesta: </strong>Este cuestionario se centra principalmente en la comunicación de riesgos en situaciones cotidianas, a diferencia de la comunicación de crisis, que se refiere a la comunicación en situaciones que requieren decisiones urgentes. Le llevará unos 20 minutos completarla.</p><p class="p2"><strong>¿Qué ocurrirá con la información recopilada?</strong> La información recopilada será anónima y se tratará de forma confidencial, de conformidad con los requisitos del Reglamento General de Protección de Datos (RGPD). Las respuestas se combinarán con otras respuestas cuando sean analizadas por los investigadores de PARC. Si las conclusiones científicas de esta encuesta se publican o se presentan en una conferencia, los resultados se presentarán de forma agregada.</p><p class="p2"><strong>Derecho a negarse o a retirarse de la encuesta:</strong> Su participación es totalmente voluntaria. Al cumplimentar y enviar esta encuesta, indica su consentimiento para participar en ella. Puede retirarse en cualquier momento o decidir no participar en absoluto sin necesidad de dar explicaciones y sin que ello tenga ninguna consecuencia.<br><br><strong>Gracias por su tiempo y su cooperación.</strong></p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
