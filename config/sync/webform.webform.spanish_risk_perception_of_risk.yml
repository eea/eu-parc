      '#type': webform_likert
      '#title': "3.2.\tEvalúe las siguientes afirmaciones sobre la comunicación de riesgos indicando en qué medida está de acuerdo o en desacuerdo con ellas."
      '#required': true
      '#questions':
        'A la hora de informar sobre el riesgo, es importante distinguir entre peligro y riesgo.': 'A la hora de informar sobre el riesgo, es importante distinguir entre peligro y riesgo.'
        'La percepción del riesgo por parte del público no debe influir en la comunicación del riesgo.': 'La percepción del riesgo por parte del público no debe influir en la comunicación del riesgo.'
        'Los principios (por ejemplo, la objetividad y la imparcialidad) en los que se basa la comunicación del riesgo son los mismos en ': 'Los principios (por ejemplo, la objetividad y la imparcialidad) en los que se basa la comunicación del riesgo son los mismos en todos los sectores (por ejemplo, los riesgos químicos o las enfermedades transmisibles).'
        'La descripción de todas las incertidumbres relacionadas con el riesgo y el peligro confunde a las personas.': 'La descripción de todas las incertidumbres relacionadas con el riesgo y el peligro confunde a las personas.'
        'La comunicación del riesgo debe practicarse/llevarse a cabo en colaboración con las partes interesadas implicadas.': 'La comunicación del riesgo debe practicarse/llevarse a cabo en colaboración con las partes interesadas implicadas.'
        'Los medios de información están más interesados en la comunicación de crisis, en la que a menudo se exagera la presentación del ': 'Los medios de información están más interesados en la comunicación de crisis, en la que a menudo se exagera la presentación del '
