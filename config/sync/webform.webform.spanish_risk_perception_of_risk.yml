    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': "6.1.\tSupongamos que en las redes sociales circulan informaciones erróneas o rumores sobre el riesgo relacionado con el tabaco y el cadmio. ¿Cuál de las siguientes frases preferiría utilizar?"
      '#options':
        'A: Al fumar cigarrillos, la absorción de cadmio en los pulmones es del 10 al 50 %. Los fumadores presentan concentraciones de cadmio en sangre de aproximadamente 1,5 μg/l, y concentraciones de cadmio en la corteza renal de entre 20 y 30 μg/g de peso húmedo. Las personas no fumadoras presentan concentraciones de cadmio en sangre entre cuatro y cinco veces inferiores, y concentraciones de cadmio en la corteza renal dos veces menores. Se ha demostrado que el cadmio causa cáncer de pulmón.': 'A: Al fumar cigarrillos, la absorción de cadmio en los pulmones es del 10 al 50 %. Los fumadores presentan concentraciones de cadmio en sangre de aproximadamente 1,5 μg/l, y concentraciones de cadmio en la corteza renal de entre 20 y 30 μg/g de peso húmedo. Las personas no fumadoras presentan concentraciones de cadmio en sangre entre cuatro y cinco veces inferiores, y concentraciones de cadmio en la corteza renal dos veces menores. Se ha demostrado que el cadmio causa cáncer de pulmón.'
        'B: Al fumar cigarrillos, la absorción de cadmio en los pulmones es del 10 al 50 %, mientras que la absorción en el tracto gastrointestinal es de solo un pequeño porcentaje. Los fumadores presentan concentraciones de cadmio en sangre entre cuatro y cinco veces superiores (aproximadamente 1,5 μg/l) y concentraciones de cadmio en la corteza renal dos veces superiores (aproximadamente 20-30 μg/g de peso húmedo) a las de los no fumadores. Se ha demostrado que el cadmio provoca cáncer de pulmón, pero hay pocas ': 'B: Al fumar cigarrillos, la absorción de cadmio en los pulmones es del 10 al 50 %, mientras que la absorción en el tracto gastrointestinal es de solo un pequeño porcentaje. Los fumadores presentan concentraciones de cadmio en sangre entre cuatro y cinco veces superiores (aproximadamente 1,5 μg/l) y concentraciones de cadmio en la corteza renal dos veces superiores (aproximadamente 20-30 μg/g de peso húmedo) a las de los no fumadores. Se ha demostrado que el cadmio provoca cáncer de pulmón, pero hay pocas '
        'C: Al fumar cigarrillos, la absorción de cadmio es extremadamente alta en los pulmones, mientras que en el tracto gastrointestinal es menor. Los fumadores presentan concentraciones de cadmio en sangre y en la corteza renal significativamente más elevadas. El cadmio es carcinógeno.': 'C: Al fumar cigarrillos, la absorción de cadmio es extremadamente alta en los pulmones, mientras que en el tracto gastrointestinal es menor. Los fumadores presentan concentraciones de cadmio en sangre y en la corteza renal significativamente más elevadas. El cadmio es carcinógeno.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "6.2.\tLa siguiente declaración científica afirma que: «La acrilamida es una sustancia química que se forma de forma natural en los alimentos ricos en almidón cuando se cocinan a altas temperaturas (por encima de los 120 °C). Cuando la acrilamida está presente en los alimentos, puede aumentar el riesgo de cáncer para los consumidores de todas las edades. «Afortunadamente, hay formas de reducir los niveles de acrilamida en los alimentos». ¿Qué afirmación elegiría si tuviera que aconsejar a los consumidores sobre cómo reducir al mínimo los niveles de acrilamida en la cocina casera?"
      '#options':
        'Intente que adquieran un color amarillo dorado (o más claro) al freír, hornear, tostar o asar alimentos ricos en almidón, y evite que se calienten en exceso para cuidar su salud.': 'Intente que adquieran un color amarillo dorado (o más claro) al freír, hornear, tostar o asar alimentos ricos en almidón, y evite que se calienten en exceso para cuidar su salud.'
        'Los tiempos de cocción prolongados y las temperaturas más altas generan más acrilamida —sustancia que puede provocar cáncer en los seres humanos— que los tiempos de cocción cortos y las temperaturas más bajas.': 'Los tiempos de cocción prolongados y las temperaturas más altas generan más acrilamida —sustancia que puede provocar cáncer en los seres humanos— que los tiempos de cocción cortos y las temperaturas más bajas.'
      '#required': true
