        'Inimesed, kes on varem kogenud ohuintsidenti, kalduvad arvama, et sellise olukorraga uuesti kokku puutuda on tõenäolisem, võrrel': 'Inimesed, kes on varem kogenud ohuintsidenti, kalduvad arvama, et sellise olukorraga uuesti kokku puutuda on tõenäolisem, võrreldes inimestega, kes pole seda ohtu kunagi kogenud.'
