    31_let_s_assume_that_there_is_misinformation_rumour_in_social_me:
      '#type': radios
      '#title': "6.1.\tOletame, et sotsiaalmeedias levib valeteave või kuulujutt suitsetamise ja kaadmiumiga seotud ohtude kohta. Millist järgmistest väidetest eelistaksite kasutada?"
      '#options':
        'A: Sigarettide suitsetamisel on kaadmiumi imendumine kopsudes 10–50%. Suitsetajatel on vere kaadmiumikontsentratsioon u 1,5 μg/l ja neerukoore kaadmikontsentratsioon u 20–30 μg/g märgkaalu kohta. Mittesuitsetajatel on kaadmiumisisaldus veres 4–5 korda väiksem ja kaadmiumisisaldus neerukoores kaks korda väiksem. On tõestatud, et kaadmium põhjustab kopsuvähki.': 'A: Sigarettide suitsetamisel on kaadmiumi imendumine kopsudes 10–50%. Suitsetajatel on vere kaadmiumikontsentratsioon u 1,5 μg/l ja neerukoore kaadmikontsentratsioon u 20–30 μg/g märgkaalu kohta. Mittesuitsetajatel on kaadmiumisisaldus veres 4–5 korda väiksem ja kaadmiumisisaldus neerukoores kaks korda väiksem. On tõestatud, et kaadmium põhjustab kopsuvähki.'
        'B: Sigarettide suitsetamisel on kaadmiumi imendumine kopsudes 10–50%, samas kui seedetraktis imendumine on vaid mõni protsent. Suitsetajatel on mittesuitsetajatest u 4–5 korda kõrgem kaadmiumikontsentratsioon veres (u 1,5 μg/l) ja kaks korda suurem kaadmiumisisaldus neerukoores (u 20-30 μg/g märgkaalu kohta). On tõestatud, et kaadmium põhjustab kopsuvähki, kuid on vähe tõendeid, et see põhjustab neeru-, maksa- ja eesnäärmevähki.': 'B: Sigarettide suitsetamisel on kaadmiumi imendumine kopsudes 10–50%, samas kui seedetraktis imendumine on vaid mõni protsent. Suitsetajatel on mittesuitsetajatest u 4–5 korda kõrgem kaadmiumikontsentratsioon veres (u 1,5 μg/l) ja kaks korda suurem kaadmiumisisaldus neerukoores (u 20-30 μg/g märgkaalu kohta). On tõestatud, et kaadmium põhjustab kopsuvähki, kuid on vähe tõendeid, et see põhjustab neeru-, maksa- ja eesnäärmevähki.'
        'C: Sigarettide suitsetamisel on kaadmiumi imendumine kopsudes äärmiselt suur, samas kui seedetraktis imendumine on väiksem. Suitsetajatel on oluliselt kõrgem kaadmiumisisaldus veres ja neerukoores. Kaadmium on kantserogeenne.': 'C: Sigarettide suitsetamisel on kaadmiumi imendumine kopsudes äärmiselt suur, samas kui seedetraktis imendumine on väiksem. Suitsetajatel on oluliselt kõrgem kaadmiumisisaldus veres ja neerukoores. Kaadmium on kantserogeenne.'
      '#required': true
    32_the_following_scientific_statement_states_that_acrylamide_is:
      '#type': radios
      '#title': "1.22.\tJärgmises teadusväites märgitakse: „Akrüülamiid on kemikaal, mis tekib looduslikult tärkliserikastes toiduainetes, kui neid kuumutatakse kõrgel temperatuuril (üle 120 °C). Kui toidus esineb akrüülamiidi, võib see suurendada igas vanuses tarbijate vähki haigestumise riski. Õnneks on olemas viise, kuidas vähendada akrüülamiidi sisaldust toidus“. Millise väite valiksite, kui peaksite tarbijatele andma nõu akrüülamiidi sisalduse vähendamiseks kodus toiduvalmistamisel?"
      '#options':
        'Tärkliserikaste toitude praadimisel, küpsetamisel, röstimisel või grillimisel püüdke saavutada kuldkollane (või heledam) värvus ning tervise huvides vältige toidu liigset kuumutamist.': 'Tärkliserikaste toitude praadimisel, küpsetamisel, röstimisel või grillimisel püüdke saavutada kuldkollane (või heledam) värvus ning tervise huvides vältige toidu liigset kuumutamist.'
        'Pikemal küpsetamisel ja kõrgemal temperatuuril tekib rohkem akrüülamiidi, mis võib inimestel suurendada vähiriski, kui lühema küpsetusaja ja madalama temperatuuri korral.': 'Pikemal küpsetamisel ja kõrgemal temperatuuril tekib rohkem akrüülamiidi, mis võib inimestel suurendada vähiriski, kui lühema küpsetusaja ja madalama temperatuuri korral.'
      '#required': true
