      '#title': "4.1.\tHinnake palun järgmisi väiteid riskitaju kohta, märkides, mil määral nendega nõustute või ei nõustu."
      '#required': true
      '#questions':
        'Inimeste riskitaju hõlmab nende uskumusi ja hoiakuid ning sõltub neist.': 'Inimeste riskitaju hõlmab nende uskumusi ja hoiakuid ning sõltub neist.'
        'Riskitaju ei ole mõjutatud inimeste hinnangutest ja tunnetest (isiklik kogemus).': 'Riskitaju ei ole mõjutatud inimeste hinnangutest ja tunnetest (isiklik kogemus).'
        'Riskitaju peegeldab inimeste laiemat kultuurilist ja sotsiaalset suhtumist ohtudesse ja nendega  kaasnevatesse hüvedesse .': 'Riskitaju peegeldab inimeste laiemat kultuurilist ja sotsiaalset suhtumist ohtudesse ja nendega  kaasnevatesse hüvedesse .'
