id: estonian_risk_perception_of_risk
title: 'Estonian Risk perception of risk communicators'
description: '<p><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(0, 0, 0);display:inline !important;float:none;font-family:Calibri;font-size:14.6667px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:pre-wrap;widows:2;word-spacing:0px;">In this survey we aim to gain greater insights into the common practices employed by Risk Communicators, their beliefs about Risk Perception, as well as their concerns and the challenges they face when they communicate hazards and risks. Applied in </span><span style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);color:rgb(34, 34, 34);display:inline !important;float:none;font-family:Arial, Helvetica, sans-serif;font-size:small;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Estonian language</span></p>'
categories:
  - 'Risk Perception'
elements: |-
  consent:
    '#type': webform_wizard_page
    '#title': 'Nõusolek ja taust'
    description:
      '#type': checkbox
      '#title': 'Kinnitan, et olen ülaltoodud teabe läbi lugenud ja nõustun sellega.'
      '#description': '<h4><strong>Riskidest teavitajate riskitaju</strong></h4><p class="p1">Teie arvamus loeb! Aidake kaasa kemikaalide ohutumale juhtimisele Euroopas, osaledes lühiküsitluses teemal „Riskidest teavitajate riskitaju“. Uuring viiakse läbi PARCi raames (Partnership for the Assessment of Risks from Chemicals ehkkemikaalide riskihindamise partnerlus, https://www.eu-parc.eu/).</p><p class="p1">PARCist: Euroopa kemikaalidest riskihindamise partnerlus (PARC) on 30 riigi ja kolme Euroopa ameti (EEA, ECHA, EFSA) ühisalgatus, mille eesmärk on arendada ja ajakohastada kemikaaliriskide hindamist. PARCi eesmärk on toetada poliitika kujundamist Euroopa ja riiklikul tasandil usaldusväärsete teadusandmetega, mis kajastavad kodanike kokkupuudet keemiliste saasteainetega ja nende võimalikku tervisemõju. Eestis koordineerib küsitlust Terviseamet.</p><p class="p1">Uuringu eesmärk: Me kõik puutume kokku paljude kemikaalidega, millest mõni võib olla tervisele kahjulik. Nendest kemikaalidest tulenevast võimalikest riskidest teavitamine on äärmiselt oluline. Selle uuringu eesmärk on saada põhjalikum ülevaade riskidest teavitajate tavapärastest tööviisidest, arusaamadest riskitaju kohta ning muredest ja probleemidest, millega nad ohtudest ja riskidest eavitamisel/riskikommukatsioonil kokku puutuvad.</p><p class="p1">Kellele uuring on suunatud: Küsimustikus käsitletakse peamiselt riskidest kommunikatsiooni igapäevaolukordades, mitte kriisikommunikatsooni, mis viitab teabevahetusele kiireloomulisi otsuseid nõudvates olukordades. Vastamiseks kulub umbes 20 minutit.</p><p class="p1">Mis saab kogutud teabest? Kogutud teave on anonüümne ja neid käsitletakse konfidentsiaalselt kooskõlas isikuandmete kaitse üldmääruse nõuetega (Deneral Data Protection Regulation, GDPR).</p><p class="p1">PARCi teaduspartnerid analüüsivad teie vastuseid koos muude vastustega. Kui uuringu teaduslikud järeldused avaldatakse või kui neid esitletakse konverentsil, siis tulemused koondatakse.</p><p class="p1">Õigus keelduda või tagasi võtta: Teie osalemine on täiesti vabatahtlik. Küsitlusele vastamise ja vastuste esitamisega annate oma nõusoleku küsitluses osalemiseks. Teil on õigus igal ajal osalemisest loobuda või otsustada üldse mitte osaleda, ilma et peaksite seda põhjendama ja tagajärgedeta.</p><p class="p1">Täname teid aja ja koostöö eest!</p><p>&nbsp;</p>'
      '#description_display': before
      '#required': true
